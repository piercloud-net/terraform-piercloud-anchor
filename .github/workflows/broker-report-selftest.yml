# broker-report-selftest.yml — dispatch-only canary for the pc-control broker
# paths (M1 broker leg (b) b2 report + b3a DNS writes; pc-control #123/#131).
#
# It proves the OIDC trust chain end to end (token mint -> broker verify ->
# registry write -> provider write) without touching netcup: the job selects
# the caller-provided environment (so the token's `sub` matches a real
# registry-bound environment), mints a token with the broker audience and
# POSTs a documentation-range IPv4 for the given anchor_ref (b2), then writes
# the anchor A + dashboard CNAME and a DNS-01 challenge TXT through the broker
# (b3a — the same run id, which the A-write cross-check requires), and
# optionally proves a mismatched A value is refused. Use it to verify a broker
# deploy/rotation, or as the live-proof driver for the pc-control b2/b3a
# slices.
#
# Security: the broker allowlists this workflow ONLY during a proof window
# (see the pc-control broker role defaults) — a permanent allowlist entry
# would let an anchor-repo writer report an IP without the managed-tenant
# preflight that provision.yml enforces. The environment input is safe to
# expose because the broker's registry check requires the environment to
# exist with a matching repository binding; an auto-created environment
# fails closed at the registry.
name: broker-report-selftest

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose OIDC sub to use (must be registry-bound, e.g. a proof environment)."
        required: true
        type: string
      anchor_ref:
        description: "Anchor lane reference to report for (must exist in that environment's tenant)."
        required: true
        default: "broker-selftest"
        type: string
      ipv4:
        description: "IPv4 to report (default: TEST-NET-1 documentation range)."
        required: false
        default: "192.0.2.10"
        type: string
      challenge_name:
        description: "DNS-01 challenge FQDN to present/clean (must be _acme-challenge.<registered dns_name> of the tenant)."
        required: false
        default: "_acme-challenge.anchor-01-envproof.piercloud.net"
        type: string
      challenge_value:
        description: "DNS-01 challenge TXT value (bounded base64url; proof-only)."
        required: false
        default: "b3a-proof-token-0123456789"
        type: string
      negative_ipv4:
        description: "When set, attempt an A write with this IPv4 and require a 409 refusal (cross-check proof)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One run per environment: the challenge TXT value is a fixed constant and the
# cleanup matches on name+value only (no presenter binding), so a second
# late-failing run's always() cleanup could delete the first run's live TXT.
# Serializing per environment keeps each cleanup scoped to its own proof.
concurrency:
  group: broker-report-selftest-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  report:
    name: "Report the anchor IPv4 to the broker"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the anchor IPv4
        env:
          BROKER_URL: https://broker.piercloud.net
          ANCHOR_REF: ${{ inputs.anchor_ref }}
          ANCHOR_IPV4: ${{ inputs.ipv4 }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-report.sh
          report_anchor_ip "$ANCHOR_REF" "$ANCHOR_IPV4"

      # b3a: the DNS write steps MUST run in this same job — the broker's
      # A-write cross-check requires the report's run id to equal the write
      # request's run id.
      - name: Write the anchor DNS records through the broker
        env:
          BROKER_URL: https://broker.piercloud.net
          ANCHOR_REF: ${{ inputs.anchor_ref }}
          ANCHOR_IPV4: ${{ inputs.ipv4 }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-dns.sh
          write_anchor_dns "$ANCHOR_REF" "$ANCHOR_IPV4"

      - name: Present a DNS-01 challenge TXT
        env:
          BROKER_URL: https://broker.piercloud.net
          CHALLENGE_NAME: ${{ inputs.challenge_name }}
          CHALLENGE_VALUE: ${{ inputs.challenge_value }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-dns.sh
          write_challenge "$CHALLENGE_NAME" "$CHALLENGE_VALUE" present

      # Cleanup runs even when an earlier step failed or the run is cancelled
      # after the present step (GitHub runs always() steps on cooperative
      # cancellation; a hard runner loss cannot execute them): present-then-abort
      # otherwise leaves the TXT in the zone until the next proof. A cleanup
      # after a failed present can itself refuse (the TXT was never written);
      # the job has already failed, and a 409 there is the exact-match delete
      # proving nothing to remove.
      - name: Clean up the DNS-01 challenge TXT
        if: always()
        env:
          BROKER_URL: https://broker.piercloud.net
          CHALLENGE_NAME: ${{ inputs.challenge_name }}
          CHALLENGE_VALUE: ${{ inputs.challenge_value }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-dns.sh
          write_challenge "$CHALLENGE_NAME" "$CHALLENGE_VALUE" cleanup

      - name: Mismatched A value is refused with 409 (negative)
        if: inputs.negative_ipv4 != ''
        env:
          BROKER_URL: https://broker.piercloud.net
          ANCHOR_REF: ${{ inputs.anchor_ref }}
          NEGATIVE_IPV4: ${{ inputs.negative_ipv4 }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-dns.sh
          # The refusal must be the broker's cross-check 409, not a local
          # validation/network failure: any other outcome fails the step.
          out=""
          if out="$(write_anchor_dns "$ANCHOR_REF" "$NEGATIVE_IPV4" 2>&1)"; then
            echo "::error::the broker accepted a mismatched A value — the cross-check is broken"
            exit 1
          fi
          case "$out" in
            *"HTTP 409"*) ;;
            *)
              echo "::error::expected a 409 cross-check refusal, got: $(printf '%s' "$out" | tr -d '\r\n' | cut -c1-200)"
              exit 1
              ;;
          esac
          echo "mismatched A value refused with 409 as expected."
