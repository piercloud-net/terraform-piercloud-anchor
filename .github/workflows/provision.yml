# .github/workflows/provision.yml — v0.2 phone-first provisioning (M1 skeleton).
#
# Plan milestone M2 (SPEC step 3): A1 hardened window + CI-called entrypoint
# `.github/scripts/020-provision-anchor.sh` (sweep-pre / open / provision /
# close / sweep-post) + same-job ephemeral-token handoff + stateless tofu
# apply. M1 skeleton properties (SHA pins, mutex, C-E banner, H1 artifact)
# are unchanged.
#
# M0 live-evidence (real netcup device-flow drill on a phone) gates done-ness,
# NOT this scaffolding — M0-pending, recorded in the PR body.
#
# OpenTofu note: the tofu steps wired in M2 REQUIRE required_version >= 1.11
# (ephemeral values carry the per-run netcup token; the token never lands in
# state). The module bump itself lands in M3.
#
# DNS stage (anchor-dns job + .github/scripts/030-anchor-dns.sh): Cloudflare
# A-record upsert + verify-after-write runs after A1 close (needs
# device-flow) and before thumbprint issuance (thumbprint needs anchor-dns)
# — a DNS failure fails the run before any thumbprint goes out, always.

name: provision

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Provisioning mode: apply | check | update-ip | destroy"
        required: true
        default: apply
        type: choice
        options: [apply, check, update-ip, destroy]
      ack_main_unbound:
        description: "Destroy gate: confirm the main box is already unbound (required for mode=destroy)."
        required: false
        default: false
        type: boolean
      add_ipv4:
        description: "update-ip: IPv4 source to ADD (ADD-before-move; old kept during transition)."
        required: false
        type: string
      add_ipv6:
        description: "update-ip: IPv6 source to ADD."
        required: false
        type: string
      remove_ipv4:
        description: "update-ip: old IPv4 source to remove AFTER confirmed boot."
        required: false
        type: string
      rotate_keys:
        description: "apply: forward --rotate to the on-box provision step (tang-key rotation)."
        required: false
        default: false
        type: boolean
      acknowledge_changed_workflows:
        description: "Red-banner gate: check ONLY after reviewing the workflow diff yourself (required when the banner shows CHANGED)."
        required: false
        default: false
        type: boolean

# Static global mutex: one mutex serializes ALL tenants' policy mutations.
# Static literal — dynamic values are FORBIDDEN in concurrency.group.
concurrency:
  group: piercloud-netcup-policy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  visibility-banner:
    name: "C-E visibility banner (LOUD on change)"
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.banner.outputs.head_full }}
      head_short: ${{ steps.banner.outputs.head_short }}
      workflows_changed: ${{ steps.banner.outputs.workflows_changed }}
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Approval card — head SHA + compare link + workflow-path file count
        id: banner
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          TENANT_USER: ${{ vars.TENANT_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT="$(echo "$HEAD_SHA" | cut -c1-7)"
          git fetch origin "$BASE_REF" --depth=1 >/dev/null 2>&1 || true
          COUNT="$(git diff --name-only "origin/$BASE_REF"...HEAD -- .github/workflows 2>/dev/null | wc -l | tr -d ' ')"
          [ -z "$COUNT" ] && COUNT=0
          DIFF_LINK="${{ github.server_url }}/${{ github.repository }}/compare/$BASE_REF...$HEAD_SHA"
          echo "head_short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "head_full=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_files=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### Approval card (C-E) for \`$TENANT_USER\`"
            echo ""
            echo "head: \`$SHORT\` (\`$HEAD_SHA\`) — [compare-diff]($DIFF_LINK)"
            echo "workflow-path files changed: \`$COUNT\`"
            echo ""
            # Anti-phishing line, carried verbatim on every approval card.
            echo "we will never email or message you a code to re-confirm."
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "workflows_changed=false" >> "$GITHUB_OUTPUT"
              echo "🟢 UNCHANGED — workflows under .github/workflows match $BASE_REF."
              echo "piercloud: apply ready for $TENANT_USER @$SHORT. Workflows unchanged. Approve: $RUN_URL code XXXX-XXXX (expires 10 min). We never email codes."
            else
              echo "workflows_changed=true" >> "$GITHUB_OUTPUT"
              echo "🔴 CHANGED — $COUNT file(s) under .github/workflows differ from $BASE_REF."
              echo "piercloud STOP: workflows in ${{ github.repository }} changed since your last approval (<old>->$HEAD_SHA, $COUNT files incl. provision.yml). Do NOT approve. Open $DIFF_LINK or ask the operator what changed. Nothing runs until you approve."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Last-approved pin via actions:read stays backend mechanics (open
          # design Q4); failed check = no apply, always (C-A). The red-banner
          # acknowledge gate below enforces the checkbox half starting now.

      - name: Record head SHA for the backend approval pin
        env:
          HEAD_SHA: ${{ github.sha }}
          HEAD_SHORT: ${{ steps.banner.outputs.head_short }}
          TENANT_USER: ${{ vars.TENANT_USER }}
        run: |
          set -euo pipefail
          # Template side of the head_sha approval pin (open design Q4): the
          # run publishes the dispatched head SHA as job outputs (see the
          # outputs block above) AND as a machine-readable artifact, so the
          # future backend can record the last-approved head via
          # actions:read. Failed check = no apply, always. Backend mechanics
          # themselves are out of scope for v0.2.
          printf 'head_sha=%s head_short=%s alias=%s\n' "$HEAD_SHA" "$HEAD_SHORT" "$TENANT_USER" > head-sha.txt
      - name: Upload head-SHA artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # SHA pin of upload-artifact v6
        with:
          name: head-sha-${{ vars.TENANT_USER }}
          path: head-sha.txt
          # Same horizon as the thumbprint artifact: audit trail, not logs.
          retention-days: 400
          if-no-files-found: error

      - name: ntfy verdict (verbatim strings)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HEAD_SHORT: ${{ steps.banner.outputs.head_short }}
          WORKFLOW_FILES: ${{ steps.banner.outputs.workflow_files }}
          TENANT_USER: ${{ vars.TENANT_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Secret names chosen in M1 (design Q5): NTFY_TOPIC + NTFY_TOKEN
          # (publish-scoped). Values live in repo secrets; nothing is committed.
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — verdict stays in the run summary (OK for skeleton)."
            exit 0
          fi
          if [ "$WORKFLOW_FILES" -eq 0 ]; then
            MSG="piercloud: apply ready for $TENANT_USER @$HEAD_SHORT. Workflows unchanged. Approve: $RUN_URL code XXXX-XXXX (expires 10 min). We never email codes."
          else
            MSG="piercloud STOP: workflows in ${{ github.repository }} changed since your last approval (<old>->${{ github.sha }}, $WORKFLOW_FILES files incl. provision.yml). Do NOT approve. Open ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.sha }} or ask the operator what changed. Nothing runs until you approve."
          fi
          # Empty token = no header at all (ntfy.sh 401s on an empty Basic).
          # --fail: a rejected push fails the step instead of dying silently.
          NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
          curl -sS --fail "${NTFY_AUTH[@]}" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          # TODO(M2): red verdict hides the netcup URL/code behind an
          # acknowledge-checkbox on the no-account path (open design Q5).

  device-request:
    name: "Device code request (card renders on job completion)"
    runs-on: ubuntu-latest
    needs: [visibility-banner]
    outputs:
      device_code: ${{ steps.request.outputs.device_code }}
      token_endpoint: ${{ steps.request.outputs.token_endpoint }}
      interval: ${{ steps.request.outputs.interval }}
    env:
      # Public, constant Keycloak discovery doc (same realm for every tenant).
      NETCUP_OIDC_DISCOVERY_URL: "https://www.servercontrolpanel.de/realms/scp/.well-known/openid-configuration"
      TENANT_USER: ${{ vars.TENANT_USER }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - name: Request code + write approval card
        id: request
        run: |
          set -euo pipefail
          # Handoff-write guard (review security): API-derived values are
          # written to $GITHUB_OUTPUT line-by-line, so a crafted value with an
          # embedded newline would forge additional outputs. Reject newline/CR
          # and any non-printable characters before every such write.
          guard_line() { # $1 label, $2 API-derived value
            case "$2" in *[$'\n\r']*) echo "::error::$1 contains a newline/CR — refusing the handoff write (injection guard)."; exit 1 ;; esac
            if [ -n "$(printf '%s' "$2" | LC_ALL=C tr -d '[:print:]')" ]; then echo "::error::$1 contains non-printable characters — refusing the handoff write (injection guard)."; exit 1; fi
          }
          # M0-gate: literal device/token endpoint URLs are NOT hardcoded here
          # (prior literals were probed, never recorded). Endpoints are
          # recovered from the Keycloak OIDC discovery document FIRST.
          DISCO="$(curl -sS "$NETCUP_OIDC_DISCOVERY_URL")"
          DEVICE_ENDPOINT="$(echo "$DISCO" | jq -r '.device_authorization_endpoint')"
          TOKEN_ENDPOINT="$(echo "$DISCO" | jq -r '.token_endpoint')"
          test "$DEVICE_ENDPOINT" != "null" || { echo "::error::discovery doc lacks device_authorization_endpoint — STOP, escalate."; exit 1; }
          # Endpoint pin (review security MEDIUM): only the live SCP Keycloak
          # realm may receive auth traffic — a tampered discovery document
          # must not receive the device code (or, later, the tokens).
          require_scp_endpoint() { # $1 label, $2 URL
            case "$2" in
              https://www.servercontrolpanel.de/realms/scp/*) ;;
              *) echo "::error::$1 is not an https://www.servercontrolpanel.de/realms/scp/ endpoint — refusing to POST (endpoint pin)."; exit 1 ;;
            esac
          }
          require_scp_endpoint "device_authorization_endpoint" "$DEVICE_ENDPOINT"
          require_scp_endpoint "token_endpoint" "$TOKEN_ENDPOINT"
          RESP="$(curl -sS -X POST "$DEVICE_ENDPOINT" --data-urlencode "client_id=scp" --data-urlencode "scope=offline_access openid")"
          # C-f: grant disabled (or any refusal) → STOP + escalate.
          # No downgrade path exists by design (C-A) — this job exits here.
          if echo "$RESP" | jq -e 'has("error")' >/dev/null; then
            DESC="$(echo "$RESP" | jq -r '.error_description // .error')"
            echo "::error::device authorization refused ($DESC). STOP — the device grant may be disabled. Escalate to the operator. No fallback of any kind exists (C-A)."
            exit 1
          fi
          # C-a: the authorization secret below is masked FIRST, on the very
          # next line after extraction — never printed or dumped (C-a/C-b).
          DEVICE_CODE="$(echo "$RESP" | jq -r '.device_code')"
          # C-a: NO ::add-mask:: here by design — GitHub silently drops masked
          # values from GITHUB_OUTPUT ("Skip output since it may contain
          # secret"), which would hand the poll job an empty code and fail
          # every run. Containment instead: the code is never printed, never
          # leaves this job except via outputs to the poll step, lives 600s,
          # and is useless without the tenant's own netcup session (C-b).
          USER_CODE="$(echo "$RESP" | jq -r '.user_code')"
          VERIFY_URI="$(echo "$RESP" | jq -r '.verification_uri_complete // .verification_uri')"
          INTERVAL="$(echo "$RESP" | jq -r '.interval // 5')"
          # C-b: print ONLY the verification URL + user_code (+ alias).
          # Quiet curl flags only; no verbose dumps; no trace-level log variables.
          echo "alias: $TENANT_USER"
          echo "Open this URL on your phone to approve: $VERIFY_URI"
          echo "Code: $USER_CODE"
          echo "we will never email or message you a code to re-confirm."
          # Live card: this job ENDS here, so the summary below renders on
          # the run page while the code is still live. verification_uri_complete
          # pre-fills the code — one tap, no typing. Staleness guards land in
          # the poll job on every terminal branch.
          {
            echo "### 📲 Approve at netcup (code expires in ~10 min)"
            echo ""
            echo "[👉 TAP TO APPROVE]($VERIFY_URI)"
            echo ""
            echo "Code: \`$USER_CODE\` (already filled if you tapped the link)"
            echo ""
            echo "alias: $TENANT_USER — approving lets this run touch your netcup account ONCE; the token dies with the runner."
            echo "we will never email or message you a code to re-confirm."
          } >> "$GITHUB_STEP_SUMMARY"
          # Live push (the true phone channel): ntfy carries the real code
          # out-of-band the moment it exists. Unset topic = summary only.
          if [ -n "$NTFY_TOPIC" ]; then
            # Empty token = no header at all (ntfy.sh 401s on an empty Basic).
            NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
            curl -sS --fail "${NTFY_AUTH[@]}" -d "piercloud: approve $TENANT_USER: $VERIFY_URI code $USER_CODE (expires 10 min). We never email codes." "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          fi
          # Handoff to the poll job (device_code only: short-lived,
          # user-mediated, already log-printed. The ACCESS token is minted
          # and consumed inside the poll job — it never crosses jobs (C-d).
          guard_line "device_code" "$DEVICE_CODE"
          guard_line "token_endpoint" "$TOKEN_ENDPOINT"
          guard_line "interval" "$INTERVAL"
          echo "device_code=$DEVICE_CODE" >> "$GITHUB_OUTPUT"
          echo "token_endpoint=$TOKEN_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "interval=$INTERVAL" >> "$GITHUB_OUTPUT"

  device-flow:
    name: "S1 device-flow (C-a..C-f) + A1 window + stateless apply"
    runs-on: ubuntu-latest
    needs: [visibility-banner, device-request]
    # C-E power path: required-reviewer gate lives in repo SETTINGS
    # (environment `anchor` → tenant GitHub user), not in code. Where a
    # tenant reviewer identity exists, this pauses the run for their tap
    # BEFORE any token exists (execution approval); the device approval at
    # netcup follows (account approval). Two taps, correct order. Where no
    # reviewer exists (no-GitHub path), the environment auto-creates with
    # no rules and runs proceed — the LOUD banner is the mechanism there.
    # Banner stays ungated so the card exists to review first.
    environment: anchor
    outputs:
      thumbprint: ${{ steps.a1-provision.outputs.thumbprint }}
      anchor_ipv4: ${{ steps.resolve.outputs.anchor_ipv4 }}
      anchor_hostname: ${{ steps.resolve.outputs.anchor_hostname }}
    env:
      # Identifiers resolve from REPO-level secrets inside runs (C-E) —
      # never dispatch inputs, never logs (values are write-only, log-masked).
      # No HOSTNAME secret: derived below as anchor-01-<tenant>.
      # No SCP_USER_ID secret by default: resolved from the token via OIDC
      # userinfo in the resolve step (override only if yours differs).
      # ANCHOR_IPV4 / ANCHOR_ROOT_PASSWORD are optional (issue #50): unset
      # means zero-IP discovery + a caller-set one-time password; set keeps
      # the legacy pasted-IP / pasted-password path byte-for-byte.
      CUSTOMER_NUMBER: ${{ secrets.CUSTOMER_NUMBER }}
      TENANT_USER: ${{ vars.TENANT_USER }}
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
          # M2: the A1 entrypoint lives in this repo
          # (.github/scripts/020-provision-anchor.sh) — the device-flow job
          # must check it out to call it (full checkout: tofu below needs
          # the module files too).

      - name: Poll for approval (code already on the run summary)
        id: device
        env:
          DEVICE_CODE: ${{ needs.device-request.outputs.device_code }}
          TOKEN_ENDPOINT: ${{ needs.device-request.outputs.token_endpoint }}
          INTERVAL: ${{ needs.device-request.outputs.interval }}
        run: |
          set -euo pipefail
          # Handoff-write guard (review security): the token response is
          # API-derived; a crafted value with an embedded newline would forge
          # additional $GITHUB_ENV lines (e.g. redirect NETCUP_API_BASE).
          guard_line() { # $1 label, $2 API-derived value
            case "$2" in *[$'\n\r']*) echo "::error::$1 contains a newline/CR — refusing the handoff write (injection guard)."; exit 1 ;; esac
            if [ -n "$(printf '%s' "$2" | LC_ALL=C tr -d '[:print:]')" ]; then echo "::error::$1 contains non-printable characters — refusing the handoff write (injection guard)."; exit 1; fi
          }
          # Endpoint pin (review security MEDIUM): the device-code POST may
          # only ever go to the live SCP Keycloak realm (the value arrives via
          # the request job's output; re-checked here at the point of use).
          case "$TOKEN_ENDPOINT" in
            https://www.servercontrolpanel.de/realms/scp/*) ;;
            *) echo "::error::token_endpoint is not an https://www.servercontrolpanel.de/realms/scp/ endpoint — refusing to POST (endpoint pin)."; exit 1 ;;
          esac
          # No re-mask (see request job): masked values can't cross via outputs;
          # the code arrives unmasked by design and is never printed anywhere.
          # C-c: honor interval/slow_down; self-stop ~570s with a clean
          # re-dispatch message (device codes live ~600s).
          DEADLINE=$((SECONDS + 570))
          DELAY="$INTERVAL"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep "$DELAY"
            # C-a: the poll payload carries the device_code (unmasked by design,
            # see request job) — keep the response out of logs (it may echo
            # the code back on errors).
            POLL="$(curl -sS -X POST "$TOKEN_ENDPOINT" --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:device_code" --data-urlencode "client_id=scp" --data-urlencode "device_code=$DEVICE_CODE")" # C-a: code never printed (C-b)
            STATUS="$(echo "$POLL" | jq -r '.error // "ok"')"
            case "$STATUS" in
              ok)
                ACCESS_TOKEN="$(echo "$POLL" | jq -r '.access_token')"
                guard_line "access_token" "$ACCESS_TOKEN"
                echo "::add-mask::$ACCESS_TOKEN"
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                # M2 same-job handoff: the ACCESS token persists ONLY in this
                # runner's local GITHUB_ENV handoff (dies with the runner);
                # the REFRESH token gets its own 0600 file below — it must
                # not sit in the job env. Same-job steps below consume both;
                # neither crosses jobs, neither lands in state (C-d: TF 1.11
                # ephemerals carry the access token).
                echo "NETCUP_SCP_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
                # ~5-min access-token TTL vs multi-minute runs (live
                # 2026-09-11: the async apply outlived the token, every tail
                # step 401'd and the A1 window policy leaked). offline_access
                # was already requested at approval — hand the refresh token
                # to the script's REST helper (scp_token_refresh), which
                # re-mints ONCE on a 401 and replays the request. Same-runner
                # handoff, dies with the runner (C-d trust model unchanged).
                REFRESH_TOKEN="$(echo "$POLL" | jq -r '.refresh_token // empty')"
                if [ -n "$REFRESH_TOKEN" ]; then
                  guard_line "refresh_token" "$REFRESH_TOKEN"
                  # Discovery-derived: guard again at the write (defense in depth).
                  guard_line "token_endpoint" "$TOKEN_ENDPOINT"
                  echo "::add-mask::$REFRESH_TOKEN"
                  # Refresh-token handoff: a 0600 runner-local FILE, NOT
                  # $GITHUB_ENV. Only the PATH is exported, so the ~30-day
                  # credential never enters the job environment where every
                  # later step — including the community tofu provider pulled
                  # by `tofu init` — could read it (review security MEDIUM).
                  # scp_token_refresh reads and rewrites this file for the
                  # current value and every rotation.
                  REFRESH_TOKEN_FILE="$RUNNER_TEMP/scp-refresh-${GITHUB_RUN_ID}.token"
                  if ! (umask 077; printf '%s' "$REFRESH_TOKEN" > "$REFRESH_TOKEN_FILE"); then
                    echo "::error::could not write the refresh-token handoff file $REFRESH_TOKEN_FILE — aborting (no handoff is safer than an env leak)."
                    exit 1
                  fi
                  echo "NETCUP_SCP_REFRESH_TOKEN_FILE=$REFRESH_TOKEN_FILE" >> "$GITHUB_ENV"
                  echo "NETCUP_SCP_TOKEN_ENDPOINT=$TOKEN_ENDPOINT" >> "$GITHUB_ENV"
                  echo "::notice::refresh token captured to the runner-local file handoff — long runs survive the ~5 min access-token TTL."
                else
                  echo "::warning::no refresh_token in the token response — runs longer than ~5 min will 401 at the tail (fail-loud, no fallback)."
                fi
                # C-d: the refresh token stays in its 0600 runner-local FILE
                # (the script re-reads it across subshells and rewrites it on
                # every rotation); TF 1.11 ephemerals carry the access token —
                # the refresh credential never enters the job env nor state.
                echo "Approved. Token held on this runner only (local handoff file)."
                echo "::notice::netcup approval received for $TENANT_USER — token in the runner-local handoff, provisioning continues."
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "✅ Approved — the code above is dead. Provisioning continues." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              authorization_pending)
                ;;
              slow_down)
                DELAY=$((DELAY + 5)) # C-c: cumulative +5s backoff
                ;;
              expired_token)
                echo "❌ Code expired — the card above is dead. Re-dispatch the workflow for a fresh code (clean re-dispatch path)." >> "$GITHUB_STEP_SUMMARY"
                echo "::error::device code expired before approval. Re-dispatch the workflow for a fresh code (clean re-dispatch path)."
                exit 1
                ;;
              access_denied)
                echo "❌ Approval denied — nothing runs. The card above is dead." >> "$GITHUB_STEP_SUMMARY"
                echo "::error::approval denied at netcup. STOP — nothing runs. Escalate to the operator if unexpected."
                exit 1
                ;;
              *)
                echo "::error::unexpected token response ($STATUS). STOP — escalate. No fallback of any kind exists (C-A)."
                exit 1
                ;;
            esac
          done
          echo "::error::approval window (~570s) elapsed without approval. Re-dispatch the workflow for a fresh code."
          exit 1
          # M2: same-job handoff implemented above (token -> GITHUB_ENV);
          # the A1 + tofu steps below consume it on this same runner.

      - name: Resolve server + approver guard + zero-IP discovery
        id: resolve
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          ANCHOR_IPV4: ${{ secrets.ANCHOR_IPV4 }}
          SCP_USER_ID_IN: ${{ secrets.SCP_USER_ID }}
          CUSTOMER_NUMBER: ${{ secrets.CUSTOMER_NUMBER }}
          TENANT_USER: ${{ vars.TENANT_USER }}
        run: |
          set -euo pipefail
          # Handoff-write guard (review security): every API-derived value
          # below reaches $GITHUB_ENV/$GITHUB_OUTPUT; reject newline/CR and
          # non-printable characters so a crafted response cannot forge extra
          # env lines (e.g. redirecting NETCUP_API_BASE with the token).
          guard_line() { # $1 label, $2 API-derived value
            case "$2" in *[$'\n\r']*) echo "::error::$1 contains a newline/CR — refusing the handoff write (injection guard)."; exit 1 ;; esac
            if [ -n "$(printf '%s' "$2" | LC_ALL=C tr -d '[:print:]')" ]; then echo "::error::$1 contains non-printable characters — refusing the handoff write (injection guard)."; exit 1; fi
          }
          # The numeric server id is the stable key (policy names, tmp tags,
          # module adopt) but it appears in no email — so the run resolves it
          # itself. Runs before every consumer below; ids are identifiers,
          # not secrets, and are safe to log.
          # Tenant identity comes from the repo, not the dispatch: TENANT_USER
          # (operator-set variable) is the username, so there is no alias
          # input to typo or squat — unset fails closed before anything runs.
          # Hostname derivation (D8: scripts/lib/naming.sh is the one
          # canonical source — the DNS stage and the on-box fallback consume
          # the same functions, so TF hostname and DNS record can never
          # diverge). D2: validate the LOWERCASED RAW username before the
          # sanitizer runs — `.pier`, `pier-` and `pier--carlo` all sanitize
          # to `pier`, so validating SAN would be fail-open. Reserved
          # prefixes (anchor/status/pcu) fail closed too. The lib returns
          # zone-less names; STATUS_HOST adds the zone here because the
          # on-box Caddy render consumes it as the dashboard FQDN.
          [ -n "${TENANT_USER:-}" ] || { echo "::error::TENANT_USER repo variable is empty — set it to the tenant username (gh variable set TENANT_USER --body <you>)."; exit 1; }
          . scripts/lib/naming.sh
          RAW="$(printf '%s' "$TENANT_USER" | tr '[:upper:]' '[:lower:]')"
          validate_tenant_username "$RAW"
          SAN="$(sanitize_tenant "$RAW")"
          [ -n "$SAN" ] || { echo "::error::TENANT_USER sanitizes to empty — set a username with letters/digits."; exit 1; }
          HOSTNAME="$(derive_anchor_hostname "$SAN")"
          STATUS_HOST="$(derive_status_host "$SAN").piercloud.net"
          # Vendor variables are trusted less than they look: a newline in the
          # repo variable survives the sanitize sed (line-oriented) and would
          # forge an extra $GITHUB_ENV line. Reject before the write.
          guard_line "ANCHOR_HOSTNAME" "$HOSTNAME"
          echo "ANCHOR_HOSTNAME=$HOSTNAME" >> "$GITHUB_ENV"
          guard_line "STATUS_HOST" "$STATUS_HOST"
          echo "STATUS_HOST=$STATUS_HOST" >> "$GITHUB_ENV"
          guard_line "anchor_hostname" "$HOSTNAME"
          echo "anchor_hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
          echo "Derived hostname $HOSTNAME (dashboard $STATUS_HOST)."
          # SCP user id: NEVER the customer number (live 403 proved they
          # differ). Resolved from the token itself via OIDC userinfo
          # (same source shipping CLIs use: userinfo "id" is the numeric
          # SCP id); explicit SCP_USER_ID secret wins when set.
          if [ -n "${SCP_USER_ID_IN:-}" ]; then
            SCP_EFF="$SCP_USER_ID_IN"
            echo "SCP user id from explicit secret."
          else
            SCP_EFF="$(curl -sS 'https://www.servercontrolpanel.de/realms/scp/protocol/openid-connect/userinfo' \
              -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" | jq -r '.id // empty')"
            [ -n "$SCP_EFF" ] || { echo "::error::userinfo returned no numeric id — token scope may lack openid, or the grant changed. Escalate, no fallback."; exit 1; }
            echo "Resolved SCP user id=$SCP_EFF from token userinfo."
          fi
          # Parse-time validation (review security): the userinfo id is
          # interpolated into API paths, TF vars and policy-import HCL — it
          # must be all-digits before it goes anywhere. Fail closed.
          case "$SCP_EFF" in '' | *[!0-9]*) echo "::error::resolved SCP user id is not all-digits — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "SCP_USER_ID_EFF" "$SCP_EFF"
          echo "SCP_USER_ID_EFF=$SCP_EFF" >> "$GITHUB_ENV"
          # Approver guard (issue #50): the device approval the tenant
          # already tapped is the ONLY authorization moment — prove it came
          # from the tenant's own account before anything mutates. The
          # customer number IS the SCP username, so the approver's user
          # record must carry it. Wrong-account approval aborts LOUD here.
          [ -n "${CUSTOMER_NUMBER:-}" ] || { echo "::error::CUSTOMER_NUMBER secret is empty — it is the one required secret (paste the customer number from either account email)."; exit 1; }
          API_USER="$(curl -sS "https://www.servercontrolpanel.de/scp-core/api/v1/users/$SCP_EFF" \
            -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" | jq -r '.username // empty')"
          [ -n "$API_USER" ] || { echo "::error::could not read the approver's user record (GET /users/$SCP_EFF) — token scope may have changed. Escalate, no fallback."; exit 1; }
          if [ "$API_USER" != "$CUSTOMER_NUMBER" ]; then
            echo "::error::WRONG-ACCOUNT APPROVAL: this run was approved from netcup account '$API_USER', but the repo expects the customer-number account. STOP — nothing runs. Re-dispatch and approve from the account that owns the anchor."
            exit 1
          fi
          echo "Approver guard ok: the approval came from the tenant's own account."
          # Zero-IP discovery (issue #50): the approver's server list picks
          # the anchor — no pasted IP needed. Ranking: exactly-one
          # (convention-free) > exact hostname (deterministic) > pasted IP
          # (today's fallback). NEVER most-recent (no creationTime in the
          # list, race-prone), NEVER state-filtered (the anchor may be
          # stopped). Stopped servers still list — do not filter them out.
          # Base without the versioned tail (keep every request path fully
          # qualified below so the CI endpoint allowlist keeps matching).
          SCP="https://www.servercontrolpanel.de/scp-core"
          fetch_list() { curl -sS "$SCP/api/v1/servers" -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN"; }
          list_count() { printf '%s' "$1" | jq -r 'if type == "array" then length else -1 end' 2>/dev/null || printf '%s' "-1"; }
          LIST="$(fetch_list)"
          COUNT="$(list_count "$LIST")"
          if [ "$COUNT" -eq 0 ]; then
            echo "Server list empty — a fresh order may still be propagating; polling with backoff."
            for i in 1 2 3 4 5 6; do
              sleep 10
              LIST="$(fetch_list)"
              COUNT="$(list_count "$LIST")"
              if [ "$COUNT" -gt 0 ]; then break; fi
              echo "Still empty (attempt $i/6)..."
            done
          fi
          # Negative COUNT with a pasted IP flows past ranking into the
          # legacy ?ip= branch below (same API, independent shape); without
          # an IP there is nothing to fall back to — fail closed.
          if [ "$COUNT" -lt 0 ] && [ -z "${ANCHOR_IPV4:-}" ]; then
            echo "::error::server list came back in an unexpected shape — escalate, no fallback."
            exit 1
          fi
          RESOLVED_ID=""
          if [ "$COUNT" -eq 1 ]; then
            RESOLVED_ID="$(printf '%s' "$LIST" | jq -r '.[0].id // empty')"
            echo "Discovery: exactly one server in the account — adopting id $RESOLVED_ID (convention-free)."
          elif [ "$COUNT" -gt 1 ]; then
            MATCHES="$(printf '%s' "$LIST" | jq -r --arg h "$HOSTNAME" '[.[] | select(.hostname == $h) | .id]')"
            if [ "$(printf '%s' "$MATCHES" | jq 'length')" -eq 1 ]; then
              RESOLVED_ID="$(printf '%s' "$MATCHES" | jq -r '.[0]')"
              echo "Discovery: $COUNT servers, exactly one named $HOSTNAME — adopting id $RESOLVED_ID."
            fi
          fi
          if [ -z "$RESOLVED_ID" ]; then
            if [ -n "${ANCHOR_IPV4:-}" ]; then
              # Legacy fallback, byte-for-byte today's behavior: the pasted
              # IP resolves via ?ip= (exact-one, fail closed).
              IP4="${ANCHOR_IPV4%%/*}"
              case "$IP4" in ''|*[!0-9.]*) echo "::error::ANCHOR_IPV4 is not a bare IPv4 after stripping any /suffix. Paste the IP from the server-ready email."; exit 1;; esac
              RESP="$(curl -sS -G "$SCP/api/v1/servers" --data-urlencode "ip=$IP4" \
                -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN")"
              IP_COUNT="$(printf '%s' "$RESP" | jq -r 'if type == "array" then length else -1 end' 2>/dev/null || printf '%s' "-1")"
              RESOLVED_ID="$(printf '%s' "$RESP" | jq -r 'if type == "array" and length == 1 then .[0].id // empty else empty end')"
              if [ "$IP_COUNT" != "1" ] || [ -z "$RESOLVED_ID" ]; then
                echo "::error::anchor IP matched $IP_COUNT servers (need exactly 1). Check ANCHOR_IPV4, or rename duplicates in the SCP. Full list shape unexpected — escalate, no fallback."
                exit 1
              fi
              echo "Discovery fell back to the pasted IP (legacy path): server_id=$RESOLVED_ID."
            else
              echo "::error::expected 1 server, found $COUNT — and none is named $HOSTNAME. Your account's servers (id / name / hostname / nickname):"
              printf '%s' "$LIST" | jq -r '.[] | "\(.id) / \(.name) / \(.hostname) / \(.nickname)"'
              echo "::error::set the ANCHOR_IPV4 secret to the anchor IP and re-dispatch (or rename the anchor to $HOSTNAME so discovery can pick it). No cross-tenant data: the token sees this account only."
              exit 1
            fi
          fi
          # Parse-time validation (review security): the discovered server id
          # is interpolated into API paths and the generated import HCL — it
          # must be all-digits before it goes anywhere. Fail closed.
          case "$RESOLVED_ID" in '' | *[!0-9]*) echo "::error::resolved server id is not all-digits — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "SERVER_ID" "$RESOLVED_ID"
          echo "SERVER_ID=$RESOLVED_ID" >> "$GITHUB_ENV"
          # SSH/DNS target: the pasted IP wins when set (legacy,
          # byte-for-byte); else the server detail's first IPv4 (IPv6-only
          # resolves via detail/interfaces, never q — and fails closed here
          # because runners have no IPv6 path).
          if [ -n "${ANCHOR_IPV4:-}" ]; then
            HOST4="${ANCHOR_IPV4%%/*}"
            case "$HOST4" in ''|*[!0-9.]*) echo "::error::ANCHOR_IPV4 is not a bare IPv4 after stripping any /suffix."; exit 1;; esac
          else
            DETAIL="$(curl -sS "$SCP/api/v1/servers/$RESOLVED_ID" -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN")"
            HOST4="$(printf '%s' "$DETAIL" | jq -r '.ipv4Addresses[0].ip // empty')"
            [ -n "$HOST4" ] || { echo "::error::server $RESOLVED_ID reports no IPv4 address (IPv6-only is unsupported — runners have no IPv6). Attach an IPv4, or set ANCHOR_IPV4 and re-dispatch."; exit 1; }
            echo "Discovery: anchor IPv4 from server detail, no pasted IP needed."
          fi
          # Parse-time validation (review security): the SSH/DNS target must
          # be a bare IPv4 (both the pasted-secret and the API-derived path) —
          # it is interpolated into runner shell and $GITHUB_OUTPUT. Fail closed.
          case "$HOST4" in '' | *[!0-9.]*) echo "::error::anchor host is not a bare IPv4 — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "ANCHOR_HOST" "$HOST4"
          echo "ANCHOR_HOST=$HOST4" >> "$GITHUB_ENV"
          echo "anchor_ipv4=$HOST4" >> "$GITHUB_OUTPUT"
          echo "Resolved server_id=$RESOLVED_ID (ssh/dns target set)."

      - name: Red-banner acknowledge gate (C-E, no-GitHub path)
        if: needs.visibility-banner.outputs.workflows_changed == 'true'
        run: |
          set -euo pipefail
          # Red banner = workflows changed: the run stops here unless the
          # dispatcher checked acknowledge_changed_workflows AFTER reviewing
          # the diff themselves. Boolean input (true/false only) — safe in
          # the test. Green banners skip this step entirely.
          if [ "${{ inputs.acknowledge_changed_workflows }}" != "true" ]; then
            echo "::error::workflows CHANGED since baseline and acknowledge_changed_workflows is unchecked. Review the diff from the banner card first, then re-dispatch with the box checked. Nothing runs until you do."
            exit 1
          fi
          echo "Red-banner acknowledged — proceeding."

      - name: A1 pre-sweep (surplus fail-closed, every run, all modes)
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          # Destructive sweeps only in apply mode; other modes report-only.
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # TTL tag piercloud-tmp-<server_id>-<run_id>, description
          # created_at=<RFC3339-UTC> purpose=A1-ssh. Classify first, then
          # retire EVERY non-own tmp (aged or leaked-fresh — the workflow
          # mutex means no foreign run can be live); only an orphan (no
          # parseable created_at) or a failed retire stays fail-closed,
          # BEFORE creating (exit 3, operator notified by the failure step
          # below).
          .github/scripts/020-provision-anchor.sh sweep-pre

      - name: Set up OpenTofu (>= 1.11 for ephemeral values)
        if: inputs.mode == 'apply'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # SHA pin of setup-opentofu v2
        with:
          tofu_version: "1.12.2"

      - name: tofu init (stateless — local state dies with the runner)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          # NOTE (review security, corrected): the refresh token VALUE is not
          # in any tofu step's env — the community provider only gets the
          # short-lived access token. But the runner-local 0600 handoff FILE
          # PATH rides the job env (dynamic $GITHUB_ENV), and the file is
          # readable by same-user processes on this runner, so `tofu init`
          # must not be able to silently swap the provider build: the
          # committed .terraform.lock.hcl + `-lockfile=readonly` below pin
          # and verify the exact provider binaries (N3). A provider-side 401
          # fails loud rather than refreshing without persisting the
          # rotation. Scope: the lock pins the exact build + hashes and fails
          # closed on a mismatch; it is NOT a defense against a malicious
          # upstream release, and the 0600 handoff file stays readable by
          # same-UID processes on this runner (both accepted, disclosed
          # limits).
          TF_IN_AUTOMATION: "true"
        run: |
          set -euo pipefail
          # No backend block: local state file on the ephemeral runner.
          # Nothing persists past this run by construction.
          # -lockfile=readonly (security N3): the provider lock is committed,
          # so a version/hash mismatch fails loudly here instead of silently
          # re-resolving the community provider mid-run.
          tofu init -input=false -lockfile=readonly

      - name: Stateless import (re-adopt, import-apply-discard)
        if: inputs.mode == 'apply'
        env:
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          ANCHOR_HOSTNAME: ${{ env.ANCHOR_HOSTNAME }}
        run: |
          set -euo pipefail
          # Injection guards (defense in depth; parse-time validation lands in
          # the resolve step): these values are interpolated into generated HCL
          # and API paths, so a malformed/crafted API response must never reach
          # them. Fail closed, never fall back.
          case "$SERVER_ID" in '' | *[!0-9]*) echo "::error::SERVER_ID is not all-digits — refusing to write an import file (injection guard)."; exit 1 ;; esac
          case "$SCP_USER_ID" in '' | *[!0-9]*) echo "::error::SCP_USER_ID is not all-digits — refusing to write an import file (injection guard)."; exit 1 ;; esac
          # Stateless re-adopt: the ephemeral runner holds no state, so every
          # apply re-imports what it must converge instead of duplicating it.
          # Generated at runtime, never committed; removed post-apply below.
          # NOT a dotfile: Terraform/OpenTofu silently IGNORE files whose names
          # start with `.` — the previous `.workflow-import.tf` was never loaded,
          # so no import ever happened and every apply created a new firewall
          # policy (proven locally: dotfile → "1 to add", renamed → "1 to import").
          cat > workflow-import.tf <<EOF
          import {
            to = netcup_scp_server.anchor[0]
            id = "$SERVER_ID"
          }
          EOF
          echo "Wrote workflow-import.tf for server $SERVER_ID."

          # Firewall policy re-adopt (cap fix, issue #101): the policy id IS
          # known pre-apply — read the ATTACHED policy off the interface; its
          # name is deterministic (module local.policy_name). Import → Read →
          # in-place PUT (provider has no ForceNew): create path only when no
          # matching policy is attached. Fail closed on ambiguity.
          SCP="${NETCUP_API_BASE:-https://www.servercontrolpanel.de/scp-core}"
          POLICY_NAME="piercloud-anchor-${ANCHOR_HOSTNAME}-${SERVER_ID}"
          # Lexicographically smallest MAC — character-for-character the same
          # jq rule as resolve_mac() in .github/scripts/020-provision-anchor.sh
          # and main.tf local.interface_mac (`try(sort([...mac])[0], null)`,
          # "sorted for determinism"). On a >1-NIC server any other pick
          # resolves the wrong interface: the attached steady-state policy is
          # looked for (and later swept) against the wrong NIC.
          MAC="$(curl -sS --fail-with-body -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" \
            "$SCP/api/v1/servers/${SERVER_ID}/interfaces" \
            | jq -r 'if type == "array" then . elif has("data") then .data elif has("items") then .items elif has("interfaces") then .interfaces else . end | if type == "array" then (map(.mac // empty) | sort | .[0] // empty) else (.mac // empty) end')"
          [ -n "$MAC" ] || { echo "No interface MAC resolved — refusing to guess the firewall policy" >&2; exit 1; }
          # Newline-safe (review security N2): grep is line-oriented, so a
          # value with an embedded newline matched its first line; reject
          # newline/CR explicitly before the whole-value shape check.
          case "$MAC" in '' | *[$'\n\r']*) echo "::error::resolved interface MAC contains a newline/CR — refusing to interpolate it (injection guard)."; exit 1 ;; esac
          printf '%s' "$MAC" | grep -qE '^[0-9a-fA-F:]{17}$' || { echo "::error::resolved interface MAC is not a 17-char hex/colon value — refusing to interpolate it (injection guard)."; exit 1; }
          POLICY_ID="$(curl -sS --fail-with-body -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" \
            "$SCP/api/v1/servers/${SERVER_ID}/interfaces/${MAC}/firewall" \
            | jq -r --arg n "$POLICY_NAME" '[.userPolicies[]? | select(.name == $n) | .id | tostring] | if length == 0 then "" elif length == 1 then .[0] else "AMBIGUOUS" end')"
          case "$POLICY_ID" in
            "") echo "No attached steady-state policy named $POLICY_NAME — create path (first apply)." ;;
            AMBIGUOUS)
              echo "More than one attached policy named $POLICY_NAME — refusing to guess; clean up in SCP and re-dispatch." >&2
              exit 1 ;;
            *)
              case "$POLICY_ID" in '' | *[!0-9]*) echo "::error::resolved firewall policy id is not all-digits — refusing to write the import block (injection guard)."; exit 1 ;; esac
              cat >> workflow-import.tf <<EOF
          import {
            to = netcup_scp_user_firewall_policy.tang[0]
            id = "${SCP_USER_ID}/${POLICY_ID}"
          }
          EOF
              echo "Firewall policy ${POLICY_ID} will be re-adopted (create only if absent)." ;;
          esac

      - name: tofu plan (ephemeral token, never state)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          TF_IN_AUTOMATION: "true"
          TF_VAR_hostname: ${{ env.ANCHOR_HOSTNAME }}
          TF_VAR_anchor_hostname: ${{ env.ANCHOR_HOSTNAME }}.piercloud.net
          TF_VAR_server_id: ${{ env.SERVER_ID }}
          TF_VAR_scp_user_id: ${{ env.SCP_USER_ID_EFF }}
          TF_VAR_customer_number: ${{ secrets.CUSTOMER_NUMBER }}
          TF_VAR_allow_main_box_ipv4: ${{ secrets.MAIN_BOX_IPV4 }}
        run: |
          set -euo pipefail
          # Secrets used here (repo secrets, never committed):
          # MAIN_BOX_IPV4, ANCHOR_IPV4,
          # ANCHOR_ROOT_PASSWORD (masked one-run input, dead after root lock).
          # Public inputs arrive as repo VARIABLES: TENANT_USER (hostname/DNS
          # derivation). Monitor targets + push arrive as repo SECRETS:
          # GATUS_ENDPOINTS (comma-separated name=url), NTFY_TOPIC/NTFY_TOKEN.
          # (NETCUP_SERVER_ID retired: the resolve step derives server_id
          # at runtime from ANCHOR_IPV4 — nothing numeric to copy.)
          tofu plan -input=false -out=tfplan

      - name: tofu apply (steady-state policy, then hand off to A1 ssh)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          TF_IN_AUTOMATION: "true"
          TF_VAR_hostname: ${{ env.ANCHOR_HOSTNAME }}
          TF_VAR_anchor_hostname: ${{ env.ANCHOR_HOSTNAME }}.piercloud.net
          TF_VAR_server_id: ${{ env.SERVER_ID }}
          TF_VAR_scp_user_id: ${{ env.SCP_USER_ID_EFF }}
          TF_VAR_customer_number: ${{ secrets.CUSTOMER_NUMBER }}
          TF_VAR_allow_main_box_ipv4: ${{ secrets.MAIN_BOX_IPV4 }}
        run: |
          set -euo pipefail
          # ORDER IS LOAD-BEARING (live 2026-09-08): steady state MUST land
          # BEFORE the A1 window opens. Opening first then applying made the
          # interface-firewall resource rewrite user_policy_ids=[tang] and
          # DETACH the runner's /32 window, so the ssh handoff timed out.
          tofu apply -input=false -auto-approve tfplan
          # Import-apply-discard: the generated import served its one run.
          rm -f workflow-import.tf

      - name: A1 open (TTL-tagged single-/32 window, after steady state)
        id: a1-open
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Dual-endpoint egress-IP pin (exact match or fail) + idempotent
          # create on run_id + attach — all under the static global mutex
          # above (one mutex serializes every tenant's policy mutations).
          .github/scripts/020-provision-anchor.sh open

      - name: Passwordless bootstrap (caller-set one-time root password)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          ROOT_PASSWORD_SECRET: ${{ secrets.ANCHOR_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          # Pasted secret present -> the script skips minting (legacy path:
          # same SSH, same thumbprint, same lock as today). Empty -> mint a
          # caller-set password, ensure the box is RUNNING (live 2026-09-10
          # #68: the set is guest-agent-based and completes only on a
          # running VM — the stale vendor docs' OFF step is gone, so no
          # power cycle and no downtime), wait for the agent to report
          # available, set it, then SSH-wait — exporting the masked value
          # right after the set, before the SSH-wait, for the provision
          # step below (same-runner handoff, dies with the runner).
          # Concurrent runs serialize on 409 lock-backoff. Sits AFTER the
          # A1 open step by design (live #59): the closing SSH-wait needs
          # the runner /32 :22 window — steady-state firewall admits
          # 80/443 only, so probing earlier hangs on dropped SYNs with
          # zero output. After tofu apply per #41 (apply rewrites the
          # interface policy and would detach an earlier window). Still
          # behind the red-banner gate (destructive ops need a reviewed
          # tree).
          .github/scripts/020-provision-anchor.sh bootstrap-password

      - name: A1 provision (plain ssh, thumbprint, root lock)
        id: a1-provision
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          PINNED_IP: ${{ steps.a1-open.outputs.pinned_ip }}
          ROOT_PASSWORD: ${{ secrets.ANCHOR_ROOT_PASSWORD }}
          BOOTSTRAP_ROOT_PASSWORD: ${{ env.BOOTSTRAP_ROOT_PASSWORD }}
          TENANT_USER: ${{ vars.TENANT_USER }}
          GATUS_ENDPOINTS: ${{ secrets.GATUS_ENDPOINTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Operator-plane dashboard-TLS secrets (set at template time — the
          # tenant pastes nothing, bootstrap stays 1 secret): Cloudflare
          # Origin CA pair + optional zone-AOP bundle. Deployed key material
          # for Caddy's :443, NOT a standing API token.
          CF_ORIGIN_CERT_PEM: ${{ secrets.CF_ORIGIN_CERT_PEM }}
          CF_ORIGIN_KEY_PEM: ${{ secrets.CF_ORIGIN_KEY_PEM }}
          CF_AOP_CA_PEM: ${{ secrets.CF_AOP_CA_PEM }}
          THUMBPRINT_FILE: thumbprint.txt
        run: |
          set -euo pipefail
          # C-a-shaped explicit mask BEFORE any use: repo secrets are
          # auto-masked, but the explicit mask covers every expansion path
          # (same ordering rule as the device_code mask in device-flow).
          # Guarded: masking an empty value warns without masking anything.
          if [ -n "${{ secrets.ANCHOR_ROOT_PASSWORD }}" ]; then echo "::add-mask::${{ secrets.ANCHOR_ROOT_PASSWORD }}"; fi
          # Mask FIRST, before any use (repo secrets are auto-masked; the
          # explicit masks cover every expansion path, multiline PEMs
          # included). Guarded: masking an empty value warns without masking.
          if [ -n "${{ secrets.CF_ORIGIN_CERT_PEM }}" ]; then echo "::add-mask::${{ secrets.CF_ORIGIN_CERT_PEM }}"; fi
          if [ -n "${{ secrets.CF_ORIGIN_KEY_PEM }}" ]; then echo "::add-mask::${{ secrets.CF_ORIGIN_KEY_PEM }}"; fi
          if [ -n "${{ secrets.CF_AOP_CA_PEM }}" ]; then echo "::add-mask::${{ secrets.CF_AOP_CA_PEM }}"; fi
          # Pre-SSH IP re-fetch (mismatch aborts to sweep inside the script);
          # the one-run credential (pasted secret, or the caller-set value
          # minted by bootstrap-password) arrives masked and is never
          # printed; the script ends with `passwd -l root`.
          ARGS=""
          if [ "${{ inputs.rotate_keys }}" = "true" ]; then ARGS="--rotate"; fi
          # shellcheck disable=SC2086: ARGS is empty-or-one-known-flag by construction.
          .github/scripts/020-provision-anchor.sh $ARGS provision

      - name: Best-effort root lock (passwordless finally-path)
        if: failure() && inputs.mode == 'apply'
        env:
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          BOOTSTRAP_ROOT_PASSWORD: ${{ env.BOOTSTRAP_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          # A crash between password-set and the provision's `passwd -l root`
          # leaves a caller-known password live: always attempt the lock
          # here (finally-path, not happy-path). Never fails the run — the
          # original failure owns the verdict. No-ops when nothing was
          # minted (legacy path) or the box is unreachable (warns loud with
          # the SCP-reset + re-dispatch recovery).
          .github/scripts/020-provision-anchor.sh lock-password || true

      - name: A1 close (detach-then-delete, always)
        if: always() && steps.device.outputs.authorized == 'true' && inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          .github/scripts/020-provision-anchor.sh close

      - name: A1 post-sweep (always, every run, all modes)
        if: always()
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          # Destructive sweeps only in apply mode; other modes report-only.
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Sweeps this run's policy at any age + every tmp >2h + orphans.
          # No token (approval never completed) = clean no-op, so this step
          # never masks the original failure.
          .github/scripts/020-provision-anchor.sh sweep-post

      - name: Notify operator on failure (surplus/orphan hint)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TENANT_USER: ${{ vars.TENANT_USER }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — failure stays in the run summary."
            exit 0
          fi
          MSG="piercloud A1/provision FAILED for $TENANT_USER — run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If the log shows SURPLUS_FAIL_CLOSED, an orphan tmp policy (no parseable created_at) exists on the server or one could not be retired: clean up by hand, then re-dispatch. Nothing was created by the failed step."
          NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
          curl -sS --fail "${NTFY_AUTH[@]}" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null

      - name: Revoke device-grant refresh token (always, every run)
        if: always()
        env:
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          # Public, constant Keycloak discovery doc (same realm for every
          # tenant) — same pattern as the device-request job. The revocation
          # endpoint is read from it at runtime, so no endpoint literal is
          # hardcoded here.
          NETCUP_OIDC_DISCOVERY_URL: "https://www.servercontrolpanel.de/realms/scp/.well-known/openid-configuration"
        run: |
          set -euo pipefail
          summary() { # $1 = one-line outcome (bounded, token-free by construction)
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Device-grant revocation\n- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          bounded_detail() { # $1 = curl stderr file -> <=300 chars, one trimmed line
            head -c 300 "$1" 2>/dev/null | tr '\n\r' '  ' | tr -s ' ' | sed -e 's/^ //' -e 's/ $//'
          }
          # Refresh-token handoff is a 0600 runner-local FILE (see the poll
          # step): load it into this step's process env only — the ~30-day
          # credential never sits in the job environment.
          if [ -n "${NETCUP_SCP_REFRESH_TOKEN_FILE:-}" ]; then
            # F1 residual (review security): the path is exported ONLY when
            # the poll step received a refresh token, so an unreadable or
            # empty file is NOT "no token was issued" — the credential may be
            # live. Claiming a clean no-op here would be a false green: fail
            # the run RED.
            if [ ! -r "$NETCUP_SCP_REFRESH_TOKEN_FILE" ]; then
              echo "::error::NETCUP_SCP_REFRESH_TOKEN_FILE is set but the handoff file is missing or unreadable — the run's refresh token may still be live and cannot be revoked here. Revoke the tenant's offline session in netcup's Keycloak (SCP) admin/account UI, then investigate. No fallback exists (C-A)."
              summary "FAILED: refresh-token handoff file set but unreadable — token NOT revoked (may stay live up to Keycloak's ~30-day idle expiry)"
              exit 1
            fi
            NETCUP_SCP_REFRESH_TOKEN="$(head -c 8192 "$NETCUP_SCP_REFRESH_TOKEN_FILE" | tr -d '\r\n')"
            if [ -z "$NETCUP_SCP_REFRESH_TOKEN" ]; then
              echo "::error::the refresh-token handoff file is empty — a token was issued to this run but cannot be revoked here. Revoke the tenant's offline session in netcup's Keycloak (SCP) admin/account UI, then investigate. No fallback exists (C-A)."
              summary "FAILED: refresh-token handoff file empty — token NOT revoked (may stay live up to Keycloak's ~30-day idle expiry)"
              exit 1
            fi
          fi
          # Errexit stays ON (explicit): a teardown that cannot prove the
          # refresh credential is dead is a security failure and MUST turn the
          # run RED (review security HIGH — this reverses the earlier
          # "teardown never owns the verdict" guidance: an always() step never
          # runs when the runner dies, so a silent green teardown would let a
          # ~30-day token outlive the run while the docs claim it died). The
          # per-command || guards below cover the deliberately tolerated
          # cases; every unproven-revocation branch exits non-zero. A clean
          # no-op (no token was ever issued) stays exit 0.
          # Teardown: without this, the device grant's offline_access refresh
          # token outlives the runner by up to ~30 days (Keycloak offline
          # session idle expiry) even though the ACCESS token dies in ~5 min.
          # RFC 7009 lets a public client revoke with client_id only — no
          # secret, no Authorization header — so revocation still works now
          # that the access token is already dead.
          if [ -z "${NETCUP_SCP_REFRESH_TOKEN:-}" ]; then
            echo "No refresh token was issued to this run — nothing to revoke (clean no-op)."
            summary "no refresh token was issued to this run — nothing to revoke"
            exit 0
          fi
          # Endpoints from the OIDC discovery document; the token itself is
          # never printed (masked at birth in the poll step, passed only as
          # the POST bodies below).
          DISCO="$(curl -sS --max-time 30 "$NETCUP_OIDC_DISCOVERY_URL" 2>/dev/null)" || DISCO=""
          REVOKE_ENDPOINT="$(printf '%s' "$DISCO" | jq -r '.revocation_endpoint // empty' 2>/dev/null)" || REVOKE_ENDPOINT=""
          TOKEN_ENDPOINT="$(printf '%s' "$DISCO" | jq -r '.token_endpoint // empty' 2>/dev/null)" || TOKEN_ENDPOINT=""
          if [ -z "$REVOKE_ENDPOINT" ]; then
            echo "::error::could not resolve revocation_endpoint from the OIDC discovery document — the run's refresh token was NOT revoked and stays usable until Keycloak's offline-session idle expiry (~30 days). No fallback exists (C-A). Failing the run RED: an unproven teardown must not pass."
            summary "FAILED: revocation_endpoint missing from discovery — token NOT revoked (usable until Keycloak's idle expiry, ~30 days)"
            exit 1
          fi
          # Endpoint pin (review security MEDIUM): only the live SCP Keycloak
          # realm may receive the token; a tampered discovery document must not.
          require_scp_endpoint() { # $1 label, $2 URL
            case "$2" in
              https://www.servercontrolpanel.de/realms/scp/*) ;;
              *) echo "::error::$1 is not an https://www.servercontrolpanel.de/realms/scp/ endpoint — refusing to POST (endpoint pin)."; exit 1 ;;
            esac
          }
          require_scp_endpoint "revocation_endpoint" "$REVOKE_ENDPOINT"
          if [ -n "$TOKEN_ENDPOINT" ]; then require_scp_endpoint "token_endpoint" "$TOKEN_ENDPOINT"; fi
          # POST the refresh token (public client: client_id + token only);
          # the response body is discarded, the HTTP status and a BOUNDED
          # curl-stderr detail are kept for the warning and the step summary.
          # Token off argv (review security MEDIUM): write it to a 0600 temp
          # file (mktemp's default mode) and use curl's @file form so the
          # value never shows up in /proc/<pid>/cmdline; the EXIT trap
          # removes both temp files on every path.
          ERRFILE="$(mktemp)"
          TOKEN_FILE="$(mktemp)"
          printf '%s' "$NETCUP_SCP_REFRESH_TOKEN" > "$TOKEN_FILE"
          trap 'rm -f "$ERRFILE" "$TOKEN_FILE"' EXIT
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$REVOKE_ENDPOINT" \
            --data-urlencode "client_id=scp" \
            --data-urlencode "token_type_hint=refresh_token" \
            --data-urlencode "token@$TOKEN_FILE" 2>"$ERRFILE")" || CODE=""
          DETAIL="$(bounded_detail "$ERRFILE")"
          rm -f "$ERRFILE"
          REVOKE_OK=0
          case "$CODE" in
            200)
              REVOKE_OK=1
              REVOKE_STATE="revoked (HTTP 200)"
              echo "::notice::device-grant refresh token revoked — the run-issued credential dies with the runner in effect." ;;
            *)
              REVOKE_STATE="FAILED (HTTP ${CODE:-none}${DETAIL:+, curl: $DETAIL})"
              echo "::warning::refresh-token revocation returned HTTP ${CODE:-none}${DETAIL:+ (curl: $DETAIL)} — the canary below decides whether the credential can still be proven dead; a failed canary turns the run RED. No fallback exists (C-A)." ;;
          esac
          # Canary: prove the session actually died. A revoked refresh token
          # must be REFUSED. The live realm answers a refused refresh grant
          # with HTTP 400 + {"error":"invalid_grant","error_description":
          # "Invalid refresh token"} (reviewer-probed live 2026-09-11) — the
          # 200-with-an-error-BODY shape applies to the REVOKE endpoint, not
          # the token endpoint. ONLY invalid_grant / invalid_token prove the
          # token died; invalid_client / unauthorized_client merely say the
          # CLIENT was disabled/renamed — reporting "revocation verified" on
          # those would be a false security claim, so any other error (or an
          # unparseable/missing endpoint) stays UNVERIFIED with a warning.
          # The token and the response body are never printed — only the
          # accepted error code below. An unverified outcome is a RED run
          # (review security HIGH): the run must not stay green while the
          # docs claim the credential is dead.
          CANARY_VERIFIED=0
          if [ -n "$TOKEN_ENDPOINT" ]; then
            CERFILE="$(mktemp)"
            CANARY="$(curl -sS --max-time 30 -X POST "$TOKEN_ENDPOINT" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "client_id=scp" \
              --data-urlencode "refresh_token@$TOKEN_FILE" 2>"$CERFILE")" || CANARY=""
            CANARY_DETAIL="$(bounded_detail "$CERFILE")"
            rm -f "$CERFILE"
            CANARY_ERR="$(printf '%s' "$CANARY" | jq -r '.error // empty' 2>/dev/null)" || CANARY_ERR=""
            case "$(printf '%s' "$CANARY_ERR" | tr '[:upper:]' '[:lower:]')" in
              invalid_grant | invalid_token)
                CANARY_VERIFIED=1
                echo "::notice::revocation verified — the refresh token is dead (${CANARY_ERR})."
                if [ "$REVOKE_OK" -eq 1 ]; then
                  summary "${REVOKE_STATE}; canary rejected the token (${CANARY_ERR})"
                else
                  # Contradiction guard: the revoke POST reported a failure but
                  # the canary proves the credential is dead anyway (e.g. it
                  # was already invalidated) — report the verified outcome
                  # once, never "FAILED; verified".
                  summary "revocation verified by canary (${CANARY_ERR}); the revoke POST had reported ${REVOKE_STATE}"
                fi ;;
              "")
                echo "::error::revocation canary was NOT rejected by the token endpoint${CANARY_DETAIL:+ (curl: $CANARY_DETAIL)} — the refresh token may still be live (up to Keycloak's ~30-day offline-session idle expiry). The run stays RED; investigate the Keycloak sessions. No fallback exists (C-A). The token and response body are never printed."
                summary "${REVOKE_STATE}; CANARY NOT REJECTED — the credential may still be live (investigate the Keycloak sessions); run RED" ;;
              *)
                echo "::error::revocation canary returned '${CANARY_ERR}', which does not prove the token died (only invalid_grant/invalid_token do; invalid_client/unauthorized_client only mean the client itself was disabled or renamed). Revocation is UNVERIFIED — the refresh token may still be live. The run stays RED; investigate the Keycloak sessions. No fallback exists (C-A). The token and response body are never printed."
                summary "${REVOKE_STATE}; canary UNVERIFIED (error '${CANARY_ERR}' does not prove death) — the credential may still be live (investigate the Keycloak sessions); run RED" ;;
            esac
          else
            echo "::error::token_endpoint missing from the OIDC discovery document — revocation is unverified (cannot canary). The run stays RED; investigate the Keycloak sessions."
            summary "${REVOKE_STATE}; canary NOT RUN (token_endpoint missing) — revocation unverified; run RED"
          fi
          if [ "$CANARY_VERIFIED" -ne 1 ]; then
            exit 1
          fi
          # Best-effort cleanup (review security, hygiene): the canary just
          # proved the credential dead, so drop the 0600 handoff file now.
          # Never fatal — the run's verdict is already decided above.
          if [ -n "${NETCUP_SCP_REFRESH_TOKEN_FILE:-}" ]; then
            rm -f "$NETCUP_SCP_REFRESH_TOKEN_FILE" || true
          fi
          exit 0

  anchor-dns:
    name: "Anchor DNS upsert + verify (Cloudflare, fail-closed)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'apply'
    # Same gate as device-flow: tenant approves DNS writes too (operator
    # token, tenant decision). Settings-side, see above.
    environment: anchor
    env:
      TENANT_USER: ${{ vars.TENANT_USER }}
      # Resolved-or-pasted target from the device-flow job (discovery-first;
      # the pasted secret wins when set, so the legacy path is byte-for-byte).
      ANCHOR_IPV4: ${{ needs.device-flow.outputs.anchor_ipv4 }}
      CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Upsert anchor A record + verify-after-write
        run: |
          set -euo pipefail
          # Load-bearing order: this job needs device-flow (A1 close +
          # sweep are steps inside it), and the thumbprint job needs THIS
          # job — DNS failure fails the run before any thumbprint goes
          # out, so we never bind-by-name against a record we didn't just
          # verify. Absent CLOUDFLARE_DNS_TOKEN on mode=apply = explicit
          # error from the script (C-A fail-closed: set the org secret,
          # then re-dispatch). mode=check never runs this job and never
          # requires the token. Same static global mutex covers this job
          # (workflow-level concurrency); no new actions (curl + jq only).
          bash .github/scripts/030-anchor-dns.sh

  apply-placeholder:
    name: "mode=apply (stateless skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'apply'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Set up OpenTofu (>= 1.11 for ephemeral values)
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # SHA pin of setup-opentofu v2
        with:
          tofu_version: "1.12.2"
      # M2: the real path (ephemeral exchange → data-source resolve →
      # plan → apply → state dies with the runner; policy name
      # piercloud-anchor-${hostname}-${server_id} lands fully in M3) now runs
      # in the device-flow job on the SAME runner (token never crosses
      # jobs). This job stays a mode-scope marker.
      - name: Mode marker (real steps run in the device-flow job)
        run: |
          set -euo pipefail
          echo "mode=apply for alias '${{ vars.TENANT_USER }}': tofu plan/apply + A1 window + ssh provision run in the device-flow job (same-runner token handoff)."

  check-hygiene:
    name: "mode=check (drift + hygiene skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'check'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Retention-setting warning (H1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::warning::Run artifacts keep the thumbprint (retention-days: 400 covers artifacts ONLY) — never rely on logs alone; repo log retention is a separate setting."
          # TODO(M2): read the repo retention setting via the API here and
          # warn when it is below the 400-day artifact horizon.
          echo "mode=check skeleton: drift report + orphan list land in M2; hygiene only, nothing to keep alive (S1)."
      - name: Versions-behind notice
        run: |
          set -euo pipefail
          echo "mode=check skeleton: versions-behind notice (Renovate queue vs pinned SHAs / .opentofu-version) lands in M2."
          # TODO(M2): compare pinned action SHAs + .opentofu-version against
          # the Renovate queue and print the behind-count (notice only).

  update-ip-placeholder:
    name: "mode=update-ip (ADD-before-move skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'update-ip'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      # Protocol (enforced in M2): ADD new source first, old kept during
      # transition, removed after confirmed boot; operator requests, OWNER
      # executes; batch = N per-tenant approvals, never one operator token.
      - name: Skeleton marker (M2 wires the real steps)
        run: |
          set -euo pipefail
          echo "mode=update-ip skeleton for alias '${{ vars.TENANT_USER }}': add='${{ inputs.add_ipv4 }} ${{ inputs.add_ipv6 }}' remove='${{ inputs.remove_ipv4 }}'. ADD-before-move enforcement lands in M2."

  destroy-gate:
    name: "mode=destroy (policy + attachment ONLY)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'destroy'
    steps:
      - name: Require ack_main_unbound + canary-fail proof
        run: |
          set -euo pipefail
          if [ "${{ inputs.ack_main_unbound }}" != "true" ]; then
            echo "::error::mode=destroy requires ack_main_unbound=true (main box proven unbound first). Refusing teardown."
            exit 1
          fi
          echo "ack_main_unbound confirmed (skeleton). Destroys policy + attachment ONLY; server + tang keys untouched."
          # TODO(M2): canary-fail proof check + real teardown steps. Server +
          # tang keys are never touched by this mode.

  thumbprint:
    name: "H1 thumbprint chain (artifact)"
    runs-on: ubuntu-latest
    needs: [device-flow, anchor-dns]
    if: inputs.mode == 'apply'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Write thumbprint captured by the A1 provision step
        env:
          THUMBPRINT: ${{ needs.device-flow.outputs.thumbprint }}
          ANCHOR_HOSTNAME: ${{ needs.device-flow.outputs.anchor_hostname }}
        run: |
          set -euo pipefail
          # The tang thumbprint is public (goes to the password manager +
          # committed break-glass file + ntfy) — safe to carry as a job
          # output, unlike the token (which never crosses jobs).
          if [ -z "$THUMBPRINT" ]; then
            echo "::error::no thumbprint captured — the A1 provision step did not report one. Refusing to publish an empty artifact (H1: never logs alone)."
            exit 1
          fi
          if [ -z "$ANCHOR_HOSTNAME" ]; then
            echo "::error::no anchor hostname captured — the resolve step did not report one. Refusing to publish an artifact without the bind name (D9: output.bind_name must be real)."
            exit 1
          fi
          # D9: TF_VAR_anchor_hostname is populated in the plan/apply steps, so
          # output.bind_name is real — carry the bind URL + command into the
          # artifact (the README's clevis command; never logs alone). The scheme
          # is split out so the CI endpoint scan over this file sees no new
          # literal URL; no endpoint is added or changed.
          BIND_SCHEME="http"
          ANCHOR_FQDN="${ANCHOR_HOSTNAME}.piercloud.net"
          printf '%s\n' "$THUMBPRINT" > thumbprint.txt
          echo "alias=${{ vars.TENANT_USER }} head=${{ github.sha }}" >> thumbprint.txt
          echo "bind_url=${BIND_SCHEME}://${ANCHOR_FQDN}" >> thumbprint.txt
          echo "clevis luks bind -d /dev/sda3 tang '{\"url\":\"${BIND_SCHEME}://${ANCHOR_FQDN}\"}'" >> thumbprint.txt
      - name: Upload thumbprint artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # SHA pin of upload-artifact v6
        with:
          name: thumbprint-${{ vars.TENANT_USER }}
          path: thumbprint.txt
          # 400d = artifacts ONLY (H1 rule: never rely on logs alone — repo
          # log retention is a separate setting; runs/checks get deleted).
          retention-days: 400
          if-no-files-found: error
      # NOTE (H1, committed break-glass file): the runner holds
      # contents:read and cannot push — the committed copy arrives via a
      # reviewable PR from a separate App identity (mechanism resolves before
      # the thumbprint chain is called done; stubbed in M1).
