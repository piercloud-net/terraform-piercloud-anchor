# .github/workflows/provision.yml — v0.2 phone-first provisioning (M1 skeleton).
#
# Plan milestone M2 (SPEC step 3): A1 hardened window + CI-called entrypoint
# `.github/scripts/020-provision-anchor.sh` (sweep-pre / open / provision /
# close / sweep-post) + same-job ephemeral-token handoff + stateless tofu
# apply. M1 skeleton properties (SHA pins, mutex, C-E banner, H1 artifact)
# are unchanged.
#
# M0 live-evidence (real netcup device-flow drill on a phone) gates done-ness,
# NOT this scaffolding — M0-pending, recorded in the PR body.
#
# OpenTofu note: the tofu steps wired in M2 REQUIRE required_version >= 1.11
# (ephemeral values carry the per-run netcup token; the token never lands in
# state). The module bump itself lands in M3.
#
# DNS stage (anchor-dns job → .github/scripts/lib/broker-dns.sh): anchor
# A-record upsert + verify-after-write runs after A1 close (needs
# device-flow) and before thumbprint issuance (thumbprint needs anchor-dns)
# — a DNS failure fails the run before any thumbprint goes out, always.
# b3b (#189): the writer is the pc-control broker over the per-run GitHub
# OIDC token (the A2 provider-switched direct-token writer was retired; no
# provider credential reaches the runner). The broker upserts BOTH the
# anchor A and the explicit per-tenant dashboard CNAME `<tenant>.status`
# from registry-owned names and its own edge-target config (the ACME
# challenge node is an ENT — wildcard-only goes dark at every renewal on an
# RFC 4592-strict provider), cross-checks the IPv4 against the same-run
# report, and verifies after write. Managed dispatches only (tenant +
# anchor_ref): a ref-less apply refuses at the guard below.

name: provision

# Run name is the control plane's only discovery surface: the dispatch API
# returns 204 with no run id and the run object exposes no `inputs`, so the
# pc-control dispatcher matches the run it created by `display_title` against
# the `dispatch_intent` it sent (`<alias> <action> <intent8>`). The fallback
# keeps manual runs nameable — GitHub substitutes event-specific text for an
# empty run-name, so an explicit `(manual)` form is required.
run-name: ${{ inputs.dispatch_intent != '' && inputs.dispatch_intent || format('{0} (manual)', inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Provisioning mode: apply | check | update-ip | destroy"
        required: true
        default: apply
        type: choice
        options: [apply, check, update-ip, destroy]
      dispatch_intent:
        description: "Control-plane intent string, echoed in run-name (operator/pc-control use; leave empty for manual runs)."
        required: false
        default: ""
        type: string
      ack_main_unbound:
        description: "Destroy gate: confirm the main box is already unbound (required for mode=destroy)."
        required: false
        default: false
        type: boolean
      add_ipv4:
        description: "update-ip: IPv4 source to ADD (ADD-before-move; old kept during transition)."
        required: false
        type: string
      add_ipv6:
        description: "update-ip: IPv6 source to ADD."
        required: false
        type: string
      remove_ipv4:
        description: "update-ip: old IPv4 source to remove AFTER confirmed boot."
        required: false
        type: string
      rotate_keys:
        description: "apply: forward --rotate to the on-box provision step (tang-key rotation)."
        required: false
        default: false
        type: boolean
      acknowledge_changed_workflows:
        description: "Red-banner gate: check ONLY after reviewing the workflow diff yourself (required when the banner shows CHANGED)."
        required: false
        default: false
        type: boolean
      tenant:
        description: "Managed (a′) dispatch: tenant environment to select (environment-scoped variables and secret values override repo-level ones). Empty = the shared `anchor` environment (manual/template runs)."
        required: false
        default: ""
        type: string
      anchor_ref:
        description: "Managed (a′) dispatch: opaque anchor/account reference — the concurrency lane key (`anchor-<ref>`; one writer per netcup account). Empty = the static fallback lane."
        required: false
        default: ""
        type: string

# Single-writer-per-account lane (owner ruling 2026-10-12, issue #132;
# docs/invariants.md §Invariant 3). Every run that mutates a netcup account
# serializes on `anchor-<anchor_ref>` — the opaque registry reference for the
# anchor's account (anchor↔account is 1:1, so one lane == one writer per
# account). The `inputs` context is legal in concurrency.group; only
# the secret context is forbidden (verified R6 gate 6; this supersedes the same
# note's per-tenant `provision-<alias>` recommendation — a group anchor
# shares one lane, and per-tenant lanes would let two members' runs overlap
# on one account). An empty ref falls back to the static lane — manual and
# template-created runs are unchanged — but every run that can touch a
# managed account MUST carry the same ref: the platform dispatcher sets it,
# a manual run on a managed account passes it explicitly, a managed (tenant)
# dispatch without it fails closed at the preflight, and a ref-less mutating
# run warns loudly. NOTE: the lane is evaluated when the run is created,
# before any input validation — a bad dispatch carrying a valid ref still
# occupies that account's lane and can cancel its single pending run; the
# backend ledger is the queue, never GitHub.
concurrency:
  group: ${{ inputs.anchor_ref != '' && format('anchor-{0}', inputs.anchor_ref) || 'piercloud-netcup-policy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  visibility-banner:
    name: "C-E visibility banner (LOUD on change)"
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.banner.outputs.head_full }}
      head_short: ${{ steps.banner.outputs.head_short }}
      workflows_changed: ${{ steps.banner.outputs.workflows_changed }}
    steps:
      # Managed-input preflight (issue #132). Lives in the UNGATED banner job
      # so a malformed dispatch fails BEFORE the runner evaluates the
      # environment protection gate on `device-flow` — a reviewer tap must
      # never be consumed by a run that cannot proceed — and before an
      # unknown `tenant` can be bound to a job. The runner evaluates the
      # environment name and the concurrency lane when the jobs are
      # scheduled, so this step can only reject the *shape*; the device-flow
      # job re-checks the environment binding (the MANAGED_TENANT marker)
      # once the environment is selected.
      - name: Managed-input preflight (tenant/anchor_ref — fail closed before any gate)
        env:
          TENANT_INPUT: ${{ inputs.tenant }}
          ANCHOR_REF: ${{ inputs.anchor_ref }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Default both for `set -u` (the workflow always passes them;
          # hand-extracted step bodies may not).
          TENANT_INPUT="${TENANT_INPUT:-}"
          ANCHOR_REF="${ANCHOR_REF:-}"
          # The tenant input is the GitHub environment name AND (#198) the
          # managed alias, so it must satisfy both grammars here, before any
          # gate: pc-control's environment/alias grammar ^[a-z0-9]{3,15}$
          # (registry.ValidateEnvName) and the anchor's tenant-name rule
          # (scripts/lib/naming.sh validate_tenant_username: reserved
          # anchor/status/pcu/platform prefixes). The binding step re-runs
          # the canonical validator before the device card.
          case "$TENANT_INPUT" in
            '') ;;
            *[!a-z0-9]*) echo "::error::tenant input must match ^[a-z0-9]{3,15}$ (the pc-control environment/alias grammar) — refusing."; exit 1 ;;
            anchor* | status* | pcu* | platform*) echo "::error::tenant input starts with a reserved prefix (anchor/status/pcu/platform) — refusing."; exit 1 ;;
            edge | console | ops | keys | unlock | bounce | mail | broker | www) echo "::error::tenant input is a reserved platform name (pc-control registry reserved set) — refusing."; exit 1 ;;
          esac
          if [ -n "$TENANT_INPUT" ] && { [ "${#TENANT_INPUT}" -lt 3 ] || [ "${#TENANT_INPUT}" -gt 15 ]; }; then
            echo "::error::tenant input must be 3-15 characters (the pc-control environment/alias grammar) — refusing."; exit 1
          fi
          # Lowercase-only: the concurrency lane is evaluated before any step
          # runs and GitHub expressions cannot fold case, so an uppercase ref
          # could occupy a different lane than its lowercase spelling.
          # Canonical dispatcher refs are lowercase (the registry ref is ours
          # to define).
          case "$ANCHOR_REF" in
            '') ;;
            *[!a-z0-9._-]*) echo "::error::anchor_ref input must match [a-z0-9._-]{1,64} (lowercase) — refusing."; exit 1 ;;
          esac
          [ "${#ANCHOR_REF}" -le 64 ] || { echo "::error::anchor_ref input exceeds 64 characters — refusing."; exit 1; }
          # A managed dispatch must carry the lane: without it the run would
          # fall into the static lane while other runs for the same account
          # use `anchor-<ref>` — two writers on one account (invariant 3).
          if [ -n "$TENANT_INPUT" ] && [ -z "$ANCHOR_REF" ]; then
            echo "::error::a managed (tenant) dispatch must carry anchor_ref — the account lane key; refusing (a lane-less run could overlap a live run on the same account)."
            exit 1
          fi
          # b3b (#189): apply is managed-dispatch-only now. The anchor DNS
          # stage writes through the pc-control broker, which authorizes
          # from the env->tenant->lane binding and cross-checks the same-run
          # IPv4 report — a ref-less (static fallback lane) or tenant-less
          # apply cannot complete it, and device-flow would provision the
          # box before the DNS job refuses. Fail here, BEFORE the
          # environment gate and before any provisioning, naming the
          # retirement.
          if [ "$MODE" = "apply" ] && { [ -z "$TENANT_INPUT" ] || [ -z "$ANCHOR_REF" ]; }; then
            echo "::error::apply now requires a managed dispatch (tenant + anchor_ref): anchor DNS writes through the pc-control broker (b3b, #189), which needs the account lane and the same-run IPv4 report; the direct provider-token writer was retired. Refusing before any provisioning."
            exit 1
          fi
          # update-ip/destroy do not touch anchor DNS: a ref-less run still
          # warns loudly — on a managed account it uses the static fallback
          # lane and can overlap a managed run (the disclosed invariant-3
          # residual).
          if [ -z "$ANCHOR_REF" ]; then
            case "$MODE" in
              update-ip|destroy) echo "::warning::no anchor_ref — this run uses the static fallback lane. On a managed netcup account pass the account's anchor_ref so runs on it serialize (one writer per account)." ;;
            esac
          fi
          echo "Managed-input preflight ok."

      # Repo-scope check (issue #204). A managed run reads its operator-plane
      # and per-anchor values from its own environment, and GitHub falls
      # back from the environment to the repository (and organization) per
      # name. This job selects NO environment, so each probe below sees
      # repository/organization scope only: a `true` means a managed run
      # would inherit that value (the #198 leak class). Refuse the managed
      # dispatch, before any gate or device card, naming the names (never
      # the values; a probe is a boolean). The probe set is pinned to the
      # set of names read directly in the environment jobs
      # (the managed-operator-plane harness). MANAGED_TENANT and
      # TENANT_CUSTOMER_NUMBER are environment-only by contract.
      - name: Repo-scope check (managed runs read operator-plane values from their environment only)
        env:
          TENANT_INPUT: ${{ inputs.tenant }}
          REPO_SCOPE_ANCHOR_IPV4: ${{ secrets.ANCHOR_IPV4 != '' }}
          REPO_SCOPE_SCP_USER_ID: ${{ secrets.SCP_USER_ID != '' }}
          REPO_SCOPE_ANCHOR_ROOT_PASSWORD: ${{ secrets.ANCHOR_ROOT_PASSWORD != '' }}
          REPO_SCOPE_GATUS_ENDPOINTS: ${{ secrets.GATUS_ENDPOINTS != '' }}
          REPO_SCOPE_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC != '' }}
          REPO_SCOPE_NTFY_TOKEN: ${{ secrets.NTFY_TOKEN != '' }}
          REPO_SCOPE_CF_AOP_CA_PEM: ${{ secrets.CF_AOP_CA_PEM != '' }}
          REPO_SCOPE_RECORDING_WITNESS_ENDPOINT: ${{ secrets.RECORDING_WITNESS_ENDPOINT != '' }}
          REPO_SCOPE_RECORDING_WITNESS_BUCKET: ${{ secrets.RECORDING_WITNESS_BUCKET != '' }}
          REPO_SCOPE_RECORDING_WITNESS_AUDIT_PREFIX: ${{ secrets.RECORDING_WITNESS_AUDIT_PREFIX != '' }}
          REPO_SCOPE_RECORDING_WITNESS_RECORDINGS_PREFIX: ${{ secrets.RECORDING_WITNESS_RECORDINGS_PREFIX != '' }}
          REPO_SCOPE_RECORDING_WITNESS_KEY_ID: ${{ secrets.RECORDING_WITNESS_KEY_ID != '' }}
          REPO_SCOPE_RECORDING_WITNESS_KEY: ${{ secrets.RECORDING_WITNESS_KEY != '' }}
          REPO_SCOPE_TENANT_CUSTOMER_NUMBER: ${{ secrets.TENANT_CUSTOMER_NUMBER != '' }}
          REPO_SCOPE_ANCHOR_ROLE: ${{ vars.ANCHOR_ROLE != '' }}
          REPO_SCOPE_STATUS_PULLER: ${{ vars.STATUS_PULLER != '' }}
          REPO_SCOPE_ORIGIN_CA_CERT_PEM: ${{ vars.ORIGIN_CA_CERT_PEM != '' }}
          REPO_SCOPE_RECORDING_WITNESS_RENOTIFY_SECONDS: ${{ vars.RECORDING_WITNESS_RENOTIFY_SECONDS != '' }}
          REPO_SCOPE_RECORDING_WITNESS_QUIET_RENOTIFY_SECONDS: ${{ vars.RECORDING_WITNESS_QUIET_RENOTIFY_SECONDS != '' }}
          REPO_SCOPE_RECORDING_WITNESS_QUIET_SIGNATURE: ${{ vars.RECORDING_WITNESS_QUIET_SIGNATURE != '' }}
          REPO_SCOPE_RECORDING_WITNESS_ACK_IDENTITIES: ${{ vars.RECORDING_WITNESS_ACK_IDENTITIES != '' }}
          REPO_SCOPE_RECORDING_WITNESS_COLD_START_SECONDS: ${{ vars.RECORDING_WITNESS_COLD_START_SECONDS != '' }}
          REPO_SCOPE_RECORDING_WITNESS_SWEEP_SECONDS: ${{ vars.RECORDING_WITNESS_SWEEP_SECONDS != '' }}
          REPO_SCOPE_MANAGED_TENANT: ${{ vars.MANAGED_TENANT != '' }}
        run: |
          set -euo pipefail
          TENANT_INPUT="${TENANT_INPUT:-}"
          if [ -z "$TENANT_INPUT" ]; then
            echo "Operator run (no tenant): repository-level values are this run's own; repo-scope check not applicable."
            exit 0
          fi
          probes=0
          found=""
          for v in ${!REPO_SCOPE_@}; do
            probes=$((probes + 1))
            case "${!v}" in
              true) found="$found ${v#REPO_SCOPE_}" ;;
              false) ;;
              *) echo "::error::repo-scope probe $v is not true/false; refusing."; exit 1 ;;
            esac
          done
          if [ "$probes" -eq 0 ]; then
            echo "::error::no repo-scope probes reached this step; refusing (fail closed)."
            exit 1
          fi
          if [ -n "$found" ]; then
            echo "::error::defined at repository or organization level:$found. A managed run would inherit these from there (issue #198). Move each into the anchor's environment and delete the repository-level copy; refusing before any gate or device card."
            exit 1
          fi
          echo "Repo-scope check ok ($probes names, none at repository or organization level)."

      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Approval card — head SHA + compare link + workflow/run-code file count
        id: banner
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT="$(echo "$HEAD_SHA" | cut -c1-7)"
          # The count comes from .github/scripts/banner-workflow-diff.sh:
          # no fetch (a shallow fetch grafts the base ref and kills the merge
          # base on a behind-main branch — #130), the remote-tracking ref is
          # fully qualified and must exist (tag shadowing), the counted set is
          # the run's executed code surface (workflows + CI scripts + sourced
          # provisioning scripts + the applied root HCL), a symlink in that
          # surface refuses, and an undeterminable count fails the step loud
          # instead of reporting a false UNCHANGED.
          COUNT="$(bash .github/scripts/banner-workflow-diff.sh "$BASE_REF")"
          DIFF_LINK="${{ github.server_url }}/${{ github.repository }}/compare/$BASE_REF...$HEAD_SHA"
          echo "head_short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "head_full=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_files=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### Approval card (C-E) for \`$TENANT_USER\`"
            echo ""
            echo "head: \`$SHORT\` (\`$HEAD_SHA\`) — [compare-diff]($DIFF_LINK)"
            echo "workflow/run-code files changed: \`$COUNT\`"
            echo ""
            # Anti-phishing line, carried verbatim on every approval card.
            echo "we will never email or message you a code to re-confirm."
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "workflows_changed=false" >> "$GITHUB_OUTPUT"
              echo "🟢 UNCHANGED — no workflow/run-code changes vs this head's merge base with $BASE_REF."
              echo "piercloud: apply ready for $TENANT_USER @$SHORT. No workflow/run-code changes. Approve: $RUN_URL code XXXX-XXXX (expires 10 min). We never email codes."
            else
              echo "workflows_changed=true" >> "$GITHUB_OUTPUT"
              echo "🔴 CHANGED — $COUNT workflow/run-code file(s) differ from this head's merge base with $BASE_REF."
              echo "piercloud STOP: workflow/run-code files in ${{ github.repository }} changed since your last approval (head $HEAD_SHA, $COUNT file(s); review the compare link). Do NOT approve. Open $DIFF_LINK or ask the operator what changed. Nothing runs until you approve."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Last-approved pin via actions:read stays backend mechanics (open
          # design Q4); failed check = no apply, always (C-A). The red-banner
          # acknowledge gate below enforces the checkbox half starting now.

      - name: Record head SHA for the backend approval pin
        env:
          HEAD_SHA: ${{ github.sha }}
          HEAD_SHORT: ${{ steps.banner.outputs.head_short }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
        run: |
          set -euo pipefail
          # Template side of the head_sha approval pin (open design Q4): the
          # run publishes the dispatched head SHA as job outputs (see the
          # outputs block above) AND as a machine-readable artifact, so the
          # future backend can record the last-approved head via
          # actions:read. Failed check = no apply, always. Backend mechanics
          # themselves are out of scope for v0.2.
          printf 'head_sha=%s head_short=%s alias=%s\n' "$HEAD_SHA" "$HEAD_SHORT" "$TENANT_USER" > head-sha.txt
      - name: Upload head-SHA artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # SHA pin of upload-artifact v6
        with:
          name: head-sha-${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          path: head-sha.txt
          # 90 = the public-repo cap: a convenience copy, not logs and not
          # the durable record (H1: the committed break-glass file +
          # platform registry are the durable legs).
          retention-days: 90
          if-no-files-found: error

      - name: ntfy verdict (verbatim strings)
        env:
          NTFY_TOPIC: ${{ inputs.tenant == '' && secrets.NTFY_TOPIC || '' }}
          NTFY_TOKEN: ${{ inputs.tenant == '' && secrets.NTFY_TOKEN || '' }}
          HEAD_SHORT: ${{ steps.banner.outputs.head_short }}
          WORKFLOW_FILES: ${{ steps.banner.outputs.workflow_files }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Secret names chosen in M1 (design Q5): NTFY_TOPIC + NTFY_TOKEN
          # (publish-scoped). Nothing is committed. This job selects no
          # environment, so it sees repository-level values only: the
          # operator run's topic. Managed runs (#198) resolve both empty: no
          # card ntfy (the topic lives in the tenant environment, #204).
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — verdict stays in the run summary (OK for skeleton)."
            exit 0
          fi
          if [ "$WORKFLOW_FILES" -eq 0 ]; then
            MSG="piercloud: apply ready for $TENANT_USER @$HEAD_SHORT. No workflow/run-code changes. Approve: $RUN_URL code XXXX-XXXX (expires 10 min). We never email codes."
          else
            MSG="piercloud STOP: workflow/run-code files in ${{ github.repository }} changed since your last approval (head ${{ github.sha }}, $WORKFLOW_FILES file(s); review the compare link). Do NOT approve. Open ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.sha }} or ask the operator what changed. Nothing runs until you approve."
          fi
          # Empty token = no header at all (ntfy.sh 401s on an empty Basic).
          # --fail: a rejected push fails the step instead of dying silently.
          NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
          curl -sS --fail "${NTFY_AUTH[@]}" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          # TODO(M2): red verdict hides the netcup URL/code behind an
          # acknowledge-checkbox on the no-account path (open design Q5).

  device-flow:
    name: "S1 device-flow (C-a..C-f) + A1 window + stateless apply"
    runs-on: ubuntu-latest
    needs: [visibility-banner]
    # OIDC: the broker report step below mints a token with the
    # `piercloud-broker` audience (pc-control #123); the anchor-dns job
    # mints one too for the DNS write (b3b). No other job needs id-token.
    permissions:
      contents: read
      id-token: write
    # Reviewer policy (deliberate, matches the live settings): NO required
    # reviewer is configured by default — the environment exists only as a
    # stable gate name, and the LOUD banner + the approval card are the
    # review mechanism (S1: no standing credential exists; the per-run
    # approval is the anchor). A tenant MAY opt into a required reviewer in
    # repo settings, but that makes their GitHub login anonymous-readable
    # through the environments API — the reason it is never the default and
    # never names an operator identity. Where a reviewer is configured,
    # GitHub pauses the run for the tap BEFORE any token exists (execution
    # approval); only then does the merged request → card → poll step below
    # mint the device card (account approval). Two taps, correct order.
    # Banner stays ungated so the card exists to review first.
    # Managed (a′) dispatch: `tenant` selects the tenant environment — the
    # job then reads environment-scoped variables and secret values (they override
    # repo-level). Empty keeps the shared `anchor` environment (manual and
    # template runs are unchanged). Caveat carried from R6: an unknown
    # environment name is auto-created by GitHub with no protection rules —
    # the platform lifecycle (verify-after-write, can_admins_bypass:false)
    # is the control; the approver guard below still fails closed on a
    # wrong-account approval.
    environment: ${{ inputs.tenant != '' && inputs.tenant || 'anchor' }}
    outputs:
      thumbprint: ${{ steps.a1-provision.outputs.thumbprint }}
      anchor_ipv4: ${{ steps.resolve.outputs.anchor_ipv4 }}
      anchor_hostname: ${{ steps.resolve.outputs.anchor_hostname }}
      tenant_user: ${{ steps.resolve.outputs.tenant_user }}
    env:
      # Identifiers resolve from stored secret values inside runs (C-E): the
      # selected environment's value first, then repository level for names
      # it does not define — never dispatch inputs, never logs (values are
      # write-only, log-masked).
      # Operator-plane and per-anchor values (#204) are read directly here:
      # this job selects the tenant environment, so GitHub resolves the
      # environment's value first. The ungated visibility-banner job refuses
      # a managed dispatch while any of those names is still defined at
      # repository or organization level, so a repo-level value never falls
      # through to a tenant (#198). The managed alias is the validated
      # tenant input and the managed customer number is the tenant-only
      # TENANT_CUSTOMER_NUMBER (environment scope).
      # No HOSTNAME secret: derived below as anchor-01-<tenant>.
      # No SCP_USER_ID secret by default: resolved from the token via OIDC
      # userinfo in the resolve step (override only if yours differs).
      # ANCHOR_IPV4 / ANCHOR_ROOT_PASSWORD are optional (issue #50): unset
      # means zero-IP discovery + a caller-set one-time password. When set,
      # ANCHOR_IPV4 must match one of the resolved server's own IPv4
      # addresses — it selects, never overrides; a mismatch fails closed.
      # ANCHOR_ROOT_PASSWORD keeps the legacy pasted-password path as-is.
      CUSTOMER_NUMBER: ${{ inputs.tenant != '' && secrets.TENANT_CUSTOMER_NUMBER || inputs.tenant == '' && secrets.CUSTOMER_NUMBER || '' }}
      TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
          # M2: the A1 entrypoint lives in this repo
          # (.github/scripts/020-provision-anchor.sh) — the device-flow job
          # must check it out to call it (full checkout: tofu below needs
          # the module files too).

      - name: Tenant-environment binding check (environment marker == tenant input)
        env:
          TENANT_INPUT: ${{ inputs.tenant }}
          MANAGED_TENANT: ${{ vars.MANAGED_TENANT }}
        run: |
          set -euo pipefail
          TENANT_INPUT="${TENANT_INPUT:-}"
          MANAGED_TENANT="${MANAGED_TENANT:-}"
          CUSTOMER_NUMBER="${CUSTOMER_NUMBER:-}"
          # GitHub resolves environment-scoped variables with a repo-level
          # fallback per key, so an auto-created (typo) or partially
          # provisioned environment silently mixes repo-level values with a
          # tenant's. The env lifecycle (pc-lifecycle; verify-after-write,
          # can_admins_bypass:false) sets MANAGED_TENANT=<environment name>
          # on every provisioned tenant environment; its absence/mismatch
          # fails this run closed before the banner gate and the device
          # card. In-workflow half of the "platform lifecycle is the
          # control" claim; the lane key itself was already evaluated when
          # the run was created.
          # The tenant input is the managed alias (#198): run the canonical
          # tenant-name validator before the device card, not only in the
          # resolve step after it.
          if [ -n "$TENANT_INPUT" ]; then
            # shellcheck source=scripts/lib/naming.sh
            . scripts/lib/naming.sh
            if ! validate_tenant_username "$TENANT_INPUT"; then
              echo "::error::tenant input '$TENANT_INPUT' is not a valid tenant name — refusing before the device card."
              exit 1
            fi
          fi
          if [ -n "$TENANT_INPUT" ] && [ "$MANAGED_TENANT" != "$TENANT_INPUT" ]; then
            echo "::error::environment '$TENANT_INPUT' does not carry MANAGED_TENANT='$TENANT_INPUT' — refusing (a typo'd/partial environment would silently read repo-level values). Provisioned tenant environments set the marker; see docs/invariants.md invariant 3."
            exit 1
          fi
          # Operator-plane separation (#198, #204): a managed run reads no
          # repo-level value except the platform-plane MAIN_BOX_IPV4 (the
          # banner job's repo-scope check refused the dispatch otherwise; pinned
          # by tests/managed-operator-plane), and the managed customer number
          # comes from the tenant-only TENANT_CUSTOMER_NUMBER, which is never
          # defined at repo level. Empty = the approver guard could never
          # pass, so refuse here, before the device card spends the tenant's
          # approval tap.
          if [ -n "$TENANT_INPUT" ] && [ -z "$CUSTOMER_NUMBER" ]; then
            echo "::error::environment '$TENANT_INPUT' has no TENANT_CUSTOMER_NUMBER secret — refusing before the device card (a managed run never falls back to the operator's repo-level CUSTOMER_NUMBER; issue #198)."
            exit 1
          fi
          echo "Tenant-environment binding ok."

      - name: Red-banner acknowledge gate (C-E, no-GitHub path)
        if: needs.visibility-banner.outputs.workflows_changed == 'true'
        run: |
          set -euo pipefail
          # Red banner = workflows changed: the run stops here unless the
          # dispatcher checked acknowledge_changed_workflows AFTER reviewing
          # the diff themselves. Moved BEFORE the merged device step (D4):
          # a red run must never mint a device code nor ask the tenant to
          # approve anything. Boolean input (true/false only) — safe in the
          # test. Green banners skip this step entirely.
          if [ "${{ inputs.acknowledge_changed_workflows }}" != "true" ]; then
            echo "::error::workflows CHANGED since baseline and acknowledge_changed_workflows is unchecked. Review the diff from the banner card first, then re-dispatch with the box checked. Nothing runs until you do."
            exit 1
          fi
          echo "Red-banner acknowledged — proceeding."

      - name: "S1 device flow: request → card → poll (single runner, C2)"
        id: device
        env:
          # Public, constant Keycloak discovery doc (same realm for every tenant).
          NETCUP_OIDC_DISCOVERY_URL: "https://www.servercontrolpanel.de/realms/scp/.well-known/openid-configuration"
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          MODE: ${{ inputs.mode }}
          HEAD_SHA: ${{ github.sha }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail
          # C2: device_code never crosses a job boundary. The old split
          # (ungated request job → job outputs → consumer step env) leaked it
          # into the public run log via the env dump; request, card and poll
          # now live in this one step and the secret is masked at birth.
          # Handoff-write guard (review security): the token response is
          # API-derived; a crafted value with an embedded newline would forge
          # additional $GITHUB_ENV lines (e.g. redirect NETCUP_API_BASE).
          guard_line() { # $1 label, $2 API-derived value
            case "$2" in *[$'\n\r']*) echo "::error::$1 contains a newline/CR — refusing the handoff write (injection guard)."; exit 1 ;; esac
            if [ -n "$(printf '%s' "$2" | LC_ALL=C tr -d '[:print:]')" ]; then echo "::error::$1 contains non-printable characters — refusing the handoff write (injection guard)."; exit 1; fi
          }
          # M0-gate: literal device/token endpoint URLs are NOT hardcoded here
          # (prior literals were probed, never recorded). Endpoints are
          # recovered from the Keycloak OIDC discovery document FIRST.
          DISCO="$(curl -sS "$NETCUP_OIDC_DISCOVERY_URL")"
          DEVICE_ENDPOINT="$(echo "$DISCO" | jq -r '.device_authorization_endpoint')"
          TOKEN_ENDPOINT="$(echo "$DISCO" | jq -r '.token_endpoint')"
          test "$DEVICE_ENDPOINT" != "null" || { echo "::error::discovery doc lacks device_authorization_endpoint — STOP, escalate."; exit 1; }
          # Endpoint pin (review security MEDIUM): only the live SCP Keycloak
          # realm may receive auth traffic — a tampered discovery document
          # must not receive the device code (or, later, the tokens).
          require_scp_endpoint() { # $1 label, $2 URL
            case "$2" in
              https://www.servercontrolpanel.de/realms/scp/*) ;;
              *) echo "::error::$1 is not an https://www.servercontrolpanel.de/realms/scp/ endpoint — refusing to POST (endpoint pin)."; exit 1 ;;
            esac
          }
          require_scp_endpoint "device_authorization_endpoint" "$DEVICE_ENDPOINT"
          require_scp_endpoint "token_endpoint" "$TOKEN_ENDPOINT"
          RESP="$(curl -sS -X POST "$DEVICE_ENDPOINT" --data-urlencode "client_id=scp" --data-urlencode "scope=offline_access openid")"
          # C-f: grant disabled (or any refusal) → STOP + escalate.
          # No downgrade path exists by design (C-A) — this run exits here.
          if echo "$RESP" | jq -e 'has("error")' >/dev/null; then
            DESC="$(echo "$RESP" | jq -r '.error_description // .error')"
            echo "::error::device authorization refused ($DESC). STOP — the device grant may be disabled. Escalate to the operator. No fallback of any kind exists (C-A)."
            exit 1
          fi
          # C-a: the authorization secret is masked at birth, immediately
          # after the fail-closed guard — safe now that it never crosses a
          # job boundary (a masked value silently disappears from
          # GITHUB_OUTPUT, so an output would be impossible; there is none).
          # jq yields the literal null for a missing key: fail closed BEFORE
          # masking (masking null would redact unrelated text later).
          DEVICE_CODE="$(echo "$RESP" | jq -r '.device_code // empty')"
          if [ -z "$DEVICE_CODE" ] || [ "$DEVICE_CODE" = "null" ]; then
            echo "::error::device authorization response carried no device_code — refusing to continue (fail closed, no fallback)."
            exit 1
          fi
          echo "::add-mask::$DEVICE_CODE"
          # C2b: the public half of the grant (user code + verification URL)
          # is the approval surface by design. Fail closed on missing/empty
          # values before the card is built.
          USER_CODE="$(echo "$RESP" | jq -r '.user_code // empty')"
          VERIFY_URI="$(echo "$RESP" | jq -r '.verification_uri_complete // .verification_uri // empty')"
          if [ -z "$USER_CODE" ] || [ "$USER_CODE" = "null" ]; then
            echo "::error::device authorization response carried no user_code — the approval card cannot be shown; refusing to continue (fail closed)."
            exit 1
          fi
          if [ -z "$VERIFY_URI" ] || [ "$VERIFY_URI" = "null" ]; then
            echo "::error::device authorization response carried no verification URI — the approval card cannot be shown; refusing to continue (fail closed)."
            exit 1
          fi
          # Review finding F1: user_code/verify_uri are API-derived and reach
          # the log, the summary, ntfy and a runner command (::notice) — reject
          # newline/CR/non-printable values so the response cannot forge
          # runner commands or split the card (same guard as the token writes).
          guard_line "user_code" "$USER_CODE"
          guard_line "verify_uri" "$VERIFY_URI"
          INTERVAL="$(echo "$RESP" | jq -r '.interval // 5')"
          SHORT="$(echo "$HEAD_SHA" | cut -c1-7)"
          # C2b card fields: action + pinned commit + review link. The compare
          # link is expression-built (no literal scheme/host) so the CI
          # endpoint allowlist sees no new URL.
          REVIEW_LINK="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...${{ github.sha }}"
          ANTI_PHISH="we will never email or message you a code to re-confirm."
          NEW_TAB_HINT="long-press the link to open in a new tab — keeps this page open to follow the deployment progress."
          # C-b: print ONLY the verification URL + user_code (+ alias, mode,
          # commit, review link). Quiet curl flags only; no verbose dumps; no
          # trace-level log variables; device_code is masked and never printed.
          echo "alias: $TENANT_USER"
          echo "Open this URL on your phone to approve: $VERIFY_URI"
          echo "$NEW_TAB_HINT"
          echo "Code: $USER_CODE"
          echo "action: $MODE"
          echo "commit: $HEAD_SHA ($SHORT)"
          echo "review (diff vs main, last-approved pin pending): $REVIEW_LINK"
          echo "$ANTI_PHISH"
          # Live card: this step does not end until the poll does, so the live
          # log is the immediate channel; the summary below renders at step
          # end (post-run record); ntfy (when configured) is the live push
          # channel, and the operator tooling reads the live run-page log
          # through the verification browser (see tools/verification-browser/).
          {
            echo "### 📲 Approve at netcup (code expires in ~10 min)"
            echo ""
            echo "[👉 TAP TO APPROVE]($VERIFY_URI)"
            echo ""
            echo "_${NEW_TAB_HINT}_"
            echo ""
            echo "Code: \`$USER_CODE\` (already filled if you tapped the link)"
            echo ""
            echo "action: $MODE"
            echo "commit: \`$SHORT\` (\`$HEAD_SHA\`)"
            echo "review (diff vs main, last-approved pin pending): $REVIEW_LINK"
            echo ""
            echo "alias: $TENANT_USER — approving lets this run touch your netcup account ONCE; the token dies with the runner."
            echo "$ANTI_PHISH"
          } >> "$GITHUB_STEP_SUMMARY"
          # Live push (the true phone channel): ntfy carries the approval
          # surface out-of-band the moment the code exists. Unset topic =
          # live log + summary only.
          if [ -n "$NTFY_TOPIC" ]; then
            # Empty token = no header at all (ntfy.sh 401s on an empty Basic).
            NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
            curl -sS --fail "${NTFY_AUTH[@]}" -d "piercloud: approve $TENANT_USER: $VERIFY_URI code $USER_CODE (expires 10 min) action=$MODE commit=$SHORT review=$REVIEW_LINK. $NEW_TAB_HINT $ANTI_PHISH" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          fi
          # Post-step machine-readable channel: the check-run notice
          # annotation becomes readable only after this step ends (observed
          # live: annotations_count stayed 0 for the whole approval wait), so
          # it is a transcript/audit aid, not a live source. Carries the
          # verification URL only (user_code is public by design).
          echo "::notice title=PierCloud device approval::$VERIFY_URI"
          # C-c: honor interval/slow_down; self-stop ~570s with a clean
          # re-dispatch message (device codes live ~600s).
          DEADLINE=$((SECONDS + 570))
          DELAY="$INTERVAL"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep "$DELAY"
            # C2: the poll payload carries the masked device_code — keep the
            # response out of logs (it may echo the code back on errors).
            POLL="$(curl -sS -X POST "$TOKEN_ENDPOINT" --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:device_code" --data-urlencode "client_id=scp" --data-urlencode "device_code=$DEVICE_CODE")" # C2: masked value, never printed
            STATUS="$(echo "$POLL" | jq -r '.error // "ok"')"
            case "$STATUS" in
              ok)
                ACCESS_TOKEN="$(echo "$POLL" | jq -r '.access_token // empty')"
                if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
                  echo "::error::token response carried no access_token — refusing to hand off an empty credential (fail closed; a downstream 401 would hide this)."
                  exit 1
                fi
                guard_line "access_token" "$ACCESS_TOKEN"
                echo "::add-mask::$ACCESS_TOKEN"
                echo "authorized=true" >> "$GITHUB_OUTPUT"
                # M2 same-job handoff: the ACCESS token persists ONLY in this
                # runner's local GITHUB_ENV handoff (dies with the runner);
                # the REFRESH token gets its own 0600 file below — it must
                # not sit in the job env. Same-job steps below consume both;
                # neither crosses jobs, neither lands in state (C-d: TF 1.11
                # ephemerals carry the access token).
                echo "NETCUP_SCP_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
                # ~5-min access-token TTL vs multi-minute runs (live
                # 2026-09-11: the async apply outlived the token, every tail
                # step 401'd and the A1 window policy leaked). offline_access
                # was already requested at approval — hand the refresh token
                # to the script's REST helper (scp_token_refresh), which
                # re-mints ONCE on a 401 and replays the request. Same-runner
                # handoff, dies with the runner (C-d trust model unchanged).
                REFRESH_TOKEN="$(echo "$POLL" | jq -r '.refresh_token // empty')"
                if [ -n "$REFRESH_TOKEN" ]; then
                  guard_line "refresh_token" "$REFRESH_TOKEN"
                  # Discovery-derived: guard again at the write (defense in depth).
                  guard_line "token_endpoint" "$TOKEN_ENDPOINT"
                  echo "::add-mask::$REFRESH_TOKEN"
                  # Refresh-token handoff: a 0600 runner-local FILE, NOT
                  # $GITHUB_ENV. Only the PATH is exported, so the ~30-day
                  # credential never enters the job environment where every
                  # later step — including the community tofu provider pulled
                  # by `tofu init` — could read it (review security MEDIUM).
                  # scp_token_refresh reads and rewrites this file for the
                  # current value and every rotation.
                  REFRESH_TOKEN_FILE="$RUNNER_TEMP/scp-refresh-${GITHUB_RUN_ID}.token"
                  if ! (umask 077; printf '%s' "$REFRESH_TOKEN" > "$REFRESH_TOKEN_FILE"); then
                    echo "::error::could not write the refresh-token handoff file $REFRESH_TOKEN_FILE — aborting (no handoff is safer than an env leak)."
                    exit 1
                  fi
                  echo "NETCUP_SCP_REFRESH_TOKEN_FILE=$REFRESH_TOKEN_FILE" >> "$GITHUB_ENV"
                  echo "NETCUP_SCP_TOKEN_ENDPOINT=$TOKEN_ENDPOINT" >> "$GITHUB_ENV"
                  echo "::notice::refresh token captured to the runner-local file handoff — long runs survive the ~5 min access-token TTL."
                else
                  echo "::warning::no refresh_token in the token response — runs longer than ~5 min will 401 at the tail (fail-loud, no fallback)."
                fi
                # C-d: the refresh token stays in its 0600 runner-local FILE
                # (the script re-reads it across subshells and rewrites it on
                # every rotation); TF 1.11 ephemerals carry the access token —
                # the refresh credential never enters the job env nor state.
                echo "Approved. Token held on this runner only (local handoff file)."
                echo "::notice::netcup approval received for $TENANT_USER — token in the runner-local handoff, provisioning continues."
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "✅ Approved — provisioning continues." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              authorization_pending)
                ;;
              slow_down)
                DELAY=$((DELAY + 5)) # C-c: cumulative +5s backoff
                ;;
              expired_token)
                echo "❌ Code expired — re-dispatch the workflow for a fresh code (clean re-dispatch path)." >> "$GITHUB_STEP_SUMMARY"
                echo "::error::device code expired before approval. Re-dispatch the workflow for a fresh code (clean re-dispatch path)."
                exit 1
                ;;
              access_denied)
                echo "❌ Approval denied — nothing runs." >> "$GITHUB_STEP_SUMMARY"
                echo "::error::approval denied at netcup. STOP — nothing runs. Escalate to the operator if unexpected."
                exit 1
                ;;
              *)
                echo "::error::unexpected token response ($STATUS). STOP — escalate. No fallback of any kind exists (C-A)."
                exit 1
                ;;
            esac
          done
          echo "::error::approval window (~570s) elapsed without approval. Re-dispatch the workflow for a fresh code."
          exit 1
          # M2: same-job handoff implemented above (token -> GITHUB_ENV);
          # the A1 + tofu steps below consume it on this same runner.

      - name: Resolve server + approver guard + zero-IP discovery
        id: resolve
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          ANCHOR_IPV4: ${{ secrets.ANCHOR_IPV4 }}
          SCP_USER_ID_IN: ${{ secrets.SCP_USER_ID }}
          CUSTOMER_NUMBER: ${{ inputs.tenant != '' && secrets.TENANT_CUSTOMER_NUMBER || inputs.tenant == '' && secrets.CUSTOMER_NUMBER || '' }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          ANCHOR_ROLE: ${{ vars.ANCHOR_ROLE }}
        run: |
          set -euo pipefail
          # Handoff-write guard (review security): every API-derived value
          # below reaches $GITHUB_ENV/$GITHUB_OUTPUT; reject newline/CR and
          # non-printable characters so a crafted response cannot forge extra
          # env lines (e.g. redirecting NETCUP_API_BASE with the token).
          guard_line() { # $1 label, $2 API-derived value
            case "$2" in *[$'\n\r']*) echo "::error::$1 contains a newline/CR — refusing the handoff write (injection guard)."; exit 1 ;; esac
            if [ -n "$(printf '%s' "$2" | LC_ALL=C tr -d '[:print:]')" ]; then echo "::error::$1 contains non-printable characters — refusing the handoff write (injection guard)."; exit 1; fi
          }
          # ::add-mask:: data is a runner workflow command: the runner
          # unescapes %0D/%0A/%25 in command data, so a value containing a
          # literal '%' (e.g. a free-form order name) would register a
          # DIFFERENT string as the mask and the real literal would never be
          # redacted. guard_line already rejects CR/LF, so escaping '%'
          # first is sufficient. Used for the free-form provider reads
          # (order name, old hostname); the digits/hex identifiers cannot
          # carry a '%' and stay plain.
          mask_escaped() { printf '::add-mask::%s\n' "${1//'%'/'%25'}"; }
          # Mask-at-first-receipt for the server id (issue #121): validate
          # the shape, then mask BEFORE the value can reach any echo. Call
          # it immediately after each non-empty assignment site below; an
          # empty value returns early (nothing to mask) and falls through
          # to the pasted-IP fallback exactly as before.
          mask_server_id() { # $1 = server id
            [ -n "$1" ] || return 0
            guard_line "SERVER_ID" "$1"
            case "$1" in '' | *[!0-9]*) echo "::error::resolved server id is not all-digits — refusing to use it (injection guard)."; exit 1 ;; esac
            echo "::add-mask::$1"
          }
          # The numeric server id is the stable key (module adopt) but it
          # appears in no email — so the run resolves it itself. It is also
          # the alias → netcup-account join key: mask it at first receipt
          # (mask_server_id below) and never log it; once masked, the
          # runner redacts every later log line.
          # Tenant identity comes from the repo, not the dispatch: TENANT_USER
          # (operator-set variable) is the username, so there is no alias
          # input to typo or squat — unset fails closed before anything runs.
          # Hostname derivation (D8: scripts/lib/naming.sh is the one
          # canonical source — the DNS stage and the on-box fallback consume
          # the same functions, so TF hostname and DNS record can never
          # diverge). D2: validate the LOWERCASED RAW username before the
          # sanitizer runs — `.pier`, `pier-` and `pier--carlo` all sanitize
          # to `pier`, so validating SAN would be fail-open. Reserved
          # prefixes (anchor/status/pcu) fail closed too. The lib returns
          # zone-less names; STATUS_HOST adds the zone here because the
          # on-box Caddy render consumes it as the dashboard FQDN.
          # (Managed-dispatch inputs are validated by the preflight step in
          # the ungated visibility-banner job; the tenant-environment binding
          # is re-checked at the top of this job. Nothing to re-check here.)
          [ -n "${TENANT_USER:-}" ] || { echo "::error::TENANT_USER repo variable is empty — set it to the tenant username (gh variable set TENANT_USER --body <you>)."; exit 1; }
          # ANCHOR_ROLE (issue #134): optional operator-plane variable (the
          # anchor's environment on a managed run, #204).
          # Empty or `tenant` = the platform row is monitor-only; `operator` =
          # it alerts (with a push topic). Anything else fails the run before
          # any netcup use; the on-box render validates again (defense in depth).
          case "${ANCHOR_ROLE:-}" in
            ''|tenant|operator) ;;
            *) echo "::error::ANCHOR_ROLE must be empty, 'tenant', or 'operator' — refusing to run."; exit 1 ;;
          esac
          . scripts/lib/naming.sh
          . .github/scripts/lib/anchor-ip.sh
          # ANCHOR_IPV4 is optional and may carry the server-ready email's
          # /prefix suffix: default it for `set -u`, strip the suffix ONCE,
          # and validate before any use below (the ?ip= fallback and the
          # membership check consume the bare value only). An explicit value
          # may SELECT among the resolved server's own addresses, never
          # override them (F2).
          ANCHOR_IPV4="${ANCHOR_IPV4:-}"
          EXPLICIT="${ANCHOR_IPV4%%/*}"
          if [ -n "$ANCHOR_IPV4" ] && ! is_bare_ipv4 "$EXPLICIT"; then
            echo "::error::ANCHOR_IPV4 is not a bare IPv4 after stripping any /suffix. Paste the IP from the server-ready email."
            exit 1
          fi
          RAW="$(printf '%s' "$TENANT_USER" | tr '[:upper:]' '[:lower:]')"
          validate_tenant_username "$RAW"
          SAN="$(sanitize_tenant "$RAW")"
          [ -n "$SAN" ] || { echo "::error::TENANT_USER sanitizes to empty — set a username with letters/digits."; exit 1; }
          HOSTNAME="$(derive_anchor_hostname "$SAN")"
          STATUS_HOST="$(derive_status_host "$SAN").piercloud.net"
          # Vendor variables are trusted less than they look: a newline in a
          # variable survives the sanitize sed (line-oriented) and would
          # forge an extra $GITHUB_ENV line. Reject before the write.
          guard_line "ANCHOR_HOSTNAME" "$HOSTNAME"
          echo "ANCHOR_HOSTNAME=$HOSTNAME" >> "$GITHUB_ENV"
          guard_line "STATUS_HOST" "$STATUS_HOST"
          echo "STATUS_HOST=$STATUS_HOST" >> "$GITHUB_ENV"
          guard_line "anchor_hostname" "$HOSTNAME"
          echo "anchor_hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
          # The resolved tenant alias travels as an output: post-gate jobs
          # (thumbprint, mode markers) must not re-read the TENANT_USER repo
          # variable, which resolves REPO-level in a job that does not select
          # the tenant environment (a managed dispatch would mislabel its
          # artifact with the operator's alias).
          guard_line "tenant_user" "$TENANT_USER"
          echo "tenant_user=$TENANT_USER" >> "$GITHUB_OUTPUT"
          echo "Derived hostname $HOSTNAME (dashboard $STATUS_HOST)."
          # SCP user id: NEVER the customer number (live 403 proved they
          # differ). Resolved from the token itself via OIDC userinfo
          # (same source shipping CLIs use: userinfo "id" is the numeric
          # SCP id); explicit SCP_USER_ID secret wins when set.
          if [ -n "${SCP_USER_ID_IN:-}" ]; then
            SCP_EFF="$SCP_USER_ID_IN"
          else
            SCP_EFF="$(curl -sS 'https://www.servercontrolpanel.de/realms/scp/protocol/openid-connect/userinfo' \
              -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" | jq -r '.id // empty')"
            [ -n "$SCP_EFF" ] || { echo "::error::userinfo returned no numeric id — token scope may lack openid, or the grant changed. Escalate, no fallback."; exit 1; }
          fi
          # Parse-time validation BEFORE any print (review security): the
          # userinfo id is interpolated into API paths, TF variables and
          # policy-import HCL — it must be all-digits before it goes
          # anywhere. Fail closed; then mask at first receipt (the id is an
          # account identifier, never log text).
          case "$SCP_EFF" in '' | *[!0-9]*) echo "::error::resolved SCP user id is not all-digits — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "SCP_USER_ID_EFF" "$SCP_EFF"
          echo "::add-mask::$SCP_EFF"
          echo "SCP user id resolved (explicit secret when set, else the token userinfo) — masked."
          echo "SCP_USER_ID_EFF=$SCP_EFF" >> "$GITHUB_ENV"
          # Approver guard (issue #50): the device approval the tenant
          # already tapped is the ONLY authorization moment — prove it came
          # from the tenant's own account before anything mutates. The
          # customer number IS the SCP username, so the approver's user
          # record must carry it. Wrong-account approval aborts LOUD here.
          [ -n "${CUSTOMER_NUMBER:-}" ] || { echo "::error::CUSTOMER_NUMBER secret is empty — it is the one required secret (paste the customer number from either account email)."; exit 1; }
          API_USER="$(curl -sS "https://www.servercontrolpanel.de/scp-core/api/v1/users/$SCP_EFF" \
            -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" | jq -r '.username // empty')"
          [ -n "$API_USER" ] || { echo "::error::could not read the approver's user record — token scope may have changed. Escalate, no fallback."; exit 1; }
          # Mask at first receipt, before the compare and before any print:
          # the approver's username IS the customer number. The wrong-account
          # verdict below must carry no value.
          guard_line "API_USER" "$API_USER"
          echo "::add-mask::$API_USER"
          if [ "$API_USER" != "$CUSTOMER_NUMBER" ]; then
            echo "::error::WRONG-ACCOUNT APPROVAL: this run was approved from a different netcup account than the target environment expects (TENANT_CUSTOMER_NUMBER on a managed run, the repo-level CUSTOMER_NUMBER on the operator run). STOP — nothing runs. Re-dispatch and approve from the account that owns the anchor."
            exit 1
          fi
          echo "Approver guard ok: the approval came from the tenant's own account."
          # Zero-IP discovery (issue #50): the approver's server list picks
          # the anchor — no pasted IP needed. Ranking: exactly-one
          # (convention-free) > exact hostname (deterministic) > pasted IP
          # (today's fallback). NEVER most-recent (no creationTime in the
          # list, race-prone), NEVER state-filtered (the anchor may be
          # stopped). Stopped servers still list — do not filter them out.
          # Base without the versioned tail (keep every request path fully
          # qualified below so the CI endpoint allowlist keeps matching).
          SCP="https://www.servercontrolpanel.de/scp-core"
          fetch_list() { curl -sS "$SCP/api/v1/servers" -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN"; }
          list_count() { printf '%s' "$1" | jq -r 'if type == "array" then length else -1 end' 2>/dev/null || printf '%s' "-1"; }
          LIST="$(fetch_list)"
          COUNT="$(list_count "$LIST")"
          if [ "$COUNT" -eq 0 ]; then
            echo "Server list empty — a fresh order may still be propagating; polling with backoff."
            for i in 1 2 3 4 5 6; do
              sleep 10
              LIST="$(fetch_list)"
              COUNT="$(list_count "$LIST")"
              if [ "$COUNT" -gt 0 ]; then break; fi
              echo "Still empty (attempt $i/6)..."
            done
          fi
          # Negative COUNT with an explicit value flows past ranking into
          # the ?ip= branch below (same API, independent shape); without
          # one there is nothing to fall back to — fail closed.
          if [ "$COUNT" -lt 0 ] && [ -z "$EXPLICIT" ]; then
            echo "::error::server list came back in an unexpected shape — escalate, no fallback."
            exit 1
          fi
          RESOLVED_ID=""
          if [ "$COUNT" -eq 1 ]; then
            RESOLVED_ID="$(printf '%s' "$LIST" | jq -r '.[0].id // empty')"
            mask_server_id "$RESOLVED_ID"
            echo "Discovery: exactly one server in the account — adopting it (convention-free)."
          elif [ "$COUNT" -gt 1 ]; then
            MATCHES="$(printf '%s' "$LIST" | jq -r --arg h "$HOSTNAME" '[.[] | select(.hostname == $h) | .id]')"
            if [ "$(printf '%s' "$MATCHES" | jq 'length')" -eq 1 ]; then
              RESOLVED_ID="$(printf '%s' "$MATCHES" | jq -r '.[0]')"
              mask_server_id "$RESOLVED_ID"
              echo "Discovery: $COUNT servers, exactly one named $HOSTNAME — adopting it."
            fi
          fi
          if [ -z "$RESOLVED_ID" ]; then
            if [ -n "$EXPLICIT" ]; then
              # Fallback: the explicit value resolves via ?ip= (exact-one,
              # fail closed). It selects a server here; the final target
              # still has to be one of that server's own addresses
              # (resolve_anchor_ipv4 below).
              RESP="$(curl -sS -G "$SCP/api/v1/servers" --data-urlencode "ip=$EXPLICIT" \
                -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN")"
              IP_COUNT="$(printf '%s' "$RESP" | jq -r 'if type == "array" then length else -1 end' 2>/dev/null || printf '%s' "-1")"
              RESOLVED_ID="$(printf '%s' "$RESP" | jq -r 'if type == "array" and length == 1 then .[0].id // empty else empty end')"
              if [ "$IP_COUNT" != "1" ] || [ -z "$RESOLVED_ID" ]; then
                echo "::error::anchor IP matched $IP_COUNT servers (need exactly 1). Check ANCHOR_IPV4, or rename duplicates in the SCP. Full list shape unexpected — escalate, no fallback."
                exit 1
              fi
              mask_server_id "$RESOLVED_ID"
              echo "Discovery fell back to the explicit ANCHOR_IPV4 value: adopting the matched server."
            else
              echo "::error::expected 1 server, found $COUNT — and none is named $HOSTNAME. Rename the anchor to $HOSTNAME, or set the ANCHOR_IPV4 secret to the anchor IP, then re-dispatch."
              exit 1
            fi
          fi
          # Parse-time validation (review security): the discovered server id
          # is interpolated into API paths and the generated import HCL — it
          # must be all-digits before it goes anywhere. Fail closed. (The
          # per-site mask_server_id calls above already masked it, so this
          # check is defense-in-depth.)
          case "$RESOLVED_ID" in '' | *[!0-9]*) echo "::error::resolved server id is not all-digits — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "SERVER_ID" "$RESOLVED_ID"
          echo "SERVER_ID=$RESOLVED_ID" >> "$GITHUB_ENV"
          # Server detail (read-only, UNCONDITIONAL — the pasted-IP path
          # included): the order name, the pre-change hostname and the IPv4
          # all come from provider reads that tofu plan prints; mask the
          # identifiers at first receipt so no later log line can leak
          # them. The order name must be maskable: an absent one fails
          # closed here rather than reaching the plan unmasked.
          DETAIL="$(curl -sS "$SCP/api/v1/servers/$RESOLVED_ID" -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN")"
          ORDER_NAME="$(printf '%s' "$DETAIL" | jq -r '.name // empty')"
          [ -n "$ORDER_NAME" ] || { echo "::error::could not read the server's order name — refusing to plan without masking the order name (fail closed, no fallback)."; exit 1; }
          guard_line "ORDER_NAME" "$ORDER_NAME"
          mask_escaped "$ORDER_NAME"
          OLD_HOSTNAME="$(printf '%s' "$DETAIL" | jq -r '.hostname // empty')"
          if [ -n "$OLD_HOSTNAME" ] && [ "$OLD_HOSTNAME" != "$HOSTNAME" ]; then
            guard_line "OLD_HOSTNAME" "$OLD_HOSTNAME"
            mask_escaped "$OLD_HOSTNAME"
          fi
          # SSH/DNS target is API-derived, ALWAYS (F2): the resolved
          # server's own addresses (GET /servers/{id} detail) are the only
          # candidates. ANCHOR_IPV4 may select one of them, never override;
          # a non-matching value fails closed. Several addresses with no
          # explicit pick fail loud with the address count (P4); address
          # values stay out of the public log (exposure audit §4.3).
          if ! HOST4="$(resolve_anchor_ipv4 "$DETAIL" "$EXPLICIT" "$HOSTNAME")"; then
            exit 1
          fi
          # Parse-time validation (review security): the SSH/DNS target must
          # be a bare IPv4 (the resolve_anchor_ipv4 output) — it is
          # interpolated into runner shell and $GITHUB_OUTPUT. Fail closed.
          case "$HOST4" in '' | *[!0-9.]*) echo "::error::anchor host is not a bare IPv4 — refusing to use it (injection guard)."; exit 1 ;; esac
          guard_line "ANCHOR_HOST" "$HOST4"
          echo "ANCHOR_HOST=$HOST4" >> "$GITHUB_ENV"
          echo "anchor_ipv4=$HOST4" >> "$GITHUB_OUTPUT"
          echo "Server adopted and anchor host resolved (ssh/dns target set; identifiers masked)."

      # Broker report (pc-control #123, M1 broker leg (b) b2): push the
      # API-resolved IPv4 to the registry, where the broker cross-checks DNS A
      # writes against it (b3) and the console reads it as the anchor address.
      # Managed runs only — the shared `anchor` environment is not a registry
      # tenant, and manual/template runs keep the ref-less path. Fail closed:
      # a missing report leaves the registry stale, which b3 would refuse at
      # the DNS write — failing here is earlier and clearer, and this step is
      # before the A1 window, so a broker refusal wastes no destructive work.
      - name: Report the anchor IPv4 to the broker (managed runs)
        if: inputs.tenant != ''
        env:
          BROKER_URL: https://broker.piercloud.net
          ANCHOR_REF: ${{ inputs.anchor_ref }}
          ANCHOR_IPV4: ${{ steps.resolve.outputs.anchor_ipv4 }}
        run: |
          set -euo pipefail
          . .github/scripts/lib/broker-report.sh
          report_anchor_ip "$ANCHOR_REF" "$ANCHOR_IPV4"

      - name: A1 pre-sweep (surplus fail-closed, every run, all modes)
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          # Destructive sweeps only in apply mode; other modes report-only.
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # TTL tag piercloud-tmp-<run_id>, description
          # created_at=<RFC3339-UTC> purpose=A1-ssh. Classify first, then
          # retire EVERY non-own tmp (aged or leaked-fresh — the workflow
          # mutex means no foreign run can be live); only an orphan (no
          # parseable created_at) or a failed retire stays fail-closed,
          # BEFORE creating (exit 3, operator notified by the failure step
          # below).
          .github/scripts/020-provision-anchor.sh sweep-pre

      - name: Set up OpenTofu (>= 1.11 for ephemeral values)
        if: inputs.mode == 'apply'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # SHA pin of setup-opentofu v2
        with:
          tofu_version: "v1.13.2"

      - name: tofu init (stateless — local state dies with the runner)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          # NOTE (review security, corrected): the refresh token VALUE is not
          # in any tofu step's env — the community provider only gets the
          # short-lived access token. But the runner-local 0600 handoff FILE
          # PATH rides the job env (dynamic $GITHUB_ENV), and the file is
          # readable by same-user processes on this runner, so `tofu init`
          # must not be able to silently swap the provider build: the
          # committed .terraform.lock.hcl + `-lockfile=readonly` below pin
          # and verify the exact provider binaries (N3). A provider-side 401
          # fails loud rather than refreshing without persisting the
          # rotation. Scope: the lock pins the exact build + hashes and fails
          # closed on a mismatch; it is NOT a defense against a malicious
          # upstream release, and the 0600 handoff file stays readable by
          # same-UID processes on this runner (both accepted, disclosed
          # limits).
          TF_IN_AUTOMATION: "true"
        run: |
          set -euo pipefail
          # No backend block: local state file on the ephemeral runner.
          # Nothing persists past this run by construction.
          # -lockfile=readonly (security N3): the provider lock is committed,
          # so a version/hash mismatch fails loudly here instead of silently
          # re-resolving the community provider mid-run.
          tofu init -input=false -lockfile=readonly

      - name: Patched netcup provider (TEMPORARY — issue #218, upstream PR #47)
        if: inputs.mode == 'apply'
        env:
          # Pinned, checksummed build of the community provider with the
          # empty-array-as-map tolerance (upstream issue #46 / PR #47). The
          # registry build cannot read `ipv6addresses[*].rdns` when netcup
          # answers `[]`, which aborts every plan; `load_rdns = false` does not
          # suppress the field.
          #
          # Scope: this is a STOPGAP, not a fork in the supply chain. It is
          # installed only for plan/apply on this job (dev_overrides) and never
          # for `tofu init` — though measured on OpenTofu 1.12.2, init still
          # verifies the lock even with the override present, so that ordering
          # is belt-and-braces, not the lock's guarantee. Remove this step and
          # bump the `~> 1.2` pin once upstream releases the fix.
          #
          # DISCLOSED LIMIT (review red-team F3): `dev_overrides` BYPASSES the
          # lock file, so plan/apply executes a binary the committed
          # `.terraform.lock.hcl` does NOT cover — for those steps the lock's
          # guarantee is gone. This binary's integrity rests on exactly two
          # things: the sha256 pin below, and its provenance. It also inherits
          # this job's `NETCUP_SCP_ACCESS_TOKEN` / `NETCUP_SCP_REFRESH_TOKEN_FILE`
          # (exported earlier via $GITHUB_ENV), i.e. it runs with the tenant's
          # plan/apply credential — the same privilege the registry build has
          # at that point, but no longer a build the lock vouches for.
          #
          # PROVENANCE (verify these two commands; the harness pins the triple
          # tag+commit+digest as one record, so a bump cannot update half):
          #   gh api repos/piercloud-net/terraform-provider-netcup/compare/v1.2.1...v1.2.1-patch.2
          #     -> ahead_by=1, files: json_to_tf.go + json_to_tf_test.go
          #   go version -m <the downloaded binary> | grep vcs.revision
          #     -> vcs.revision=2254e9bea19e52ed114e0c2c814767c669d93307 (vcs.modified=false)
          # i.e. the tag sits on `v1.2.1` + one fix commit, and the binary names
          # that same commit. Removal order (#218): delete THIS STEP first, then
          # the release, then the fork branch — never the release first, or every
          # apply fails closed at the download.
          PROVIDER_URL: https://github.com/piercloud-net/terraform-provider-netcup/releases/download/v1.2.1-patch.2/terraform-provider-netcup_v1.2.1-patch.2_linux_amd64 # rationale: pinned patched provider build for issue #218 (host is on the endpoint allowlist since #221); upstream PR #47 pending
          PROVIDER_SHA256: b8d3e7ffff2ed01a27ddf9dcc141ca6641e0d79615527dd0aa0977668085bb19
        run: |
          set -euo pipefail
          # No token is read here; nothing is printed but the digest check.
          bin_dir="$RUNNER_TEMP/pc-provider"
          # Empty the directory first: `tofu plan` executes whatever sits in
          # there, so nothing written by an earlier or later step may survive
          # next to the verified binary (review red-team F4).
          rm -rf "$bin_dir"
          mkdir -p "$bin_dir"
          out="$bin_dir/terraform-provider-netcup_v1.2.1-patch.2"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 120 -o "$out" "$PROVIDER_URL"
          printf '%s  %s\n' "$PROVIDER_SHA256" "$out" | sha256sum -c - >/dev/null
          chmod 0755 "$out"
          # dev_overrides only affects plan/apply; `tofu init` above ran without
          # this file (see the ordering note in the comment block).
          rc="$RUNNER_TEMP/tofurc"
          printf 'provider_installation {\n  dev_overrides {\n    "registry.opentofu.org/rixlhq/netcup" = "%s"\n  }\n  direct {}\n}\n' "$bin_dir" > "$rc"
          chmod 0600 "$rc"
          echo "TF_CLI_CONFIG_FILE=$rc" >> "$GITHUB_ENV"
          echo "patched netcup provider staged (sha256 verified); dev_overrides active for plan/apply"

      - name: Stateless import (re-adopt, import-apply-discard)
        if: inputs.mode == 'apply'
        env:
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          ANCHOR_HOSTNAME: ${{ env.ANCHOR_HOSTNAME }}
        run: |
          set -euo pipefail
          # Injection guards (defense in depth; parse-time validation lands in
          # the resolve step): these values are interpolated into generated HCL
          # and API paths, so a malformed/crafted API response must never reach
          # them. Fail closed, never fall back.
          case "$SERVER_ID" in '' | *[!0-9]*) echo "::error::SERVER_ID is not all-digits — refusing to write an import file (injection guard)."; exit 1 ;; esac
          case "$SCP_USER_ID" in '' | *[!0-9]*) echo "::error::SCP_USER_ID is not all-digits — refusing to write an import file (injection guard)."; exit 1 ;; esac
          # Stateless re-adopt: the ephemeral runner holds no state, so every
          # apply re-imports what it must converge instead of duplicating it.
          # Generated at runtime, never committed; removed post-apply below.
          # NOT a dotfile: Terraform/OpenTofu silently IGNORE files whose names
          # start with `.` — the previous `.workflow-import.tf` was never loaded,
          # so no import ever happened and every apply created a new firewall
          # policy (proven locally: dotfile → "1 to add", renamed → "1 to import").
          cat > workflow-import.tf <<EOF
          import {
            to = netcup_scp_server.anchor[0]
            id = "$SERVER_ID"
          }
          EOF
          echo "Wrote workflow-import.tf for server $SERVER_ID."

          # Firewall policy re-adopt (cap fix, issue #101): the policy id IS
          # known pre-apply — read the ATTACHED policy off the interface; its
          # name is deterministic (module local.policy_name). Import → Read →
          # in-place PUT (provider has no ForceNew): create path only when no
          # matching policy is attached. Fail closed on ambiguity.
          SCP="${NETCUP_API_BASE:-https://www.servercontrolpanel.de/scp-core}"
          # The steady-state policy name carries the public hostname ONLY
          # (issue #121): the server id is the alias → netcup-account join
          # key and must never appear in a name that lands in public logs
          # or step summaries. The sweep in 020-provision-anchor.sh keeps a
          # one-time migration clause for the pre-change
          # piercloud-anchor-<hostname>-<id> shape, so the first
          # post-change apply retires the old unattached policy.
          POLICY_NAME="piercloud-anchor-${ANCHOR_HOSTNAME}"
          # Lexicographically smallest MAC — character-for-character the same
          # jq rule as resolve_mac() in .github/scripts/020-provision-anchor.sh
          # and main.tf local.interface_mac (`try(sort([...mac])[0], null)`,
          # "sorted for determinism"). On a >1-NIC server any other pick
          # resolves the wrong interface: the attached steady-state policy is
          # looked for (and later swept) against the wrong NIC.
          # loadRdns=false: see issue #216 — the API's reverse-DNS assembly is
          # broken upstream (a list where the provider schema expects a map, and
          # HTTP 500 with the parameter omitted). Nothing here reads rdns.
          MAC="$(curl -sS --fail-with-body -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" \
            "$SCP/api/v1/servers/${SERVER_ID}/interfaces?loadRdns=false" \
            | jq -r 'if type == "array" then . elif has("data") then .data elif has("items") then .items elif has("interfaces") then .interfaces else . end | if type == "array" then (map(.mac // empty) | sort | .[0] // empty) else (.mac // empty) end')"
          [ -n "$MAC" ] || { echo "No interface MAC resolved — refusing to guess the firewall policy" >&2; exit 1; }
          # Newline-safe (review security N2): grep is line-oriented, so a
          # value with an embedded newline matched its first line; reject
          # newline/CR explicitly before the whole-value shape check.
          case "$MAC" in '' | *[$'\n\r']*) echo "::error::resolved interface MAC contains a newline/CR — refusing to interpolate it (injection guard)."; exit 1 ;; esac
          printf '%s' "$MAC" | grep -qE '^[0-9a-fA-F:]{17}$' || { echo "::error::resolved interface MAC is not a 17-char hex/colon value — refusing to interpolate it (injection guard)."; exit 1; }
          # Mask at first receipt (after the shape check): the MAC is a
          # provider-read account identifier — the runner redacts it from
          # every later log line.
          echo "::add-mask::$MAC"
          POLICY_ID="$(curl -sS --fail-with-body -H "Authorization: Bearer $NETCUP_SCP_ACCESS_TOKEN" \
            "$SCP/api/v1/servers/${SERVER_ID}/interfaces/${MAC}/firewall" \
            | jq -r --arg n "$POLICY_NAME" '[.userPolicies[]? | select(.name == $n) | .id | tostring] | if length == 0 then "" elif length == 1 then .[0] else "AMBIGUOUS" end')"
          case "$POLICY_ID" in
            "") echo "No attached steady-state policy named $POLICY_NAME — create path (first apply)." ;;
            AMBIGUOUS)
              echo "More than one attached policy named $POLICY_NAME — refusing to guess; clean up in SCP and re-dispatch." >&2
              exit 1 ;;
            *)
              case "$POLICY_ID" in '' | *[!0-9]*) echo "::error::resolved firewall policy id is not all-digits — refusing to write the import block (injection guard)."; exit 1 ;; esac
              cat >> workflow-import.tf <<EOF
          import {
            to = netcup_scp_user_firewall_policy.tang[0]
            id = "${SCP_USER_ID}/${POLICY_ID}"
          }
          EOF
              echo "Firewall policy ${POLICY_ID} will be re-adopted (create only if absent)." ;;
          esac

      - name: tofu plan (ephemeral token, never state)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          TF_IN_AUTOMATION: "true"
          TF_VAR_hostname: ${{ env.ANCHOR_HOSTNAME }}
          TF_VAR_anchor_hostname: ${{ env.ANCHOR_HOSTNAME }}.piercloud.net
          TF_VAR_server_id: ${{ env.SERVER_ID }}
          TF_VAR_scp_user_id: ${{ env.SCP_USER_ID_EFF }}
          TF_VAR_customer_number: ${{ inputs.tenant != '' && secrets.TENANT_CUSTOMER_NUMBER || inputs.tenant == '' && secrets.CUSTOMER_NUMBER || '' }}
          TF_VAR_allow_main_box_ipv4: ${{ secrets.MAIN_BOX_IPV4 }}
        run: |
          set -euo pipefail
          # Secret values used here (environment-scoped on a managed run,
          # #204; never committed):
          # MAIN_BOX_IPV4, ANCHOR_IPV4,
          # ANCHOR_ROOT_PASSWORD (masked one-run input, dead after root lock).
          # Public inputs arrive as repo VARIABLES: TENANT_USER (hostname/DNS
          # derivation). Monitor targets + push arrive as secret values:
          # GATUS_ENDPOINTS (comma-separated name=url), NTFY_TOPIC/NTFY_TOKEN.
          # (NETCUP_SERVER_ID retired: the resolve step derives server_id
          # at runtime from ANCHOR_IPV4 — nothing numeric to copy.)
          # Public-log hygiene (issue #121): the identifier INPUTS
          # (server_id, scp_user_id, customer_number) are sensitive in the
          # module and the id outputs are sensitive too, so plan output
          # renders them as (sensitive value); provider-read identifiers
          # (order name, old hostname, MAC) were masked at first receipt in
          # the resolve/import steps, so the runner redacts those values
          # wherever the plan prints them. Never rely on TF_LOG: it is not
          # set here, and every identifier is handled by masking, not by
          # hoping the provider stays quiet.
          tofu plan -input=false -out=tfplan

      - name: tofu apply (steady-state policy, then hand off to A1 ssh)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          TF_IN_AUTOMATION: "true"
          TF_VAR_hostname: ${{ env.ANCHOR_HOSTNAME }}
          TF_VAR_anchor_hostname: ${{ env.ANCHOR_HOSTNAME }}.piercloud.net
          TF_VAR_server_id: ${{ env.SERVER_ID }}
          TF_VAR_scp_user_id: ${{ env.SCP_USER_ID_EFF }}
          TF_VAR_customer_number: ${{ inputs.tenant != '' && secrets.TENANT_CUSTOMER_NUMBER || inputs.tenant == '' && secrets.CUSTOMER_NUMBER || '' }}
          TF_VAR_allow_main_box_ipv4: ${{ secrets.MAIN_BOX_IPV4 }}
        run: |
          set -euo pipefail
          # ORDER IS LOAD-BEARING (live 2026-09-08): steady state MUST land
          # BEFORE the A1 window opens. Opening first then applying made the
          # interface-firewall resource rewrite user_policy_ids=[tang] and
          # DETACH the runner's /32 window, so the ssh handoff timed out.
          tofu apply -input=false -auto-approve tfplan
          # Import-apply-discard: the generated import served its one run.
          rm -f workflow-import.tf

      - name: A1 open (TTL-tagged single-/32 window, after steady state)
        id: a1-open
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Dual-endpoint egress-IP pin (exact match or fail) + idempotent
          # create on run_id + attach — all under the account lane
          # (concurrency.group: one writer per netcup account).
          .github/scripts/020-provision-anchor.sh open

      - name: Passwordless bootstrap (caller-set one-time root password)
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          ROOT_PASSWORD_SECRET: ${{ secrets.ANCHOR_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          # Pasted secret present -> the script skips minting (legacy path:
          # same SSH, same thumbprint, same lock as today). Empty -> mint a
          # caller-set password, ensure the box is RUNNING (live 2026-09-10
          # #68: the set is guest-agent-based and completes only on a
          # running VM — the stale vendor docs' OFF step is gone, so no
          # power cycle and no downtime), wait for the agent to report
          # available, set it, then SSH-wait — exporting the masked value
          # right after the set, before the SSH-wait, for the provision
          # step below (same-runner handoff, dies with the runner).
          # Concurrent runs serialize on 409 lock-backoff. Sits AFTER the
          # A1 open step by design (live #59): the closing SSH-wait needs
          # the runner /32 :22 window — steady-state firewall admits
          # 80/443 only, so probing earlier hangs on dropped SYNs with
          # zero output. After tofu apply per #41 (apply rewrites the
          # interface policy and would detach an earlier window). Still
          # behind the red-banner gate (destructive ops need a reviewed
          # tree).
          .github/scripts/020-provision-anchor.sh bootstrap-password

      - name: A1 provision (plain ssh, thumbprint, root lock)
        id: a1-provision
        if: inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          PINNED_IP: ${{ steps.a1-open.outputs.pinned_ip }}
          ROOT_PASSWORD: ${{ secrets.ANCHOR_ROOT_PASSWORD }}
          BOOTSTRAP_ROOT_PASSWORD: ${{ env.BOOTSTRAP_ROOT_PASSWORD }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          ANCHOR_ROLE: ${{ vars.ANCHOR_ROLE }}
          # STATUS_PULLER (issue #186): VARIABLE (the anchor's environment on
          # a managed run, #204), unset = legacy shape
          # (platform/main + GATUS_ENDPOINTS in config.yaml). On a
          # slice-managed anchor set it and the on-box render drops the pairs
          # with a loud dispatch-time log (D10); they move to the manifest.
          # GATUS_ENDPOINTS is read in that same run whenever the switch is
          # unset: it lives on the anchor's environment too, never at
          # repository level (the banner refuses a managed dispatch then).
          STATUS_PULLER: ${{ vars.STATUS_PULLER }}
          GATUS_ENDPOINTS: ${{ secrets.GATUS_ENDPOINTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Operator-plane dashboard-TLS material (set at template time — the
          # tenant pastes nothing, bootstrap stays 1 secret): the per-anchor
          # Origin CA certificate chain (leaf-first) arrives via the cert-only
          # VARIABLE (the anchor's environment on a managed run; public
          # material — never key material; the key is generated on
          # the box); CF_AOP_CA_PEM stays the legacy zone-AOP client-auth
          # bundle (secret; A2 retires it — expected unset post-cutover).
          # Deployed material for Caddy's :443, NOT a standing API token.
          ORIGIN_CA_CERT_PEM: ${{ vars.ORIGIN_CA_CERT_PEM }}
          CF_AOP_CA_PEM: ${{ secrets.CF_AOP_CA_PEM }}
          # Origin admission (#202): the shared CloudFront origin header is
          # retired and is no longer passed to the box. The firewall admits the
          # CloudFront origin-facing ranges + the main box; the origin client
          # certificate (committed public CA, scripts/origin-mtls-ca.pem) is the
          # authentication. MAIN_BOX_IPV4 is the Caddy main-box peer address
          # (already a secret for the firewall); it is required for the :443
          # render (fail-closed).
          MAIN_BOX_IPV4: ${{ secrets.MAIN_BOX_IPV4 }}
          # Optional recording-completeness witness (docs/recording-witness.md):
          # KEY is a B2 listFiles application key — the
          # witness lists metadata and never reads object content. All six
          # set = the witness installs; empty = the component stays dormant
          # (tenant anchors are unaffected; a previous install is removed).
          RECORDING_WITNESS_ENDPOINT: ${{ secrets.RECORDING_WITNESS_ENDPOINT }}
          RECORDING_WITNESS_BUCKET: ${{ secrets.RECORDING_WITNESS_BUCKET }}
          RECORDING_WITNESS_AUDIT_PREFIX: ${{ secrets.RECORDING_WITNESS_AUDIT_PREFIX }}
          RECORDING_WITNESS_RECORDINGS_PREFIX: ${{ secrets.RECORDING_WITNESS_RECORDINGS_PREFIX }}
          RECORDING_WITNESS_KEY_ID: ${{ secrets.RECORDING_WITNESS_KEY_ID }}
          RECORDING_WITNESS_KEY: ${{ secrets.RECORDING_WITNESS_KEY }}
          # Optional notification cadence (public repo VARIABLES, not secret values;
          # empty = the witness defaults): renotify default 1800s,
          # quiet_renotify default 86400s. quiet_signature pins the current
          # finding set (stable identities, no ages) to the quiet cadence; the
          # run-once acceptance prints the value to pin. One signature, or a
          # comma-separated list (max 16) for a known set that flaps between
          # shapes: a flip between two pinned shapes stays quiet, a shape
          # outside the list pushes immediately.
          RECORDING_WITNESS_RENOTIFY_SECONDS: ${{ vars.RECORDING_WITNESS_RENOTIFY_SECONDS }}
          RECORDING_WITNESS_QUIET_RENOTIFY_SECONDS: ${{ vars.RECORDING_WITNESS_QUIET_RENOTIFY_SECONDS }}
          RECORDING_WITNESS_QUIET_SIGNATURE: ${{ vars.RECORDING_WITNESS_QUIET_SIGNATURE }}
          # The acknowledged identity set (#223): the exact finding identities the
          # operator has seen (the acceptance prints `witness ack identities:`).
          # A new identity still pushes immediately; a set-shape change does not.
          # Takes precedence over RECORDING_WITNESS_QUIET_SIGNATURE when both are set.
          RECORDING_WITNESS_ACK_IDENTITIES: ${{ vars.RECORDING_WITNESS_ACK_IDENTITIES }}
          RECORDING_WITNESS_COLD_START_SECONDS: ${{ vars.RECORDING_WITNESS_COLD_START_SECONDS }}
          RECORDING_WITNESS_SWEEP_SECONDS: ${{ vars.RECORDING_WITNESS_SWEEP_SECONDS }}
          THUMBPRINT_FILE: thumbprint.txt
        run: |
          set -euo pipefail
          # C-a-shaped explicit mask BEFORE any use: repo-level secret values are
          # auto-masked, but the explicit mask covers every expansion path
          # (same ordering rule as the device_code mask in device-flow).
          # Guarded: masking an empty value warns without masking anything.
          if [ -n "${{ secrets.ANCHOR_ROOT_PASSWORD }}" ]; then echo "::add-mask::${{ secrets.ANCHOR_ROOT_PASSWORD }}"; fi
          # Mask FIRST, before any use (secret values are auto-masked; the
          # explicit masks cover every expansion path, multiline PEMs
          # included). Guarded: masking an empty value warns without masking.
          # ORIGIN_CA_CERT_PEM is public cert-only material (variable) —
          # deliberately NOT masked.
          if [ -n "${{ secrets.CF_AOP_CA_PEM }}" ]; then echo "::add-mask::${{ secrets.CF_AOP_CA_PEM }}"; fi
          # The main-box address is masked at first receipt (it already is for
          # the terraform var path; the explicit mask covers every expansion path).
          if [ -n "${{ secrets.MAIN_BOX_IPV4 }}" ]; then echo "::add-mask::${{ secrets.MAIN_BOX_IPV4 }}"; fi
          # Recording-witness values: masked at first receipt before any use
          # (secret values are auto-masked; the explicit masks cover every
          # expansion path). Never echoed, never logged, never in argv.
          for witness_value in \
            "${{ secrets.RECORDING_WITNESS_ENDPOINT }}" \
            "${{ secrets.RECORDING_WITNESS_BUCKET }}" \
            "${{ secrets.RECORDING_WITNESS_AUDIT_PREFIX }}" \
            "${{ secrets.RECORDING_WITNESS_RECORDINGS_PREFIX }}" \
            "${{ secrets.RECORDING_WITNESS_KEY_ID }}" \
            "${{ secrets.RECORDING_WITNESS_KEY }}"; do
            if [ -n "$witness_value" ]; then echo "::add-mask::$witness_value"; fi
          done
          # Pre-SSH IP re-fetch (mismatch aborts to sweep inside the script);
          # the one-run credential (pasted secret, or the caller-set value
          # minted by bootstrap-password) arrives masked and is never
          # printed; the script ends with `passwd -l root`.
          ARGS=""
          if [ "${{ inputs.rotate_keys }}" = "true" ]; then ARGS="--rotate"; fi
          # shellcheck disable=SC2086: ARGS is empty-or-one-known-flag by construction.
          .github/scripts/020-provision-anchor.sh $ARGS provision

      - name: Upload per-anchor CSR artifact
        # always(): the CSR is most needed when a LATER step fails (the run
        # already wrote it before the probes). apply-only, like the A1 window.
        if: always() && inputs.mode == 'apply'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # SHA pin of upload-artifact v6
        with:
          name: origin-ca-csr-${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
          path: origin-ca.csr
          # 90 = the public-repo cap. Public material (a CSR carries no key):
          # the hand-off for operator-side signing; the signed cert returns
          # via the cert-only ORIGIN_CA_CERT_PEM variable (leaf-first chain).
          retention-days: 90
          if-no-files-found: warn

      - name: Best-effort root lock (passwordless finally-path)
        if: failure() && inputs.mode == 'apply'
        env:
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          ANCHOR_HOST: ${{ env.ANCHOR_HOST }}
          BOOTSTRAP_ROOT_PASSWORD: ${{ env.BOOTSTRAP_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          # A crash between password-set and the provision's `passwd -l root`
          # leaves a caller-known password live: always attempt the lock
          # here (finally-path, not happy-path). Never fails the run — the
          # original failure owns the verdict. No-ops when nothing was
          # minted (legacy path) or the box is unreachable (warns loud with
          # the SCP-reset + re-dispatch recovery).
          .github/scripts/020-provision-anchor.sh lock-password || true

      - name: A1 close (detach-then-delete, always)
        if: always() && steps.device.outputs.authorized == 'true' && inputs.mode == 'apply'
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          .github/scripts/020-provision-anchor.sh close

      - name: A1 post-sweep (always, every run, all modes)
        if: always()
        env:
          NETCUP_SCP_ACCESS_TOKEN: ${{ env.NETCUP_SCP_ACCESS_TOKEN }}
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          NETCUP_SCP_TOKEN_ENDPOINT: ${{ env.NETCUP_SCP_TOKEN_ENDPOINT }}
          SERVER_ID: ${{ env.SERVER_ID }}
          SCP_USER_ID: ${{ env.SCP_USER_ID_EFF }}
          RUN_ID: ${{ github.run_id }}
          # Destructive sweeps only in apply mode; other modes report-only.
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Sweeps this run's policy at any age + every tmp >2h + orphans.
          # No token (approval never completed) = clean no-op, so this step
          # never masks the original failure.
          .github/scripts/020-provision-anchor.sh sweep-post

      - name: Notify operator on failure (surplus/orphan hint)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TENANT_USER: ${{ inputs.tenant != '' && inputs.tenant || vars.TENANT_USER }}
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — failure stays in the run summary."
            exit 0
          fi
          MSG="piercloud A1/provision FAILED for $TENANT_USER — run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. If the log shows SURPLUS_FAIL_CLOSED, an orphan tmp policy (no parseable created_at) exists on the server or one could not be retired: clean up by hand, then re-dispatch. Nothing was created by the failed step."
          NTFY_AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-u ":$NTFY_TOKEN")
          curl -sS --fail "${NTFY_AUTH[@]}" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null

      - name: Revoke device-grant refresh token (always, every run)
        if: always()
        env:
          NETCUP_SCP_REFRESH_TOKEN_FILE: ${{ env.NETCUP_SCP_REFRESH_TOKEN_FILE }}
          # Public, constant Keycloak discovery doc (same realm for every
          # tenant) — same pattern as the merged device-flow step. The
          # revocation endpoint is read from it at runtime, so no endpoint
          # literal is hardcoded here.
          NETCUP_OIDC_DISCOVERY_URL: "https://www.servercontrolpanel.de/realms/scp/.well-known/openid-configuration"
        run: |
          set -euo pipefail
          summary() { # $1 = one-line outcome (bounded, token-free by construction)
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Device-grant revocation\n- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          bounded_detail() { # $1 = curl stderr file -> <=300 chars, one trimmed line
            head -c 300 "$1" 2>/dev/null | tr '\n\r' '  ' | tr -s ' ' | sed -e 's/^ //' -e 's/ $//'
          }
          # Refresh-token handoff is a 0600 runner-local FILE (see the poll
          # step): load it into this step's process env only — the ~30-day
          # credential never sits in the job environment.
          if [ -n "${NETCUP_SCP_REFRESH_TOKEN_FILE:-}" ]; then
            # F1 residual (review security): the path is exported ONLY when
            # the poll step received a refresh token, so an unreadable or
            # empty file is NOT "no token was issued" — the credential may be
            # live. Claiming a clean no-op here would be a false green: fail
            # the run RED.
            if [ ! -r "$NETCUP_SCP_REFRESH_TOKEN_FILE" ]; then
              echo "::error::NETCUP_SCP_REFRESH_TOKEN_FILE is set but the handoff file is missing or unreadable — the run's refresh token may still be live and cannot be revoked here. Revoke the tenant's offline session in netcup's Keycloak (SCP) admin/account UI, then investigate. No fallback exists (C-A)."
              summary "FAILED: refresh-token handoff file set but unreadable — token NOT revoked (may stay live up to Keycloak's ~30-day idle expiry)"
              exit 1
            fi
            NETCUP_SCP_REFRESH_TOKEN="$(head -c 8192 "$NETCUP_SCP_REFRESH_TOKEN_FILE" | tr -d '\r\n')"
            if [ -z "$NETCUP_SCP_REFRESH_TOKEN" ]; then
              echo "::error::the refresh-token handoff file is empty — a token was issued to this run but cannot be revoked here. Revoke the tenant's offline session in netcup's Keycloak (SCP) admin/account UI, then investigate. No fallback exists (C-A)."
              summary "FAILED: refresh-token handoff file empty — token NOT revoked (may stay live up to Keycloak's ~30-day idle expiry)"
              exit 1
            fi
          fi
          # Errexit stays ON (explicit): a teardown that cannot prove the
          # refresh credential is dead is a security failure and MUST turn the
          # run RED (review security HIGH — this reverses the earlier
          # "teardown never owns the verdict" guidance: an always() step never
          # runs when the runner dies, so a silent green teardown would let a
          # ~30-day token outlive the run while the docs claim it died). The
          # per-command || guards below cover the deliberately tolerated
          # cases; every unproven-revocation branch exits non-zero. A clean
          # no-op (no token was ever issued) stays exit 0.
          # Teardown: without this, the device grant's offline_access refresh
          # token outlives the runner by up to ~30 days (Keycloak offline
          # session idle expiry) even though the ACCESS token dies in ~5 min.
          # RFC 7009 lets a public client revoke with client_id only — no
          # secret, no Authorization header — so revocation still works now
          # that the access token is already dead.
          if [ -z "${NETCUP_SCP_REFRESH_TOKEN:-}" ]; then
            echo "No refresh token was issued to this run — nothing to revoke (clean no-op)."
            summary "no refresh token was issued to this run — nothing to revoke"
            exit 0
          fi
          # Endpoints from the OIDC discovery document; the token itself is
          # never printed (masked at birth in the poll step, passed only as
          # the POST bodies below).
          DISCO="$(curl -sS --max-time 30 "$NETCUP_OIDC_DISCOVERY_URL" 2>/dev/null)" || DISCO=""
          REVOKE_ENDPOINT="$(printf '%s' "$DISCO" | jq -r '.revocation_endpoint // empty' 2>/dev/null)" || REVOKE_ENDPOINT=""
          TOKEN_ENDPOINT="$(printf '%s' "$DISCO" | jq -r '.token_endpoint // empty' 2>/dev/null)" || TOKEN_ENDPOINT=""
          if [ -z "$REVOKE_ENDPOINT" ]; then
            echo "::error::could not resolve revocation_endpoint from the OIDC discovery document — the run's refresh token was NOT revoked and stays usable until Keycloak's offline-session idle expiry (~30 days). No fallback exists (C-A). Failing the run RED: an unproven teardown must not pass."
            summary "FAILED: revocation_endpoint missing from discovery — token NOT revoked (usable until Keycloak's idle expiry, ~30 days)"
            exit 1
          fi
          # Endpoint pin (review security MEDIUM): only the live SCP Keycloak
          # realm may receive the token; a tampered discovery document must not.
          require_scp_endpoint() { # $1 label, $2 URL
            case "$2" in
              https://www.servercontrolpanel.de/realms/scp/*) ;;
              *) echo "::error::$1 is not an https://www.servercontrolpanel.de/realms/scp/ endpoint — refusing to POST (endpoint pin)."; exit 1 ;;
            esac
          }
          require_scp_endpoint "revocation_endpoint" "$REVOKE_ENDPOINT"
          if [ -n "$TOKEN_ENDPOINT" ]; then require_scp_endpoint "token_endpoint" "$TOKEN_ENDPOINT"; fi
          # POST the refresh token (public client: client_id + token only);
          # the response body is discarded, the HTTP status and a BOUNDED
          # curl-stderr detail are kept for the warning and the step summary.
          # Token off argv (review security MEDIUM): write it to a 0600 temp
          # file (mktemp's default mode) and use curl's @file form so the
          # value never shows up in /proc/<pid>/cmdline; the EXIT trap
          # removes both temp files on every path.
          ERRFILE="$(mktemp)"
          TOKEN_FILE="$(mktemp)"
          printf '%s' "$NETCUP_SCP_REFRESH_TOKEN" > "$TOKEN_FILE"
          trap 'rm -f "$ERRFILE" "$TOKEN_FILE"' EXIT
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$REVOKE_ENDPOINT" \
            --data-urlencode "client_id=scp" \
            --data-urlencode "token_type_hint=refresh_token" \
            --data-urlencode "token@$TOKEN_FILE" 2>"$ERRFILE")" || CODE=""
          DETAIL="$(bounded_detail "$ERRFILE")"
          rm -f "$ERRFILE"
          REVOKE_OK=0
          case "$CODE" in
            200)
              REVOKE_OK=1
              REVOKE_STATE="revoked (HTTP 200)"
              echo "::notice::device-grant refresh token revoked — the run-issued credential dies with the runner in effect." ;;
            *)
              REVOKE_STATE="FAILED (HTTP ${CODE:-none}${DETAIL:+, curl: $DETAIL})"
              echo "::warning::refresh-token revocation returned HTTP ${CODE:-none}${DETAIL:+ (curl: $DETAIL)} — the canary below decides whether the credential can still be proven dead; a failed canary turns the run RED. No fallback exists (C-A)." ;;
          esac
          # Canary: prove the session actually died. A revoked refresh token
          # must be REFUSED. The live realm answers a refused refresh grant
          # with HTTP 400 + {"error":"invalid_grant","error_description":
          # "Invalid refresh token"} (reviewer-probed live 2026-09-11) — the
          # 200-with-an-error-BODY shape applies to the REVOKE endpoint, not
          # the token endpoint. ONLY invalid_grant / invalid_token prove the
          # token died; invalid_client / unauthorized_client merely say the
          # CLIENT was disabled/renamed — reporting "revocation verified" on
          # those would be a false security claim, so any other error (or an
          # unparseable/missing endpoint) stays UNVERIFIED with a warning.
          # The token and the response body are never printed — only the
          # accepted error code below. An unverified outcome is a RED run
          # (review security HIGH): the run must not stay green while the
          # docs claim the credential is dead.
          CANARY_VERIFIED=0
          if [ -n "$TOKEN_ENDPOINT" ]; then
            CERFILE="$(mktemp)"
            CANARY="$(curl -sS --max-time 30 -X POST "$TOKEN_ENDPOINT" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "client_id=scp" \
              --data-urlencode "refresh_token@$TOKEN_FILE" 2>"$CERFILE")" || CANARY=""
            CANARY_DETAIL="$(bounded_detail "$CERFILE")"
            rm -f "$CERFILE"
            CANARY_ERR="$(printf '%s' "$CANARY" | jq -r '.error // empty' 2>/dev/null)" || CANARY_ERR=""
            case "$(printf '%s' "$CANARY_ERR" | tr '[:upper:]' '[:lower:]')" in
              invalid_grant | invalid_token)
                CANARY_VERIFIED=1
                echo "::notice::revocation verified — the refresh token is dead (${CANARY_ERR})."
                if [ "$REVOKE_OK" -eq 1 ]; then
                  summary "${REVOKE_STATE}; canary rejected the token (${CANARY_ERR})"
                else
                  # Contradiction guard: the revoke POST reported a failure but
                  # the canary proves the credential is dead anyway (e.g. it
                  # was already invalidated) — report the verified outcome
                  # once, never "FAILED; verified".
                  summary "revocation verified by canary (${CANARY_ERR}); the revoke POST had reported ${REVOKE_STATE}"
                fi ;;
              "")
                echo "::error::revocation canary was NOT rejected by the token endpoint${CANARY_DETAIL:+ (curl: $CANARY_DETAIL)} — the refresh token may still be live (up to Keycloak's ~30-day offline-session idle expiry). The run stays RED; investigate the Keycloak sessions. No fallback exists (C-A). The token and response body are never printed."
                summary "${REVOKE_STATE}; CANARY NOT REJECTED — the credential may still be live (investigate the Keycloak sessions); run RED" ;;
              *)
                echo "::error::revocation canary returned '${CANARY_ERR}', which does not prove the token died (only invalid_grant/invalid_token do; invalid_client/unauthorized_client only mean the client itself was disabled or renamed). Revocation is UNVERIFIED — the refresh token may still be live. The run stays RED; investigate the Keycloak sessions. No fallback exists (C-A). The token and response body are never printed."
                summary "${REVOKE_STATE}; canary UNVERIFIED (error '${CANARY_ERR}' does not prove death) — the credential may still be live (investigate the Keycloak sessions); run RED" ;;
            esac
          else
            echo "::error::token_endpoint missing from the OIDC discovery document — revocation is unverified (cannot canary). The run stays RED; investigate the Keycloak sessions."
            summary "${REVOKE_STATE}; canary NOT RUN (token_endpoint missing) — revocation unverified; run RED"
          fi
          if [ "$CANARY_VERIFIED" -ne 1 ]; then
            exit 1
          fi
          # Best-effort cleanup (review security, hygiene): the canary just
          # proved the credential dead, so drop the 0600 handoff file now.
          # Never fatal — the run's verdict is already decided above.
          if [ -n "${NETCUP_SCP_REFRESH_TOKEN_FILE:-}" ]; then
            rm -f "$NETCUP_SCP_REFRESH_TOKEN_FILE" || true
          fi
          exit 0

  anchor-dns:
    name: "Anchor DNS upsert + verify through the pc-control broker (fail-closed)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'apply'
    # Same gate as device-flow: tenant approves DNS writes too (operator
    # token, tenant decision). Settings-side, see above. Same dynamic
    # environment selection as the device-flow job — both must resolve the
    # same tenant environment (expression kept identical on purpose).
    environment: ${{ inputs.tenant != '' && inputs.tenant || 'anchor' }}
    # OIDC: the broker mints/verifies a `piercloud-broker`-audience token
    # (pc-control b2/b3a). The device-flow job holds id-token too (the IPv4
    # report); this job is the only one with the broker's DNS-write surface,
    # and no standing DNS credential exists anymore (b3b retired it).
    permissions:
      contents: read
      id-token: write
    env:
      # The broker owns the record names (from the registry `dns_name`
      # rows) and the dashboard CNAME target (`PC_BROKER_STATUS_EDGE_DOMAIN`
      # broker config): the workflow sends only the lane ref and the
      # API-resolved IPv4, and the broker cross-checks the IPv4 against the
      # same-run report from device-flow before any provider call.
      BROKER_URL: https://broker.piercloud.net
      ANCHOR_REF: ${{ inputs.anchor_ref }}
      # Resolved target — the device-flow job's validated output, never the
      # raw secret: API-derived, and an explicit ANCHOR_IPV4 can only
      # have selected among the resolved server's own addresses (the
      # producer, resolve_anchor_ipv4, fails closed on any mismatch).
      ANCHOR_IPV4: ${{ needs.device-flow.outputs.anchor_ipv4 }}
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Managed-lane guard (b3b #189 retired the direct-token writer)
        run: |
          set -euo pipefail
          # Defense in depth: the managed-input preflight already refuses a
          # ref-less or tenant-less apply before any provisioning (the
          # broker path requires the env->tenant->lane binding (b2) and the
          # same-run anchor-IP report its A-write cross-check compares
          # against). Kept fail-closed and loud anyway so a reverted
          # preflight still cannot let a ref-less apply reach a DNS write.
          if [ -z "$ANCHOR_REF" ]; then
            echo "::error::anchor DNS now goes through the pc-control broker (b3b, #189) and requires a managed dispatch (tenant + anchor_ref); the direct provider-token writer was retired. Re-dispatch with the account's anchor_ref — refusing."
            exit 1
          fi
      - name: Upsert anchor A + dashboard CNAME through the broker
        run: |
          set -euo pipefail
          # Load-bearing order: this job needs device-flow (A1 close +
          # sweep and the same-run IPv4 report are inside it), and the
          # thumbprint job needs THIS job — a broker DNS failure fails the
          # run before any thumbprint goes out, so we never bind-by-name
          # against a record we didn't just verify. The broker authorizes
          # from the registry (no caller-supplied names), refuses a
          # mismatched/stale IPv4 (409) and verifies after write; the
          # token/body travel in 0600 curl config files, never argv.
          # Same account lane covers this job (workflow-level concurrency).
          . .github/scripts/lib/broker-dns.sh
          write_anchor_dns "$ANCHOR_REF" "$ANCHOR_IPV4"

  apply-placeholder:
    name: "mode=apply (stateless skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'apply'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Set up OpenTofu (>= 1.11 for ephemeral values)
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # SHA pin of setup-opentofu v2
        with:
          tofu_version: "v1.13.2"
      # M2: the real path (ephemeral exchange → data-source resolve →
      # plan → apply → state dies with the runner; policy name
      # piercloud-anchor-${hostname} lands fully in M3) now runs
      # in the device-flow job on the SAME runner (token never crosses
      # jobs). This job stays a mode-scope marker.
      - name: Mode marker (real steps run in the device-flow job)
        run: |
          set -euo pipefail
          echo "mode=apply for alias '${{ needs.device-flow.outputs.tenant_user }}': tofu plan/apply + A1 window + ssh provision run in the device-flow job (same-runner token handoff)."

  check-hygiene:
    name: "mode=check (drift + hygiene skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'check'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Retention-cap assertion (H1)
        run: |
          set -euo pipefail
          # The run artifact (head-sha + thumbprint) is a 90-day convenience
          # copy, never the durable record: the durable thumbprint legs are
          # the committed break-glass file (reviewable App PR) and the
          # platform registry (both pending). This step fails loudly when any
          # workflow's retention-days leaves the public-repo band, because
          # GitHub clamps an over-cap value silently at upload (false
          # durability).
          bash .github/scripts/040-retention-cap.sh
          echo "mode=check skeleton: drift report + orphan list land in M2; hygiene only, nothing to keep alive (S1)."
      - name: Versions-behind notice
        run: |
          set -euo pipefail
          echo "mode=check skeleton: versions-behind notice (Renovate queue vs pinned SHAs / .opentofu-version) lands in M2."
          # TODO(M2): compare pinned action SHAs + .opentofu-version against
          # the Renovate queue and print the behind-count (notice only).

  update-ip-placeholder:
    name: "mode=update-ip (ADD-before-move skeleton)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'update-ip'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      # Protocol (enforced in M2): ADD new source first, old kept during
      # transition, removed after confirmed boot; operator requests, OWNER
      # executes; batch = N per-tenant approvals, never one operator token.
      - name: Skeleton marker (M2 wires the real steps)
        run: |
          set -euo pipefail
          echo "mode=update-ip skeleton for alias '${{ needs.device-flow.outputs.tenant_user }}': add='${{ inputs.add_ipv4 }} ${{ inputs.add_ipv6 }}' remove='${{ inputs.remove_ipv4 }}'. ADD-before-move enforcement lands in M2."

  destroy-gate:
    name: "mode=destroy (policy + attachment ONLY)"
    runs-on: ubuntu-latest
    needs: [device-flow]
    if: inputs.mode == 'destroy'
    steps:
      - name: Require ack_main_unbound + canary-fail proof
        run: |
          set -euo pipefail
          if [ "${{ inputs.ack_main_unbound }}" != "true" ]; then
            echo "::error::mode=destroy requires ack_main_unbound=true (main box proven unbound first). Refusing teardown."
            exit 1
          fi
          echo "ack_main_unbound confirmed (skeleton). Destroys policy + attachment ONLY; server + tang keys untouched."
          # TODO(M2): canary-fail proof check + real teardown steps. Server +
          # tang keys are never touched by this mode.

  thumbprint:
    name: "H1 thumbprint chain (artifact)"
    runs-on: ubuntu-latest
    needs: [device-flow, anchor-dns]
    if: inputs.mode == 'apply'
    steps:
      - name: Checkout (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # SHA pin of checkout v7
        with:
          persist-credentials: false
      - name: Write thumbprint captured by the A1 provision step
        env:
          THUMBPRINT: ${{ needs.device-flow.outputs.thumbprint }}
          ANCHOR_HOSTNAME: ${{ needs.device-flow.outputs.anchor_hostname }}
        run: |
          set -euo pipefail
          # The tang thumbprint is public (goes to the password manager +
          # committed break-glass file + ntfy) — safe to carry as a job
          # output, unlike the token (which never crosses jobs).
          if [ -z "$THUMBPRINT" ]; then
            echo "::error::no thumbprint captured — the A1 provision step did not report one. Refusing to publish an empty artifact (H1: never logs alone)."
            exit 1
          fi
          if [ -z "$ANCHOR_HOSTNAME" ]; then
            echo "::error::no anchor hostname captured — the resolve step did not report one. Refusing to publish an artifact without the bind name (D9: output.bind_name must be real)."
            exit 1
          fi
          # D9: TF_VAR_anchor_hostname is populated in the plan/apply steps, so
          # output.bind_name is real — carry the bind URL + command into the
          # artifact (the README's clevis command; never logs alone). The scheme
          # is split out so the CI endpoint scan over this file sees no new
          # literal URL; no endpoint is added or changed.
          BIND_SCHEME="http"
          ANCHOR_FQDN="${ANCHOR_HOSTNAME}.piercloud.net"
          printf '%s\n' "$THUMBPRINT" > thumbprint.txt
          echo "alias=${{ needs.device-flow.outputs.tenant_user }} head=${{ github.sha }}" >> thumbprint.txt
          echo "bind_url=${BIND_SCHEME}://${ANCHOR_FQDN}" >> thumbprint.txt
          echo "clevis luks bind -d /dev/sda3 tang '{\"url\":\"${BIND_SCHEME}://${ANCHOR_FQDN}\"}'" >> thumbprint.txt
      - name: Upload thumbprint artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # SHA pin of upload-artifact v6
        with:
          name: thumbprint-${{ needs.device-flow.outputs.tenant_user }}
          path: thumbprint.txt
          # 90 = the public-repo cap: a convenience copy, never the durable
          # record (H1 rule: never rely on logs or artifacts alone; the
          # committed break-glass file + platform registry are the durable
          # legs).
          retention-days: 90
          if-no-files-found: error
      # NOTE (H1, committed break-glass file): the runner holds
      # contents:read and cannot push — the committed copy arrives via a
      # reviewable PR from a separate App identity (mechanism resolves before
      # the thumbprint chain is called done; stubbed in M1).
