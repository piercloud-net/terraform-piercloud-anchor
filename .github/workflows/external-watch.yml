# .github/workflows/external-watch.yml — always-on external watch (issue #94).
#
# Third vantage point for the "everything at the anchor looks silent" case:
# Gatus runs ON the anchor and the main-box canary runs on the main box, so
# neither can report its own host being down. This scheduled workflow probes
# the PUBLIC dashboard from GitHub's network — if both boxes are gone, the
# runner still runs and still files the incident.
#
# The probe itself is credential-free: public GETs only, no box access. Besides
# the run's GITHUB_TOKEN (issues: write, for the incident issues) the only
# secrets are the optional ntfy publish pairs (EXTERNAL_WATCH_NTFY_* or
# NTFY_*, #207); the push degrades to a logged no-op until a topic exists.
#
# Deliberately NOT in .github/scripts/: that path is scanned by CI's SCP
# endpoint allowlist (scope: provision.yml + .github/scripts/*.sh), which
# would reject the dashboard URL and the /api/v1 path as unlisted. New
# workflow files are out of that scope by construction.

name: external-watch

on:
  schedule:
    # Backstop cadence, not an SLO probe: GitHub may delay scheduled runs
    # under load (worst around the top of the hour).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "Override the probed base URL (default: the live dashboard). For proving the failure/recovery path."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

# One watcher at a time: overlapping runs could open/comment/close the
# incident issue out of order.
concurrency:
  group: external-watch
  cancel-in-progress: false

jobs:
  # Issue #207: one watch leg per tenant. A managed anchor keeps its values in
  # its own tenant environment; no job here selects an `environment:`, so the
  # watch cannot read them (tenant environments are also expected to deploy
  # from `v*` tags only — docs/usage.md). EXTERNAL_WATCH_TENANTS (repo variable)
  # lists the watched tenants instead; unset = the single legacy target.
  targets:
    name: resolve the watched tenants
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      refused: ${{ steps.targets.outputs.refused }}
    steps:
      - name: "Targets: EXTERNAL_WATCH_TENANTS or the legacy single target"
        id: targets
        env:
          WATCH_TENANTS: ${{ vars.EXTERNAL_WATCH_TENANTS }}
          PROBE_OVERRIDE: ${{ inputs.probe_url }}
          LEGACY_PROBE_URL: ${{ vars.STATUS_PROBE_URL }}
          LEGACY_STATUS_PULLER: ${{ vars.STATUS_PULLER }}
          LEGACY_TENANT_USER: ${{ vars.TENANT_USER }}
        run: |
          # --- watch-targets:start (tests/external-watch extracts this block) ---
          set -euo pipefail
          set -f  # entries are words, never globs
          export LC_ALL=C  # byte ranges: [a-z] never matches a non-ASCII letter
          legacy_matrix() {
            local puller=""
            case "${LEGACY_STATUS_PULLER:-}" in 1|true|yes|on) puller=on ;; esac
            jq -cn --arg alias "${LEGACY_TENANT_USER:-}" --arg puller "$puller" \
              --arg url "${PROBE_OVERRIDE:-${LEGACY_PROBE_URL:-}}" \
              '[{alias:$alias, label:"", puller:$puller, probe_url:$url, legacy:true}]'
          }
          # Parses the list; on a refusal prints the reason on stderr and
          # returns 1 (no partial matrix). A refusal names the entry's
          # position and the rule it broke, never its text: the reason lands
          # in the public run log, the config incident and the ntfy push.
          tenant_matrix() {
            local seen=" " matrix="[]" count=0 n=0 entry alias flag puller
            for entry in ${WATCH_TENANTS//,/ }; do
              n=$((n + 1))
              alias="${entry%%:*}"
              flag=""
              if [ "$alias" != "$entry" ]; then
                flag="${entry#*:}"
                [ -n "$flag" ] || { echo "entry ${n}: empty flag (write 'alias' or 'alias:puller')" >&2; return 1; }
              fi
              # The managed alias grammar (provision.yml tenant input):
              # ^[a-z0-9]{3,15}$, no reserved prefix, no reserved name.
              case "$alias" in
                ''|*[!a-z0-9]*) echo "entry ${n}: bad alias (must match ^[a-z0-9]{3,15}$, the managed tenant grammar)" >&2; return 1 ;;
                anchor*|status*|pcu*|platform*) echo "entry ${n}: bad alias (reserved prefix anchor/status/pcu/platform)" >&2; return 1 ;;
                edge|console|ops|keys|unlock|bounce|mail|broker|www) echo "entry ${n}: bad alias (reserved platform name)" >&2; return 1 ;;
              esac
              if [ "${#alias}" -lt 3 ] || [ "${#alias}" -gt 15 ]; then
                echo "entry ${n}: bad alias (length ${#alias}; must match ^[a-z0-9]{3,15}$, the managed tenant grammar)" >&2; return 1
              fi
              case "$flag" in
                '') puller="" ;;
                puller) puller=on ;;
                *) echo "entry ${n}: unknown flag (only ':puller')" >&2; return 1 ;;
              esac
              case "$seen" in *" ${alias} "*) echo "entry ${n}: duplicate alias" >&2; return 1 ;; esac
              seen="${seen}${alias} "
              count=$((count + 1))
              matrix="$(jq -c --arg alias "$alias" --arg puller "$puller" \
                '. + [{alias:$alias, label:$alias, puller:$puller, probe_url:("https://" + $alias + ".status.piercloud.net/"), legacy:false}]' <<<"$matrix")"
            done
            # GitHub expands at most 256 matrix legs; refuse here, where the
            # refusal still falls back and alerts, not at matrix expansion.
            if [ "$count" -gt 256 ]; then
              echo "${count} tenants exceed the 256-leg matrix cap" >&2; return 1
            fi
            if [ -n "${PROBE_OVERRIDE:-}" ]; then
              if [ "$count" -ne 1 ]; then
                echo "probe_url overrides exactly one target; EXTERNAL_WATCH_TENANTS lists ${count}" >&2; return 1
              fi
              matrix="$(jq -c --arg url "$PROBE_OVERRIDE" 'map(.probe_url = $url)' <<<"$matrix")"
            fi
            printf '%s\n' "$matrix"
          }
          refused=""
          # Strip exactly the parser's separators (IFS default + comma): a list of
          # only CR/VT/FF is a non-empty word to the parser, so it must refuse
          # there, never take the legacy path silently.
          if [ -z "${WATCH_TENANTS//[$' \t\n',]/}" ]; then
            # Legacy: today's single target, unchanged (tenant-owned copies).
            matrix="$(legacy_matrix)"
          else
            errf="$(mktemp)"
            if ! matrix="$(tenant_matrix 2>"$errf")"; then
              # A refused list must not silence the watch: fall back to the
              # legacy single target and let the config-incident job alert.
              refused="EXTERNAL_WATCH_TENANTS refused: $(head -n1 "$errf" | tr -d '\r')"
              echo "::error::${refused} - falling back to the legacy single target."
              matrix="$(legacy_matrix)"
            fi
            rm -f "$errf"
          fi
          # Count only: the per-tenant legs name their alias; one public log
          # line listing every watched alias is not needed.
          echo "watch targets: $(jq -r 'length' <<<"$matrix") ($(jq -r 'if .[0].legacy then "legacy" else "per-tenant" end' <<<"$matrix"))${refused:+ - config refused}"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              echo "matrix=${matrix}"
              echo "refused=${refused}"
            } >> "$GITHUB_OUTPUT"
          fi
          # --- watch-targets:end ---

  # A refused EXTERNAL_WATCH_TENANTS (or a broken targets job) must alert, not
  # skip silently: one config incident, open while refused, closed when the
  # list parses again; the run fails while it is open.
  config:
    name: watch config state
    needs: targets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Config incident (open while refused; auto-close when fixed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          REFUSED: ${{ needs.targets.outputs.refused }}
          WATCH_NTFY_TOPIC: ${{ secrets.EXTERNAL_WATCH_NTFY_TOPIC }}
          WATCH_NTFY_TOKEN: ${{ secrets.EXTERNAL_WATCH_NTFY_TOKEN }}
          REPO_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO_NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # --- watch-config:start ---
          set -euo pipefail
          detail=""
          if [ "$TARGETS_RESULT" != "success" ]; then
            detail="the targets job ended '${TARGETS_RESULT}' - no watch leg ran"
          elif [ -n "${REFUSED:-}" ]; then
            detail="${REFUSED} (watching the legacy single target only)"
          fi
          label=external-watch
          prefix="[external-watch] watch config refused:"
          gh label create "$label" --color B60205 \
            --description "Automated external-watch incident (GitHub-side cron; open = probe failing)" 2>/dev/null || true
          existing="$(gh issue list --label "$label" --state open --limit 100 --json number,title \
            | jq -r --arg p "$prefix" '[.[] | select(.title | startswith($p))] | sort_by(.number) | .[0].number // ""')"
          if [ -z "$detail" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Config parses again at $(date -u +%FT%TZ). Run: ${RUN_URL}"
              gh issue close "$existing"
            fi
            exit 0
          fi
          if [ -z "$existing" ]; then
            body="$(printf 'The external watch configuration was refused.\n\n- detail: %s\n- run: %s\n\nMachine-managed by `.github/workflows/external-watch.yml` - open = refused, auto-closed when the list parses.\n' "$detail" "$RUN_URL")"
            gh issue create --title "${prefix} ${detail}" --label "$label" --body "$body" \
              || gh issue create --title "${prefix} ${detail}" --body "$body"
            # Push once, when the incident opens (same channel pair rule as the legs).
            if [ -n "${WATCH_NTFY_TOPIC:-}" ]; then
              NTFY_TOPIC="$WATCH_NTFY_TOPIC"; NTFY_TOKEN="${WATCH_NTFY_TOKEN:-}"
            else
              NTFY_TOPIC="${REPO_NTFY_TOPIC:-}"; NTFY_TOKEN="${REPO_NTFY_TOKEN:-}"
            fi
            if [ -n "${NTFY_TOPIC:-}" ]; then
              NTFY_AUTH=()
              [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-H "Authorization: Bearer ${NTFY_TOKEN}")
              curl -sS --fail "${NTFY_AUTH[@]}" -H "Title: external watch config refused" \
                -H "Priority: high" -H "Tags: rotating_light" -d "${detail} - ${RUN_URL}" \
                "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null || echo "::warning::ntfy push failed"
            fi
          fi
          echo "::error::${detail}"
          exit 1
          # --- watch-config:end ---

  watch:
    name: probe ${{ matrix.target.label || 'the dashboard' }} from GitHub's network
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # Serial legs: each leg opens/comments/closes its own incident issue;
      # serial keeps label creation and the issue API calls ordered.
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7

      - name: "Probe: HTTP 200 + Gatus data + edge cert >= 14d"
        id: probe
        continue-on-error: true
        env:
          # At the A2 cutover (platform `*.status` records live, flat name
          # tombstoned) set the repo variable STATUS_PROBE_URL to the nested
          # dashboard URL. Until then it is unset and the shell default below
          # probes the flat name.
          # Per-tenant legs (#207) probe <alias>.status.piercloud.net; the
          # legacy leg keeps `inputs.probe_url || vars.STATUS_PROBE_URL`.
          PROBE_URL: ${{ matrix.target.probe_url }}
          # D6 "who watches the puller": when the puller is enabled on this
          # anchor, also assert the manifest freshness + the dashboard key set
          # (see the manifest-watch block below). TENANT_USER derives the
          # tenant manifest URL (meta-<alias>.piercloud.site).
          STATUS_PULLER: ${{ matrix.target.puller }}
          TENANT_USER: ${{ matrix.target.alias }}
          MIN_CERT_DAYS: "14"
          ATTEMPTS: "3"
          RETRY_SLEEP: "10"
        run: |
          # The probe is inline (not a .github/scripts/ file) on purpose —
          # see the header comment. Env knobs exist so the exact code can be
          # extracted and run locally against good/bad URLs.
          set -uo pipefail
          # Post-A2 cutover (2026-10-07): the nested
          # <tenant>.status.piercloud.net is live — the platform
          # `*.status` wildcard plus the explicit per-tenant dashboard CNAME
          # (ENT-proof: the ACME challenge node blocks wildcard synthesis on
          # RFC 4592-strict providers). The flat `status-<tenant>` form is
          # tombstoned; the default below is that legacy name only as the
          # last-resort fallback — every provisioned repo sets
          # STATUS_PROBE_URL to its nested URL (this repo:
          # https://pier.status.piercloud.net/).
          URL="${PROBE_URL:-https://status-pier.piercloud.net/}"
          base="${URL%/}"
          host="$(printf '%s' "$base" | sed -E 's#^[a-z]+://##; s#[:/].*$##')"
          fail=""
          for attempt in $(seq 1 "$ATTEMPTS"); do
            fail=""
            work="$(mktemp -d)"
            code="$(curl -sS -o "$work/body" -w '%{http_code}' --max-time 20 "$base/" 2>"$work/err" || true)"
            if [ "$code" != "200" ]; then
              fail="HTTP ${code:-<no-response>}"
              [ -s "$work/err" ] && fail="$fail ($(head -n1 "$work/err"))"
            elif ! grep -qi 'gatus' "$work/body"; then
              fail="HTTP 200 but the body is not the Gatus dashboard (marker missing)"
            fi
            if [ -z "$fail" ]; then
              api_code="$(curl -sS -o "$work/api" -w '%{http_code}' --max-time 20 "$base/api/v1/endpoints/statuses" 2>"$work/err" || true)"
              if [ "$api_code" != "200" ]; then
                fail="statuses API HTTP ${api_code:-<no-response>}"
              elif ! jq -e 'type == "array" and length >= 1' "$work/api" >/dev/null 2>&1; then
                fail="statuses API returned no endpoints"
              fi
            fi
            if [ -z "$fail" ]; then
              # `timeout` is GNU coreutils (absent on stock macOS) — fall back
              # to gtimeout, then to no timeout. The array expansion is
              # bash-3.2-safe (empty array + set -u would die otherwise).
              # -checkend does the date math portably, and the two branches
              # keep a broken probe distinct from a genuinely stale cert.
              TO=()
              command -v timeout  >/dev/null 2>&1 && TO=(timeout 15)
              [ "${#TO[@]}" -eq 0 ] && command -v gtimeout >/dev/null 2>&1 && TO=(gtimeout 15)
              openssl_out="$(echo | ${TO[@]+"${TO[@]}"} openssl s_client -connect "${host}:443" -servername "$host" 2>/dev/null || true)"
              if ! printf '%s' "$openssl_out" | grep -q 'BEGIN CERTIFICATE'; then
                fail="could not read the edge certificate from ${host}:443 (handshake failed or probe tooling broken)"
              elif ! printf '%s' "$openssl_out" | openssl x509 -checkend $(( MIN_CERT_DAYS * 86400 )) -noout >/dev/null 2>&1; then
                fail="edge certificate expires within ${MIN_CERT_DAYS}d (${host}:443)"
              fi
            fi
            # --- manifest-watch:start (tests/external-watch extracts this block) ---
            # D6 "who watches the puller": producer freshness (HTTP 200 +
            # generated_at <= 24h) AND the manifest entry set against the
            # dashboard's public endpoint keys (a changed manifest that never
            # reached Gatus = a dead puller timer / a frozen fragment). Runs
            # only when the puller is enabled (STATUS_PULLER); same fetch
            # discipline as the puller (HTTPS only, no redirects, bounded
            # time/size).
            case "${STATUS_PULLER:-}" in
              1|true|yes|on)
                manifest_fail=""
                manifest_files=""
                manifest_channels=""
                for manifest_channel in tenant platform; do
                  if [ "$manifest_channel" = "tenant" ]; then
                    if [ -z "${TENANT_USER:-}" ]; then
                      echo "manifest watch: TENANT_USER unset - checking the platform channel only"
                      continue
                    fi
                    manifest_url="https://meta-${TENANT_USER}.piercloud.site/.well-known/pc-status.json"
                  else
                    manifest_url="https://platform.piercloud.net/.well-known/pc-status.json"
                  fi
                  manifest_code="$(curl -sS -o "$work/manifest-${manifest_channel}.json" -w '%{http_code}' \
                    --proto '=https' --max-redirs 0 --max-time 20 --max-filesize 65536 \
                    "$manifest_url" 2>"$work/manifest-${manifest_channel}.err" || true)"
                  if [ "$manifest_code" = "404" ] || [ "$manifest_code" = "410" ]; then
                    echo "manifest watch: ${manifest_channel} manifest not published (HTTP ${manifest_code}) - keeping last-known-good"
                    continue
                  fi
                  if [ "$manifest_code" != "200" ]; then
                    manifest_fail="${manifest_fail}${manifest_channel} manifest HTTP ${manifest_code:-<none>}; "
                    continue
                  fi
                  manifest_gen="$(jq -r '.generated_at // ""' "$work/manifest-${manifest_channel}.json" 2>/dev/null | tr -d '\r\n' || true)"
                  manifest_epoch="$(date -u -d "$manifest_gen" +%s 2>/dev/null || echo 0)"
                  manifest_age=$(( $(date -u +%s) - manifest_epoch ))
                  if [ -z "$manifest_gen" ] || [ "$manifest_epoch" -le 0 ] || [ "$manifest_age" -gt 86400 ]; then
                    manifest_fail="${manifest_fail}${manifest_channel} manifest stale (generated_at=${manifest_gen:-missing}); "
                    continue
                  fi
                  if [ "$manifest_channel" = "tenant" ]; then
                    jq -n --arg alias "${TENANT_USER:-}" --slurpfile doc "$work/manifest-tenant.json" \
                      '[{name:"platform",group:"platform"},{name:"your piercloud",group:$alias},{name:"private (gate)",group:$alias}]
                       + (if ($doc[0].endpoints // [] | map(select((.disabled // false) == false and .type == "shared")) | length) > 0
                          then [{name:"shared (gate)",group:$alias}] else [] end)
                       + ($doc[0].endpoints // [] | map(select((.disabled // false) == false and .type == "public") | {name:.name, group:$alias}))' \
                      >"$work/manifest-expected-tenant.json" || manifest_fail="${manifest_fail}tenant manifest parse failed; "
                    manifest_files="${manifest_files} $work/manifest-expected-tenant.json"
                    manifest_channels="${manifest_channels} tenant"
                  else
                    jq -n --slurpfile doc "$work/manifest-platform.json" \
                      '($doc[0].platform // [] | map(select((.disabled // false) == false) | {name:.name, group:"platform"}))
                       + ($doc[0].hosts // [] | map(select((.disabled // false) == false) | {name:.name, group:"platform"}))
                       + (if ($doc[0].edge // false) then [{name:"public edge",group:"platform"}] else [] end)' \
                      >"$work/manifest-expected-platform.json" || manifest_fail="${manifest_fail}platform manifest parse failed; "
                    manifest_files="${manifest_files} $work/manifest-expected-platform.json"
                    manifest_channels="${manifest_channels} platform"
                  fi
                done
                # shellcheck disable=SC2086  # controlled $work paths
                jq -s 'add // []' $manifest_files >"$work/manifest-expected.json" 2>/dev/null \
                  || printf '[]\n' >"$work/manifest-expected.json"
                # The key-set check needs the statuses-API response; when the
                # probe failed before fetching it, the probe failure is the
                # verdict (do not clobber it with a derived error).
                if [ -f "$work/api" ]; then
                  manifest_missing="$(jq -rn --slurpfile expected "$work/manifest-expected.json" --slurpfile api "$work/api" '
                    ($api[0] | if type == "array" then . else [] end | map({name:(.name // ""), group:(.group // "")})) as $have
                    | [ $expected[0][] | . as $e | select(any($have[]; .name == $e.name and .group == $e.group) | not) | "\($e.group)/\($e.name)" ]
                    | join(", ")' 2>/dev/null | tr -d '\r\n' || echo "statuses API unreadable")"
                  if [ -n "$manifest_missing" ]; then
                    manifest_fail="${manifest_fail}manifest rows missing from the dashboard: ${manifest_missing}; "
                  fi
                  # Reverse direction (D6 removal drift): a dashboard row in a
                  # channel's own group that the just-fetched manifest does not
                  # justify is a stale fragment — a dead puller timer or a
                  # frozen row set. Only groups whose manifest parsed this run
                  # are checked (a 404/410 not-published channel keeps
                  # last-known-good, so its rows must not be flagged).
                  case " ${manifest_channels} " in *" tenant "*) want_alias=1 ;; *) want_alias=0 ;; esac
                  case " ${manifest_channels} " in *" platform "*) want_platform=1 ;; *) want_platform=0 ;; esac
                  manifest_extra="$(jq -rn --arg alias "${TENANT_USER:-}" --argjson want_alias "$want_alias" --argjson want_platform "$want_platform" --slurpfile expected "$work/manifest-expected.json" --slurpfile api "$work/api" '
                    ($api[0] | if type == "array" then . else [] end | map({name:(.name // ""), group:(.group // "")})) as $have
                    | [ $have[] | . as $h
                        | select(((($h.group == $alias) and ($want_alias == 1)) or (($h.group == "platform") and ($want_platform == 1)))
                                 and (any($expected[0][]; .name == $h.name and .group == $h.group) | not))
                        | "\($h.group)/\($h.name)" ]
                    | join(", ")' 2>/dev/null | tr -d '\r\n' || echo "statuses API unreadable")"
                  if [ -n "$manifest_extra" ]; then
                    manifest_fail="${manifest_fail}stale dashboard rows not in the manifest: ${manifest_extra}; "
                  fi
                fi
                if [ -n "$manifest_fail" ]; then
                  fail="${fail:+$fail }manifest watch: ${manifest_fail}"
                fi
              ;;
            esac
            # --- manifest-watch:end ---
            rm -rf "$work"
            [ -z "$fail" ] && break
            echo "attempt ${attempt}/${ATTEMPTS} failed: ${fail}"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$RETRY_SLEEP"
          done
          if [ -z "$fail" ]; then
            echo "external-watch: OK — ${base} served Gatus data and the edge certificate is valid >= ${MIN_CERT_DAYS}d"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "### external-watch: OK — \`${base}\` (cert >= ${MIN_CERT_DAYS}d)" >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "external-watch: FAIL — ${fail}"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              {
                echo "ok=false"
                echo "detail<<PC_WATCH_EOF"
                printf '%s\n' "${fail}" | tr -d '\r'
                echo "PC_WATCH_EOF"
              } >> "$GITHUB_OUTPUT"
            fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "### external-watch: FAIL — ${fail}" >> "$GITHUB_STEP_SUMMARY"; fi
            exit 1
          fi

      - name: ntfy push (no-op until a topic is set)
        if: steps.probe.outcome == 'failure'
        env:
          # EXTERNAL_WATCH_NTFY_* (#207): the watch's own channel — a managed
          # anchor's NTFY_* live in its environment, which this job (no
          # `environment:` key) cannot read. Outside the managed repo-scope refusal list on
          # purpose (no managed run reads them).
          WATCH_NTFY_TOPIC: ${{ secrets.EXTERNAL_WATCH_NTFY_TOPIC }}
          WATCH_NTFY_TOKEN: ${{ secrets.EXTERNAL_WATCH_NTFY_TOKEN }}
          REPO_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO_NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WATCH_ALIAS: ${{ matrix.target.label }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A topic and its token travel as a pair: never send one channel's
          # token to the other channel's topic.
          if [ -n "${WATCH_NTFY_TOPIC:-}" ]; then
            NTFY_TOPIC="$WATCH_NTFY_TOPIC"; NTFY_TOKEN="${WATCH_NTFY_TOKEN:-}"
          else
            NTFY_TOPIC="${REPO_NTFY_TOPIC:-}"; NTFY_TOKEN="${REPO_NTFY_TOKEN:-}"
          fi
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "No ntfy topic set (EXTERNAL_WATCH_NTFY_TOPIC or NTFY_TOPIC) — no push; the incident issue is the alert path."
            exit 0
          fi
          NTFY_AUTH=()
          [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-H "Authorization: Bearer ${NTFY_TOKEN}")
          if curl -sS --fail "${NTFY_AUTH[@]}" \
            -H "Title: ${WATCH_ALIAS:+${WATCH_ALIAS}: }anchor dashboard unreachable (external watch)" \
            -H "Priority: high" -H "Tags: rotating_light" \
            -d "${DETAIL:-probe failed} — ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null; then
            echo "ntfy push sent."
          else
            echo "::warning::ntfy push failed - the incident step still runs"
          fi

      - name: Incident state (issue = open while failing; auto-close on recovery)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OK: ${{ steps.probe.outputs.ok }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # One incident per tenant (#207); `label` is blank on the legacy leg,
          # which keeps the old title.
          WATCH_ALIAS: ${{ matrix.target.label }}
        run: |
          # --- watch-incident:start ---
          set -euo pipefail
          label=external-watch
          prefix="[external-watch] ${WATCH_ALIAS:+${WATCH_ALIAS}: }dashboard probe failing:"
          gh label create "$label" --color B60205 \
            --description "Automated external-watch incident (GitHub-side cron; open = probe failing)" 2>/dev/null || true
          existing="$(gh issue list --label "$label" --state open --limit 100 --json number,title \
            | jq -r --arg p "$prefix" '[.[] | select(.title | startswith($p))] | sort_by(.number) | .[0].number // ""')"
          if [ "$OK" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Recovered at $(date -u +%FT%TZ) — probe green again. Run: ${RUN_URL}"
              gh issue close "$existing"
              echo "closed external-watch incident #${existing}"
            else
              echo "probe OK; no open incident issue"
            fi
            exit 0
          fi
          body="$(printf 'External watch probe failed.\n\n- detail: %s\n- run: %s\n\nMachine-managed by `.github/workflows/external-watch.yml` — open = failing, auto-closed on recovery.\n' "${DETAIL:-unknown}" "${RUN_URL}")"
          if [ -n "$existing" ]; then
            last="$(gh issue view "$existing" --json comments --jq '(.comments | last | .createdAt) // empty')"
            if [ -z "$last" ] || [ "$(date -u -d "$last" +%s)" -le "$(date -u -d '6 hours ago' +%s)" ]; then
              gh issue comment "$existing" --body "Still failing (previous comment > 6h old): ${DETAIL:-unknown} — ${RUN_URL}"
            else
              echo "incident #${existing} already records this failure (<6h); no comment"
            fi
          else
            if ! gh issue create --title "${prefix} ${DETAIL:-unknown}" \
                 --label "$label" --body "$body"; then
              echo "::warning::could not attach the label — creating the incident without it"
              gh issue create --title "${prefix} ${DETAIL:-unknown}" --body "$body"
            fi
          fi
          # --- watch-incident:end ---

      - name: Fail the run on probe failure (GitHub notifies watchers)
        if: steps.probe.outcome == 'failure'
        run: exit 1
