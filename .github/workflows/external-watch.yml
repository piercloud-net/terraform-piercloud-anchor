# .github/workflows/external-watch.yml — always-on external watch (issue #94).
#
# Third vantage point for the "everything at the anchor looks silent" case:
# Gatus runs ON the anchor and the main-box canary runs on the main box, so
# neither can report its own host being down. This scheduled workflow probes
# the PUBLIC dashboard from GitHub's network — if both boxes are gone, the
# runner still runs and still files the incident.
#
# Credential-free probe: public GETs only (no tokens, no secrets). The one
# optional secret is the NTFY push; it degrades to a logged no-op until
# NTFY_TOPIC exists (same pattern as provision.yml).
#
# Deliberately NOT in .github/scripts/: that path is scanned by CI's SCP
# endpoint allowlist (scope: provision.yml + .github/scripts/*.sh), which
# would reject the dashboard URL and the /api/v1 path as unlisted. New
# workflow files are out of that scope by construction.

name: external-watch

on:
  schedule:
    # Backstop cadence, not an SLO probe: GitHub may delay scheduled runs
    # under load (worst around the top of the hour).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      probe_url:
        description: "Override the probed base URL (default: the live dashboard). For proving the failure/recovery path."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

# One watcher at a time: overlapping runs could open/comment/close the
# incident issue out of order.
concurrency:
  group: external-watch
  cancel-in-progress: false

jobs:
  watch:
    name: probe the dashboard from GitHub's network
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7

      - name: "Probe: HTTP 200 + Gatus data + edge cert >= 14d"
        id: probe
        continue-on-error: true
        env:
          # At the A2 cutover (platform `*.status` records live, flat name
          # tombstoned) set the repo variable STATUS_PROBE_URL to the nested
          # dashboard URL. Until then it is unset and the shell default below
          # probes the flat name.
          PROBE_URL: ${{ inputs.probe_url || vars.STATUS_PROBE_URL }}
          # D6 "who watches the puller": when the puller is enabled on this
          # anchor, also assert the manifest freshness + the dashboard key set
          # (see the manifest-watch block below). TENANT_USER derives the
          # tenant manifest URL (meta-<alias>.piercloud.site).
          STATUS_PULLER: ${{ vars.STATUS_PULLER }}
          TENANT_USER: ${{ vars.TENANT_USER }}
          MIN_CERT_DAYS: "14"
          ATTEMPTS: "3"
          RETRY_SLEEP: "10"
        run: |
          # The probe is inline (not a .github/scripts/ file) on purpose —
          # see the header comment. Env knobs exist so the exact code can be
          # extracted and run locally against good/bad URLs.
          set -uo pipefail
          # Post-A2 cutover (2026-10-07): the nested
          # <tenant>.status.piercloud.net is live — the platform
          # `*.status` wildcard plus the explicit per-tenant dashboard CNAME
          # (ENT-proof: the ACME challenge node blocks wildcard synthesis on
          # RFC 4592-strict providers). The flat `status-<tenant>` form is
          # tombstoned; the default below is that legacy name only as the
          # last-resort fallback — every provisioned repo sets
          # STATUS_PROBE_URL to its nested URL (this repo:
          # https://pier.status.piercloud.net/).
          URL="${PROBE_URL:-https://status-pier.piercloud.net/}"
          base="${URL%/}"
          host="$(printf '%s' "$base" | sed -E 's#^[a-z]+://##; s#[:/].*$##')"
          fail=""
          for attempt in $(seq 1 "$ATTEMPTS"); do
            fail=""
            work="$(mktemp -d)"
            code="$(curl -sS -o "$work/body" -w '%{http_code}' --max-time 20 "$base/" 2>"$work/err" || true)"
            if [ "$code" != "200" ]; then
              fail="HTTP ${code:-<no-response>}"
              [ -s "$work/err" ] && fail="$fail ($(head -n1 "$work/err"))"
            elif ! grep -qi 'gatus' "$work/body"; then
              fail="HTTP 200 but the body is not the Gatus dashboard (marker missing)"
            fi
            if [ -z "$fail" ]; then
              api_code="$(curl -sS -o "$work/api" -w '%{http_code}' --max-time 20 "$base/api/v1/endpoints/statuses" 2>"$work/err" || true)"
              if [ "$api_code" != "200" ]; then
                fail="statuses API HTTP ${api_code:-<no-response>}"
              elif ! jq -e 'type == "array" and length >= 1' "$work/api" >/dev/null 2>&1; then
                fail="statuses API returned no endpoints"
              fi
            fi
            if [ -z "$fail" ]; then
              # `timeout` is GNU coreutils (absent on stock macOS) — fall back
              # to gtimeout, then to no timeout. The array expansion is
              # bash-3.2-safe (empty array + set -u would die otherwise).
              # -checkend does the date math portably, and the two branches
              # keep a broken probe distinct from a genuinely stale cert.
              TO=()
              command -v timeout  >/dev/null 2>&1 && TO=(timeout 15)
              [ "${#TO[@]}" -eq 0 ] && command -v gtimeout >/dev/null 2>&1 && TO=(gtimeout 15)
              openssl_out="$(echo | ${TO[@]+"${TO[@]}"} openssl s_client -connect "${host}:443" -servername "$host" 2>/dev/null || true)"
              if ! printf '%s' "$openssl_out" | grep -q 'BEGIN CERTIFICATE'; then
                fail="could not read the edge certificate from ${host}:443 (handshake failed or probe tooling broken)"
              elif ! printf '%s' "$openssl_out" | openssl x509 -checkend $(( MIN_CERT_DAYS * 86400 )) -noout >/dev/null 2>&1; then
                fail="edge certificate expires within ${MIN_CERT_DAYS}d (${host}:443)"
              fi
            fi
            # --- manifest-watch:start (tests/external-watch extracts this block) ---
            # D6 "who watches the puller": producer freshness (HTTP 200 +
            # generated_at <= 24h) AND the manifest entry set against the
            # dashboard's public endpoint keys (a changed manifest that never
            # reached Gatus = a dead puller timer / a frozen fragment). Runs
            # only when the puller is enabled (STATUS_PULLER); same fetch
            # discipline as the puller (HTTPS only, no redirects, bounded
            # time/size).
            case "${STATUS_PULLER:-}" in
              1|true|yes|on)
                manifest_fail=""
                manifest_files=""
                for manifest_channel in tenant platform; do
                  if [ "$manifest_channel" = "tenant" ]; then
                    if [ -z "${TENANT_USER:-}" ]; then
                      echo "manifest watch: TENANT_USER unset - checking the platform channel only"
                      continue
                    fi
                    manifest_url="https://meta-${TENANT_USER}.piercloud.site/.well-known/pc-status.json"
                  else
                    manifest_url="https://platform.piercloud.net/.well-known/pc-status.json"
                  fi
                  manifest_code="$(curl -sS -o "$work/manifest-${manifest_channel}.json" -w '%{http_code}' \
                    --proto '=https' --max-redirs 0 --max-time 20 --max-filesize 65536 \
                    "$manifest_url" 2>"$work/manifest-${manifest_channel}.err" || true)"
                  if [ "$manifest_code" != "200" ]; then
                    manifest_fail="${manifest_fail}${manifest_channel} manifest HTTP ${manifest_code:-<none>}; "
                    continue
                  fi
                  manifest_gen="$(jq -r '.generated_at // ""' "$work/manifest-${manifest_channel}.json" 2>/dev/null || true)"
                  manifest_epoch="$(date -u -d "$manifest_gen" +%s 2>/dev/null || echo 0)"
                  manifest_age=$(( $(date -u +%s) - manifest_epoch ))
                  if [ -z "$manifest_gen" ] || [ "$manifest_epoch" -le 0 ] || [ "$manifest_age" -gt 86400 ]; then
                    manifest_fail="${manifest_fail}${manifest_channel} manifest stale (generated_at=${manifest_gen:-missing}); "
                    continue
                  fi
                  if [ "$manifest_channel" = "tenant" ]; then
                    jq -n --arg alias "${TENANT_USER:-}" --slurpfile doc "$work/manifest-tenant.json" \
                      '[{name:"platform",group:"platform"},{name:"your piercloud",group:$alias},{name:"private (gate)",group:$alias}]
                       + ($doc[0].endpoints // [] | map(select((.disabled // false) == false) | {name:.name, group:$alias}))' \
                      >"$work/manifest-expected-tenant.json" || manifest_fail="${manifest_fail}tenant manifest parse failed; "
                    manifest_files="${manifest_files} $work/manifest-expected-tenant.json"
                  else
                    jq -n --slurpfile doc "$work/manifest-platform.json" \
                      '($doc[0].platform // [] | map(select((.disabled // false) == false) | {name:.name, group:"platform"}))
                       + ($doc[0].hosts // [] | map(select((.disabled // false) == false) | {name:.name, group:"platform"}))' \
                      >"$work/manifest-expected-platform.json" || manifest_fail="${manifest_fail}platform manifest parse failed; "
                    manifest_files="${manifest_files} $work/manifest-expected-platform.json"
                  fi
                done
                # shellcheck disable=SC2086  # controlled $work paths
                jq -s 'add // []' $manifest_files >"$work/manifest-expected.json" 2>/dev/null \
                  || printf '[]\n' >"$work/manifest-expected.json"
                manifest_missing="$(jq -rn --slurpfile expected "$work/manifest-expected.json" --slurpfile api "$work/api" '
                  ($api[0] | if type == "array" then . else [] end | map({name:(.name // ""), group:(.group // "")})) as $have
                  | [ $expected[0][] | . as $e | select(any($have[]; .name == $e.name and .group == $e.group) | not) | "\($e.group)/\($e.name)" ]
                  | join(", ")' 2>/dev/null || echo "statuses API unreadable")"
                if [ -n "$manifest_missing" ]; then
                  manifest_fail="${manifest_fail}manifest rows missing from the dashboard: ${manifest_missing}; "
                fi
                if [ -n "$manifest_fail" ]; then
                  fail="manifest watch: ${manifest_fail}"
                fi
              ;;
            esac
            # --- manifest-watch:end ---
            rm -rf "$work"
            [ -z "$fail" ] && break
            echo "attempt ${attempt}/${ATTEMPTS} failed: ${fail}"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$RETRY_SLEEP"
          done
          if [ -z "$fail" ]; then
            echo "external-watch: OK — ${base} served Gatus data and the edge certificate is valid >= ${MIN_CERT_DAYS}d"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "### external-watch: OK — \`${base}\` (cert >= ${MIN_CERT_DAYS}d)" >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo "external-watch: FAIL — ${fail}"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "detail=${fail}" >> "$GITHUB_OUTPUT"
            fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "### external-watch: FAIL — ${fail}" >> "$GITHUB_STEP_SUMMARY"; fi
            exit 1
          fi

      - name: ntfy push (no-op until NTFY_TOPIC is set)
        if: steps.probe.outcome == 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC unset — no push; the incident issue is the alert path."
            exit 0
          fi
          NTFY_AUTH=()
          [ -n "${NTFY_TOKEN:-}" ] && NTFY_AUTH=(-H "Authorization: Bearer ${NTFY_TOKEN}")
          curl -sS --fail "${NTFY_AUTH[@]}" \
            -H "Title: anchor dashboard unreachable (external watch)" \
            -H "Priority: high" -H "Tags: rotating_light" \
            -d "${DETAIL:-probe failed} — ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null
          echo "ntfy push sent."

      - name: Incident state (issue = open while failing; auto-close on recovery)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OK: ${{ steps.probe.outputs.ok }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=external-watch
          gh label create "$label" --color B60205 \
            --description "Automated external-watch incident (GitHub-side cron; open = probe failing)" 2>/dev/null || true
          existing="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ "$OK" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Recovered at $(date -u +%FT%TZ) — probe green again. Run: ${RUN_URL}"
              gh issue close "$existing"
              echo "closed external-watch incident #${existing}"
            else
              echo "probe OK; no open incident issue"
            fi
            exit 0
          fi
          body="$(printf 'External watch probe failed.\n\n- detail: %s\n- run: %s\n\nMachine-managed by `.github/workflows/external-watch.yml` — open = failing, auto-closed on recovery.\n' "${DETAIL:-unknown}" "${RUN_URL}")"
          if [ -n "$existing" ]; then
            last="$(gh issue view "$existing" --json comments --jq '(.comments | last | .createdAt) // empty')"
            if [ -z "$last" ] || [ "$(date -u -d "$last" +%s)" -le "$(date -u -d '6 hours ago' +%s)" ]; then
              gh issue comment "$existing" --body "Still failing (previous comment > 6h old): ${DETAIL:-unknown} — ${RUN_URL}"
            else
              echo "incident #${existing} already records this failure (<6h); no comment"
            fi
          else
            if ! gh issue create --title "[external-watch] dashboard probe failing: ${DETAIL:-unknown}" \
                 --label "$label" --body "$body"; then
              echo "::warning::could not attach the label — creating the incident without it"
              gh issue create --title "[external-watch] dashboard probe failing: ${DETAIL:-unknown}" --body "$body"
            fi
          fi

      - name: Fail the run on probe failure (GitHub notifies watchers)
        if: steps.probe.outcome == 'failure'
        run: exit 1
