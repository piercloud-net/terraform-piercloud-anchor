name: Auto Release

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: cad0p/semver-calver-release/release@b57af46335825afcbf8173a9fa0a32dbee8d1a01 # v1
        with:
          skip_release: ${{ github.ref != 'refs/heads/main' }}
