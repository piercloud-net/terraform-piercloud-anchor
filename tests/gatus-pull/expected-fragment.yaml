# DISPATCH-MANAGED by terraform-piercloud-anchor (gatus puller).
# DO NOT EDIT BY HAND - re-rendered from the tenant + platform manifests.
endpoints:
  - name: platform
    group: platform
    url: https://platform.piercloud.net/healthz
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    client:
      ignore-redirect: true
    alerts:
      - type: custom
        failure-threshold: 3
        send-on-resolved: true
        provider-override:
          placeholders:
            ALERT_TRIGGERED_OR_RESOLVED:
              TRIGGERED: "5"
              RESOLVED: "3"
